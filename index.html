<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Mapa de Entregas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f3f6;
      color: #172033;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================================================
       CABEÇALHO
    ========================================================= */

    .header {
      background: #111827;
      color: white;
      padding: 14px 18px 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.1;
    }

    .title-area p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #cbd5e1;
    }

    .counter {
      flex-shrink: 0;
      min-width: 68px;
      height: 58px;
      border-radius: 18px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
    }

    /* =========================================================
       BOTÕES
    ========================================================= */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .action-btn {
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      padding: 8px 12px;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-localizar {
      background: #2563eb;
    }

    .btn-gps {
      background: #059669;
    }

    .btn-falhas {
      background: #ea8a00;
    }

    .btn-exportar {
      background: #475569;
    }

    /* =========================================================
       MAPA
    ========================================================= */

    .map-section {
      width: 100%;
      background: #d1d5db;
      padding: 0;
    }

    .map-shell {
      position: relative;
      width: 100%;
      height: 31vh;
      min-height: 230px;
      max-height: 340px;
      overflow: hidden;
      transition: height 0.25s ease;
      background: #d1d5db;
    }

    .map-shell.expanded {
      height: 70vh;
      min-height: 420px;
      max-height: none;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #d1d5db;
    }

    .map-toggle {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;

      border: 0;
      border-radius: 14px;

      background: white;
      color: #172033;

      padding: 12px 15px;

      font-size: 17px;
      font-weight: 800;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.20);

      cursor: pointer;
      touch-action: manipulation;
    }

    .leaflet-control-zoom {
      margin-left: 10px !important;
      margin-top: 10px !important;
    }

    .leaflet-control-zoom a {
      width: 44px !important;
      height: 44px !important;
      line-height: 42px !important;
      font-size: 28px !important;
    }

    /* =========================================================
       PROGRESSO
    ========================================================= */

    .progress-section {
      background: white;
      padding: 12px 18px 14px;
      border-bottom: 1px solid #d9dee7;
    }

    .status-main {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .status-detail {
      font-size: 14px;
      color: #64748b;
      min-height: 18px;
      margin-bottom: 8px;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #2563eb;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    /* =========================================================
       LISTA
    ========================================================= */

    .list-section {
      background: #f1f3f6;
      padding-bottom: 30px;
    }

    .list-title {
      background: white;
      padding: 14px 18px;
      border-bottom: 1px solid #d9dee7;
      font-size: 20px;
      font-weight: 800;
    }

    .delivery-list {
      padding: 10px 10px 30px;
    }

    .delivery-card {
      background: white;
      border-radius: 17px;
      margin-bottom: 11px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      border-left: 6px solid #2563eb;
    }

    .delivery-card.status-carta {
      border-left-color: #059669;
    }

    .delivery-card.status-nao-localizado {
      border-left-color: #f59e0b;
    }

    .delivery-card.status-risco {
      border-left-color: #dc2626;
    }

    .delivery-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .delivery-title {
      font-size: 20px;
      font-weight: 800;
    }

    .distance {
      color: #2563eb;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .delivery-address {
      margin-top: 9px;
      color: #4b5563;
      font-size: 16px;
      line-height: 1.4;
    }

    .corrected-neighborhood {
      margin-top: 7px;
      color: #059669;
      font-size: 14px;
      font-weight: 700;
    }

    .delivery-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .card-btn {
      border: 0;
      border-radius: 13px;
      min-height: 48px;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .navigate-btn {
      background: #2563eb;
    }

    .status-btn {
      background: #6b7280;
    }

    .empty {
      padding: 30px 18px;
      text-align: center;
      color: #64748b;
      font-size: 17px;
      background: white;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-backdrop {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 5000;

      background: rgba(15, 23, 42, 0.58);

      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;

      background: white;

      border-radius: 22px 22px 0 0;

      padding: 20px;

      box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .modal-address {
      color: #64748b;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .status-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }

    .status-option {
      border: 0;
      border-radius: 13px;
      min-height: 52px;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-carta-btn {
      background: #059669;
    }

    .status-nao-btn {
      background: #f59e0b;
    }

    .status-risco-btn {
      background: #dc2626;
    }

    .close-modal {
      margin-top: 10px;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      background: #e5e7eb;
      font-size: 16px;
      font-weight: 800;
    }

    /* =========================================================
       CLUSTER
    ========================================================= */

    .marker-cluster-small {
      background: rgba(37, 99, 235, 0.35);
    }

    .marker-cluster-small div {
      background: #2563eb;
      color: white;
      font-weight: 800;
    }

    .marker-cluster-medium {
      background: rgba(234, 138, 0, 0.35);
    }

    .marker-cluster-medium div {
      background: #ea8a00;
      color: white;
      font-weight: 800;
    }

    .marker-cluster-large {
      background: rgba(220, 38, 38, 0.35);
    }

    .marker-cluster-large div {
      background: #dc2626;
      color: white;
      font-weight: 800;
    }

    /* =========================================================
       DESKTOP
    ========================================================= */

    @media (min-width: 800px) {
      .header {
        padding-left: 28px;
        padding-right: 28px;
      }

      .actions {
        grid-template-columns: repeat(4, 1fr);
      }

      .delivery-list {
        max-width: 900px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       CABEÇALHO
  ======================================================== -->

  <header class="header">

    <div class="header-top">

      <div class="title-area">
        <h1>📦 Mapa de Entregas</h1>
        <p>Localização inteligente dos clientes</p>
      </div>

      <div class="counter" id="counter">
        0/0
      </div>

    </div>

    <div class="actions">

      <button
        class="action-btn btn-localizar"
        id="geocodeBtn"
      >
        🗺️ Localizar
      </button>

      <button
        class="action-btn btn-gps"
        id="gpsBtn"
      >
        📍 GPS
      </button>

      <button
        class="action-btn btn-falhas"
        id="retryBtn"
      >
        🔄 Falhas
      </button>

      <button
        class="action-btn btn-exportar"
        id="exportBtn"
      >
        📤 Exportar
      </button>

    </div>

  </header>


  <!-- =======================================================
       MAPA
  ======================================================== -->

  <section class="map-section">

    <div
      class="map-shell"
      id="mapShell"
    >

      <div id="map"></div>

      <button
        class="map-toggle"
        id="mapToggle"
      >
        ⛶ Expandir mapa
      </button>

    </div>

  </section>


  <!-- =======================================================
       PROGRESSO
  ======================================================== -->

  <section class="progress-section">

    <div
      class="status-main"
      id="geocodeStatus"
    >
      Preparando...
    </div>

    <div
      class="status-detail"
      id="geocodeDetail"
    >
      Aguarde.
    </div>

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar"
      ></div>
    </div>

  </section>


  <!-- =======================================================
       LISTA
  ======================================================== -->

  <section class="list-section">

    <div
      class="list-title"
      id="listTitle"
    >
      📍 Entregas pendentes — 0 clientes
    </div>

    <div
      class="delivery-list"
      id="deliveryList"
    >
    </div>

  </section>


  <!-- =======================================================
       MODAL DE STATUS
  ======================================================== -->

  <div
    class="modal-backdrop"
    id="modalBackdrop"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Status da entrega
      </h2>

      <div
        class="modal-address"
        id="modalAddress"
      >
      </div>

      <div class="status-options">

        <button
          class="status-option status-carta-btn"
          data-status="CARTA"
        >
          ✉️ Carta
        </button>

        <button
          class="status-option status-nao-btn"
          data-status="NAO_LOCALIZADO"
        >
          🔎 Não localizado
        </button>

        <button
          class="status-option status-risco-btn"
          data-status="ZONA_RISCO"
        >
          ⚠️ Zona de risco
        </button>

      </div>

      <button
        class="close-modal"
        id="closeModal"
      >
        Fechar
      </button>

    </div>

  </div>


  <!-- =======================================================
       SCRIPTS
  ======================================================== -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="./clientes.js"></script>


  <script>

    /* =========================================================
       CONFIGURAÇÃO
    ========================================================= */

    const STORAGE_KEY = "mapa_entregas_clientes_v5";

    const OLD_STORAGE_KEYS = [
      "mapa_entregas_clientes_v4",
      "mapa_entregas_clientes_v3",
      "mapa_entregas_clientes_v2"
    ];

    const CACHE_KEY = "mapa_entregas_geocache_v5";

    const DEFAULT_CENTER = [
      -29.1678,
      -51.1794
    ];

    const NOMINATIM_DELAY = 1200;

    const NOMINATIM_TIMEOUT = 8000;


    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const counterEl =
      document.getElementById("counter");

    const geocodeBtn =
      document.getElementById("geocodeBtn");

    const gpsBtn =
      document.getElementById("gpsBtn");

    const retryBtn =
      document.getElementById("retryBtn");

    const exportBtn =
      document.getElementById("exportBtn");

    const mapShell =
      document.getElementById("mapShell");

    const mapToggle =
      document.getElementById("mapToggle");

    const geocodeStatus =
      document.getElementById("geocodeStatus");

    const geocodeDetail =
      document.getElementById("geocodeDetail");

    const progressBar =
      document.getElementById("progressBar");

    const listTitle =
      document.getElementById("listTitle");

    const deliveryList =
      document.getElementById("deliveryList");

    const modalBackdrop =
      document.getElementById("modalBackdrop");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalAddress =
      document.getElementById("modalAddress");

    const closeModal =
      document.getElementById("closeModal");


    /* =========================================================
       DADOS
    ========================================================= */

    const CLIENTES_ORIGINAIS =
      Array.isArray(window.CLIENTES)
        ? window.CLIENTES
        : [];


    let deliveries = [];

    let geocache = {};

    let userPosition = null;

    let currentModalId = null;

    let lastNominatimRequest = 0;


    /* =========================================================
       FUNÇÕES BÁSICAS
    ========================================================= */

    function normalize(value) {

      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();

    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function validCoordinate(lat, lon) {

      return Number.isFinite(Number(lat)) &&
             Number.isFinite(Number(lon));

    }


    function distanceKm(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371;

      const dLat =
        (lat2 - lat1) *
        Math.PI /
        180;

      const dLon =
        (lon2 - lon1) *
        Math.PI /
        180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      return (
        R *
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        )
      );

    }


    function wait(ms) {

      return new Promise(resolve => {
        setTimeout(resolve, ms);
      });

    }


    /* =========================================================
       ENDEREÇO
    ========================================================= */

    function getAddress(cliente) {

      if (cliente.address) {
        return cliente.address;
      }

      if (cliente.endereco) {
        return cliente.endereco;
      }

      const parts = [];

      if (cliente.rua) {
        parts.push(cliente.rua);
      }

      if (cliente.numero) {
        parts.push(cliente.numero);
      }

      if (cliente.bairro) {
        parts.push(cliente.bairro);
      }

      if (cliente.cidade) {
        parts.push(cliente.cidade);
      }

      if (cliente.uf) {
        parts.push(cliente.uf);
      }

      return parts.join(", ");

    }


    function parseAddress(address) {

      const parts =
        String(address || "")
          .split(",")
          .map(item => item.trim())
          .filter(Boolean);

      let street = parts[0] || "";

      let number = "";

      let neighborhood = "";

      const numberMatch =
        String(parts[1] || "")
          .match(/\d+[A-Za-z]?/);

      if (numberMatch) {
        number = numberMatch[0];
      }

      if (parts.length >= 3) {
        neighborhood = parts[2];
      }

      return {
        street,
        number,
        neighborhood
      };

    }


    /* =========================================================
       STORAGE
    ========================================================= */

    function readJson(key) {

      try {

        const value =
          localStorage.getItem(key);

        if (!value) {
          return null;
        }

        return JSON.parse(value);

      } catch (error) {

        console.warn(
          "Erro lendo storage:",
          key,
          error
        );

        return null;

      }

    }


    function saveData() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(deliveries)
        );

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(geocache)
        );

      } catch (error) {

        console.warn(
          "Não foi possível salvar:",
          error
        );

      }

    }


    function loadData() {

      let saved =
        readJson(STORAGE_KEY);

      if (!Array.isArray(saved)) {

        for (const oldKey of OLD_STORAGE_KEYS) {

          const old =
            readJson(oldKey);

          if (Array.isArray(old)) {

            saved = old;

            break;

          }

        }

      }

      const savedById =
        new Map();

      if (Array.isArray(saved)) {

        saved.forEach(item => {

          if (item && item.id != null) {

            savedById.set(
              Number(item.id),
              item
            );

          }

        });

      }


      const cache =
        readJson(CACHE_KEY);

      if (cache && typeof cache === "object") {

        geocache = cache;

      }


      deliveries =
        CLIENTES_ORIGINAIS.map(cliente => {

          const id =
            Number(cliente.id);

          const old =
            savedById.get(id) || {};

          const address =
            getAddress(cliente);

          return {

            id,

            label:
              old.label ||
              cliente.nome ||
              ("Entrega " + id),

            address,

            status:
              old.status ||
              "PENDENTE",

            lat:
              validCoordinate(
                old.lat,
                old.lon
              )
                ? Number(old.lat)
                : validCoordinate(
                    cliente.lat,
                    cliente.lon
                  )
                  ? Number(cliente.lat)
                  : null,

            lon:
              validCoordinate(
                old.lat,
                old.lon
              )
                ? Number(old.lon)
                : validCoordinate(
                    cliente.lat,
                    cliente.lon
                  )
                  ? Number(cliente.lon)
                  : null,

            updatedAt:
              old.updatedAt || null,

            correctedNeighborhood:
              old.correctedNeighborhood || "",

            geocodeSource:
              old.geocodeSource || "",

            geocodeError:
              old.geocodeError || "",

            geocodeDisplayName:
              old.geocodeDisplayName || "",

            actions:
              Array.isArray(old.actions)
                ? old.actions
                : []

          };

        });


      /*
       * Recupera coordenadas do cache.
       */

      deliveries.forEach(d => {

        if (
          !validCoordinate(
            d.lat,
            d.lon
          )
        ) {

          const cacheKey =
            normalize(d.address);

          const cached =
            geocache[cacheKey];

          if (
            cached &&
            validCoordinate(
              cached.lat,
              cached.lon
            )
          ) {

            d.lat =
              Number(cached.lat);

            d.lon =
              Number(cached.lon);

            d.correctedNeighborhood =
              cached.correctedNeighborhood || "";

            d.geocodeSource =
              cached.geocodeSource || "cache";

            d.geocodeDisplayName =
              cached.displayName || "";

          }

        }

      });


      saveData();

    }


    /* =========================================================
       MAPA
    ========================================================= */

    const map =
      L.map("map", {
        zoomControl: true,
        preferCanvas: true
      }).setView(
        DEFAULT_CENTER,
        12
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    let markerLayer;

    if (
      typeof L.markerClusterGroup === "function"
    ) {

      markerLayer =
        L.markerClusterGroup({

          maxClusterRadius: 45,

          disableClusteringAtZoom: 16,

          spiderfyOnMaxZoom: true,

          showCoverageOnHover: false,

          zoomToBoundsOnClick: true

        });

    } else {

      markerLayer =
        L.layerGroup();

    }


    map.addLayer(markerLayer);


    const markerById =
      new Map();


    /* =========================================================
       MAPA COMPACTO / EXPANDIDO
    ========================================================= */

    function refreshMapSize() {

      setTimeout(() => {

        map.invalidateSize({
          pan: false
        });

      }, 50);


      setTimeout(() => {

        map.invalidateSize({
          pan: false
        });

      }, 350);

    }


    mapToggle.addEventListener(
      "click",
      () => {

        const expanded =
          mapShell.classList.toggle(
            "expanded"
          );

        mapToggle.textContent =
          expanded
            ? "↙ Fechar mapa"
            : "⛶ Expandir mapa";

        refreshMapSize();

      }
    );


    window.addEventListener(
      "resize",
      refreshMapSize
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          refreshMapSize,
          300
        );

      }
    );


    /* =========================================================
       MARCADORES
    ========================================================= */

    function markerColor(status) {

      if (status === "CARTA") {
        return "#059669";
      }

      if (status === "NAO_LOCALIZADO") {
        return "#f59e0b";
      }

      if (status === "ZONA_RISCO") {
        return "#dc2626";
      }

      return "#2563eb";

    }


    function renderMarkers() {

      markerLayer.clearLayers();

      markerById.clear();


      deliveries.forEach(d => {

        if (
          !validCoordinate(
            d.lat,
            d.lon
          )
        ) {
          return;
        }


        const color =

    function renderDeliveryList() {

      deliveryList.innerHTML = "";


      const pending =
        deliveries.filter(
          d => d.status === "PENDENTE"
        );


      if (!pending.length) {

        deliveryList.innerHTML = `
          <div class="empty">
            🎉 Não existem entregas pendentes.
          </div>
        `;

        return;

      }


      const origin =
        getSortOrigin();


      const sorted =
        pending.map(d => {

          let distance = null;

          if (
            validCoordinate(
              d.lat,
              d.lon
            )
          ) {

            distance =
              distanceKm(
                origin.lat,
                origin.lon,
                Number(d.lat),
                Number(d.lon)
              );

          }

          return {
            delivery: d,
            distance
          };

        });


      sorted.sort(
        (a, b) => {

          if (
            a.distance == null &&
            b.distance == null
          ) {
            return a.delivery.id -
                   b.delivery.id;
          }

          if (a.distance == null) {
            return 1;
          }

          if (b.distance == null) {
            return -1;
          }

          return (
            a.distance -
            b.distance
          );

        }
      );


      /*
       * IMPORTANTE:
       *
       * Não existe slice(0, 5).
       * A lista mostra TODOS.
       */

      sorted.forEach(item => {

        const d =
          item.delivery;

        const card =
          document.createElement("div");


        let statusClass = "";

        if (d.status === "CARTA") {
          statusClass = "status-carta";
        }

        if (
          d.status === "NAO_LOCALIZADO"
        ) {
          statusClass =
            "status-nao-localizado";
        }

        if (
          d.status === "ZONA_RISCO"
        ) {
          statusClass =
            "status-risco";
        }


        card.className =
          "delivery-card " +
          statusClass;


        const distanceText =
          item.distance == null
            ? "Sem localização"
            : item.distance < 1
              ? Math.round(
                  item.distance * 1000
                ) + " m"
              : item.distance.toFixed(1) +
                " km";


        const corrected =
          d.correctedNeighborhood
            ? `
              <div class="corrected-neighborhood">
                📍 Bairro localizado:
                ${escapeHtml(
                  d.correctedNeighborhood
                )}
              </div>
            `
            : "";


        card.innerHTML = `

          <div class="delivery-head">

            <div class="delivery-title">
              ${escapeHtml(d.label)}
            </div>

            <div class="distance">
              ${distanceText}
            </div>

          </div>

          <div class="delivery-address">
            ${escapeHtml(d.address)}
          </div>

          ${corrected}

          <div class="delivery-buttons">

            <button
              class="card-btn navigate-btn"
              data-action="navigate"
              data-id="${d.id}"
            >
              🧭 Navegar
            </button>

            <button
              class="card-btn status-btn"
              data-action="status"
              data-id="${d.id}"
            >
              📋 Status
            </button>

          </div>

        deliveryList.appendChild(card);

      });

    ========================================================= */

    async function fetchWithTimeout(
      url,
      timeoutMs
    ) {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          timeoutMs
        );


      try {

        const response =
          await fetch(
            url,
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              signal:
                controller.signal
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        return await response.json();

      } finally {

        clearTimeout(timeout);

      }

    }


    async function respectNominatimDelay() {

      const now =
        Date.now();

      const elapsed =
        now -
        lastNominatimRequest;


      if (
        elapsed <
        NOMINATIM_DELAY
      ) {

        await wait(
          NOMINATIM_DELAY -
          elapsed
        );

      }


      lastNominatimRequest =
        Date.now();

    }


    function getResultNeighborhood(result) {

      const a =
        result.address || {};


      return (
        a.neighbourhood ||
        a.suburb ||
        a.quarter ||
        a.residential ||
        a.city_district ||
        ""
      );

    }


    function resultIsCaxias(result) {

      const a =
        result.address || {};


      const city =
        normalize(
          a.city ||
          a.town ||
          a.municipality ||
          a.village ||
          ""
        );


      const state =
        normalize(
          a.state ||
          ""
        );


      const display =
        normalize(
          result.display_name ||
          ""
        );


      const cityOk =
        city.includes(
          "caxias do sul"
        ) ||
        display.includes(
          "caxias do sul"
        );


      const stateOk =
        !state ||
        state.includes(
          "rio grande do sul"
        ) ||
        state === "rs" ||
        display.includes(
          "rio grande do sul"
        );


      return cityOk && stateOk;

    }


    function tokenOverlap(
      expected,
      actual
    ) {

      const a =
        new Set(
          normalize(expected)
            .split(" ")
            .filter(
              token =>
                token.length > 2
            )
        );


      const b =
        new Set(
          normalize(actual)
            .split(" ")
            .filter(
              token =>
                token.length > 2
            )
        );


      if (!a.size) {
        return 0;
      }


      let matches = 0;


      a.forEach(token => {

        if (b.has(token)) {
          matches++;
        }

      });


      return matches / a.size;

    }


    function chooseBestResult(
      results,
      parts
    ) {

      const valid =
        results.filter(
          result =>
            resultIsCaxias(result)
        );


      if (!valid.length) {
        return null;
      }


      const scored =
        valid.map(result => {

          const a =
            result.address || {};


          const road =
            a.road || "";


          const houseNumber =
            String(
              a.house_number || ""
            ).replace(
              /\D/g,
              ""
            );


          const requestedNumber =
            String(
              parts.number || ""
            ).replace(
              /\D/g,
              ""
            );


          const numberMatch =
            requestedNumber &&
            houseNumber &&
            requestedNumber ===
            houseNumber;


          const roadScore =
            tokenOverlap(
              parts.street,
              road ||
              result.display_name
            );


          const neighborhoodScore =
            tokenOverlap(
              parts.neighborhood,
              getResultNeighborhood(
                result
              ) ||
              result.display_name
            );


          let score = 0;


          score += 100;

          score +=
            roadScore * 40;


          score +=
            neighborhoodScore * 55;


          if (numberMatch) {
            score += 80;
          }


          if (
            result.type === "house" ||
            result.type === "building"
          ) {

            score += 15;

          }


          return {

            result,

            score,

            neighborhoodScore,

            numberMatch

          };

        });


      scored.sort(
        (a, b) =>
          b.score -
          a.score
      );


      return scored[0];

    }


    async function searchNominatim(
      query,
      parts
    ) {

      await respectNominatimDelay();


      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&addressdetails=1" +
        "&limit=8" +
        "&countrycodes=br" +
        "&accept-language=pt-BR" +
        "&q=" +
        encodeURIComponent(query);


      const results =
        await fetchWithTimeout(
          url,
          NOMINATIM_TIMEOUT
        );


      return chooseBestResult(
        results,
        parts
      );

    }


    async function geocodeOne(
      d,
      progressCallback
    ) {

      const cacheKey =
        normalize(d.address);


      /*
       * Primeiro tenta cache.
       */

      const cached =
        geocache[cacheKey];


      if (
        cached &&
        validCoordinate(
          cached.lat,
          cached.lon
        )
      ) {

        d.lat =
          Number(cached.lat);

        d.lon =
          Number(cached.lon);

        d.correctedNeighborhood =
          cached.correctedNeighborhood ||
          "";

        d.geocodeSource =
          cached.geocodeSource ||
          "cache";

        d.geocodeDisplayName =
          cached.displayName ||
          "";

        return {
          ok: true,
          source: "cache"
        };

      }


      const parts =
        parseAddress(
          d.address
        );


      const queries = [];


      if (
        parts.street &&
        parts.number
      ) {

        queries.push({

          label:
            "rua + número",

          query:
            parts.street +
            ", " +
            parts.number +
            ", Caxias do Sul, RS, Brasil"

        });


        if (
          parts.neighborhood
        ) {

          queries.push({

            label:
              "rua + número + bairro",

            query:
              parts.street +
              ", " +
              parts.number +
              ", " +
              parts.neighborhood +
              ", Caxias do Sul, RS, Brasil"

          });

        }

      }


      queries.push({

        label:
          "endereço original",

        query:
          d.address

      });


      let firstResult = null;


      for (
        let i = 0;
        i < queries.length;
        i++
      ) {

        const attempt =
          queries[i];


        progressCallback(
          attempt.label
        );


        try {

          const best =
            await searchNominatim(
              attempt.query,
              parts
            );


          if (best) {

            /*
             * Guarda a primeira opção.
             */

            if (!firstResult) {

              firstResult = {

                ...best,

                source:
                  attempt.label

              };

            }


            /*
             * Se o bairro bateu muito bem,
             * essa é a melhor opção.
             */

            if (
              best.neighborhoodScore >=
              0.5
            ) {

              const result =
                best.result;


              const lat =
                Number(result.lat);

              const lon =
                Number(result.lon);


              if (
                validCoordinate(
                  lat,
                  lon
                )
              ) {

                const neighborhood =
                  getResultNeighborhood(
                    result
                  );


                d.lat = lat;

                d.lon = lon;

                d.correctedNeighborhood =
                  neighborhood || "";

                d.geocodeSource =
                  attempt.label;

                d.geocodeDisplayName =
                  result.display_name ||
                  "";


                geocache[cacheKey] = {

                  lat,

                  lon,

                  correctedNeighborhood:
                    neighborhood || "",

                  geocodeSource:
                    attempt.label,

                  displayName:
                    result.display_name ||
                    "",

                  savedAt:
                    new Date().toISOString()

                };


                saveData();


                return {
                  ok: true,
                  source:
                    attempt.label
                };

              }

            }

          }

        } catch (error) {

          console.warn(
            "Falha na busca:",
            attempt.query,
            error
          );

          d.geocodeError =
            error.message ||
            "Erro na busca";

        }

      }


      /*
       * Se nenhuma busca teve bairro
       * perfeito, aceita o melhor resultado
       * encontrado em Caxias.
       */

      if (firstResult) {

        const result =
          firstResult.result;


        const lat =
          Number(result.lat);

        const lon =
          Number(result.lon);


        if (
          validCoordinate(
            lat,
            lon
          )
        ) {

          const neighborhood =
            getResultNeighborhood(
              result
            );


          d.lat = lat;

          d.lon = lon;

          d.correctedNeighborhood =
            neighborhood || "";

          d.geocodeSource =
            firstResult.source;

          d.geocodeDisplayName =
            result.display_name ||
            "";


          geocache[cacheKey] = {

            lat,

            lon,

            correctedNeighborhood:
              neighborhood || "",

            geocodeSource:
              firstResult.source,

            displayName:
              result.display_name ||
              "",

            savedAt:
              new Date().toISOString()

          };


          saveData();


          return {
            ok: true,
            source:
              firstResult.source
          };

        }

      }


      return {
        ok: false,
        source: "não localizado"
      };

    }


    /* =========================================================

    ========================================================= */

    async function geocodeAll(
      onlyFailures = false
    ) {

      const button =
        onlyFailures
          ? retryBtn
          : geocodeBtn;


      button.disabled = true;


      const pending =
        deliveries.filter(d => {

          if (
            d.status !== "PENDENTE"
          ) {

            return false;

          }


          if (onlyFailures) {

            return (
              d.geocodeError ||
              !validCoordinate(
                d.lat,
                d.lon
              )
            );

          }


          return !validCoordinate(
            d.lat,
            d.lon
          );

        });


      if (!pending.length) {

        geocodeStatus.textContent =
          "Todas as entregas pendentes já possuem localização.";

        geocodeDetail.textContent =
          "Nenhuma nova localização necessária.";

        progressBar.style.width =
          "100%";


        button.disabled = false;

        return;

      }


      let success = 0;

      let failed = 0;


      progressBar.style.width =
        "0%";


      for (
        let i = 0;
        i < pending.length;
        i++
      ) {

        const d =
          pending[i];


        const position =
          i + 1;


        geocodeStatus.textContent =
          "Localizando " +
          position +
          " de " +
          pending.length;


        geocodeDetail.textContent =
          d.address;


        progressBar.style.width =
          (
            i /
            pending.length *
            100
          ) +
          "%";


        d.geocodeError = "";


        const result =
          await geocodeOne(
            d,
            attempt => {

              geocodeDetail.textContent =
                d.address +
                " — " +
                attempt;

            }
          );


        if (result.ok) {

          success++;

        } else {

          failed++;

        }


        saveData();

        renderMarkers();

        updateSummary();

        renderDeliveryList();


        progressBar.style.width =
          (
            (
              i + 1
            ) /
            pending.length *
            100
          ) +
          "%";

      }


      progressBar.style.width =
        "100%";


      geocodeStatus.textContent =
        "Localização concluída.";


      geocodeDetail.textContent =
        success +
        " localizados • " +
        failed +
        " não localizados.";


      button.disabled = false;


      /*
       * Depois da busca, atualiza tudo.
       */

      renderMarkers();

      updateSummary();

      renderDeliveryList();

    }

    function csvEscape(value) {

      const text =
        String(
          value == null
            ? ""
            : value
        );


      return '"' +
        text.replace(
          /"/g,
          '""'
        ) +
        '"';

    }


    function downloadFile(
      content,
      filename
    ) {

      const blob =
        new Blob(
          [
            "\uFEFF" +
            content
          ],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href = url;

      a.download =
        filename;


      document.body.appendChild(a);

      a.click();

      a.remove();


      setTimeout(
        () =>
          URL.revokeObjectURL(url),
        1000
      );

    }

              validCoordinate(
                d.lat,
                d.lon
              )
                ? d.lat
                : "",

              validCoordinate(
                d.lat,
                d.lon
              )
                ? d.lon
                : "",

              d.correctedNeighborhood ||
                "",

              d.geocodeSource ||
                "",

              d.geocodeDisplayName ||
                ""

            ]
            .map(csvEscape)
            .join(";")

          );

        });


        const now =
          new Date();


        const filename =
          "entregas_corrigidas_" +
          now.getFullYear() +
          "-" +
          String(
            now.getMonth() + 1
          ).padStart(2, "0") +
          "-" +
          String(
            now.getDate()
          ).padStart(2, "0") +
          ".csv";


        downloadFile(
          rows.join("\n"),
          filename
        );


        geocodeStatus.textContent =
          "Exportação concluída.";

        geocodeDetail.textContent =
          "Arquivo com todos os clientes e coordenadas.";

      }
    );


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    function initialize() {

      loadData();

      updateSummary();

      renderMarkers();

      renderDeliveryList();


      geocodeStatus.textContent =
        "Pronto.";

      geocodeDetail.textContent =
        deliveries.length +
        " clientes carregados.";


      progressBar.style.width =
        "100%";


      setTimeout(
        refreshMapSize,
        300
      );

    }


    initialize();


    /* =========================================================
       SERVICE WORKER
    ========================================================= */

    if (
      "serviceWorker" in navigator
    ) {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )
        .then(registration => {

          registration.update();

        })
        .catch(() => {

          /*
           * Não impede o aplicativo
           * de funcionar caso o SW não exista.
           */

        });

    }

  </script>

</body>
</html>
