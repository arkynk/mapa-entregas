<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Mapa de Entregas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
    }

    body {
      overflow-x: hidden;
    }

    header {
      background: #111827;
      color: #fff;
      padding: 11px 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.20);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .titulo {
      min-width: 0;
    }

    .titulo h1 {
      margin: 0;
      font-size: 19px;
      line-height: 22px;
      white-space: nowrap;
    }

    .titulo p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #cbd5e1;
    }

    .contador {
      flex-shrink: 0;
      min-width: 68px;
      padding: 6px 9px;
      border-radius: 9px;
      background: #1f2937;
      border: 1px solid #374151;
      text-align: center;
    }

    .contador strong {
      display: block;
      font-size: 17px;
      line-height: 18px;
    }

    .contador span {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      color: #cbd5e1;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px;
    }

    .botao-localizar {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      box-shadow: 0 3px 8px rgba(37,99,235,.25);
    }

    .botao-localizar:active {
      transform: scale(.99);
    }

    .botao-localizar:disabled {
      background: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .status {
      background: #fff;
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .status-texto {
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
    }

    .status-detalhe {
      margin-top: 4px;
      color: #64748b;
      font-size: 11px;
      line-height: 15px;
      word-break: break-word;
    }

    .progresso-container {
      width: 100%;
      height: 8px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 20px;
      background: #e2e8f0;
    }

    .progresso {
      width: 0%;
      height: 100%;
      background: #2563eb;
      border-radius: 20px;
      transition: width .25s ease;
    }

    #map {
      width: 100%;
      height: 42vh;
      min-height: 280px;
      max-height: 360px;
      border-radius: 12px;
      overflow: hidden;
      background: #dbeafe;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .resumo-item {
      background: #fff;
      border-radius: 10px;
      padding: 9px 5px;
      text-align: center;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
    }

    .resumo-numero {
      display: block;
      font-size: 19px;
      font-weight: 700;
      line-height: 21px;
    }

    .resumo-label {
      display: block;
      margin-top: 3px;
      font-size: 9px;
      color: #64748b;
    }

    .lista-container {
      margin-top: 10px;
      background: #fff;
      border-radius: 11px;
      padding: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .lista-titulo {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .cliente-item {
      padding: 9px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .cliente-item:last-child {
      border-bottom: 0;
    }

    .cliente-nome {
      font-size: 13px;
      font-weight: 700;
      line-height: 17px;
    }

    .cliente-endereco {
      margin-top: 3px;
      color: #64748b;
      font-size: 11px;
      line-height: 15px;
    }

    .cliente-status {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 15px;
    }

    .aguardando {
      color: #64748b;
    }

    .localizando {
      color: #2563eb;
    }

    .sucesso {
      color: #15803d;
    }

    .falha {
      color: #dc2626;
    }

    .segunda-tentativa {
      color: #d97706;
    }

    .popup-titulo {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .popup-endereco {
      font-size: 12px;
      line-height: 16px;
    }

    .popup-coordenadas {
      margin-top: 5px;
      color: #64748b;
      font-size: 10px;
    }

    @media (min-width: 700px) {
      #map {
        height: 500px;
        max-height: 500px;
      }

      .botao-localizar {
        width: 230px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-top">

      <div class="titulo">
        <h1>📦 Mapa de Entregas</h1>
        <p>Localização dos clientes</p>
      </div>

      <div class="contador">
        <strong id="contadorClientes">0</strong>
        <span>clientes</span>
      </div>

    </div>
  </header>


  <main>

    <button
      id="btnLocalizar"
      class="botao-localizar"
      type="button"
    >
      📍 LOCALIZAR
    </button>


    <div class="status">

      <div
        id="statusTexto"
        class="status-texto"
      >
        Pronto para localizar os clientes.
      </div>

      <div
        id="statusDetalhe"
        class="status-detalhe"
      >
        Clique em "Localizar" para começar.
      </div>

      <div class="progresso-container">
        <div
          id="barraProgresso"
          class="progresso"
        ></div>
      </div>

    </div>


    <div id="map"></div>


    <div class="resumo">

      <div class="resumo-item">
        <span
          id="infoEncontrados"
          class="resumo-numero"
        >
          0
        </span>

        <span class="resumo-label">
          LOCALIZADOS
        </span>
      </div>

      <div class="resumo-item">
        <span
          id="infoFalhas"
          class="resumo-numero"
        >
          0
        </span>

        <span class="resumo-label">
          NÃO LOCALIZADOS
        </span>
      </div>

      <div class="resumo-item">
        <span
          id="infoProcessados"
          class="resumo-numero"
        >
          0
        </span>

        <span class="resumo-label">
          PROCESSADOS
        </span>
      </div>

    </div>


    <div class="lista-container">

      <h2 class="lista-titulo">
        Clientes
      </h2>

      <div id="listaClientes"></div>

    </div>

  </main>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script src="./clientes.js?v=20261006"></script>


  <script>

    /* =========================================================
       CONFIGURAÇÃO
       ========================================================= */

    const CENTRO_INICIAL = [
      -29.1678,
      -51.1794
    ];

    const ZOOM_INICIAL = 12;

    const INTERVALO_GEOCODIFICACAO = 1500;

    const CHAVE_CACHE =
      "mapa_entregas_geocache_v6";


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const btnLocalizar =
      document.getElementById("btnLocalizar");

    const statusTexto =
      document.getElementById("statusTexto");

    const statusDetalhe =
      document.getElementById("statusDetalhe");

    const barraProgresso =
      document.getElementById("barraProgresso");

    const contadorClientes =
      document.getElementById("contadorClientes");

    const infoEncontrados =
      document.getElementById("infoEncontrados");

    const infoFalhas =
      document.getElementById("infoFalhas");

    const infoProcessados =
      document.getElementById("infoProcessados");

    const listaClientes =
      document.getElementById("listaClientes");


    /* =========================================================
       MAPA
       ========================================================= */

    const map =
      L.map("map", {
        zoomControl: true,
        attributionControl: true
      }).setView(
        CENTRO_INICIAL,
        ZOOM_INICIAL
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }
    ).addTo(map);


    const camadaMarcadores =
      L.layerGroup().addTo(map);


    /* =========================================================
       VARIÁVEIS
       ========================================================= */

    let clientes = [];

    let processando = false;

    let encontrados = 0;

    let falhas = 0;

    let processados = 0;

    let limitesMapa =
      L.latLngBounds([]);


    /* =========================================================
       ESPERA
       ========================================================= */

    function esperar(ms) {

      return new Promise(
        resolve => setTimeout(resolve, ms)
      );

    }


    /* =========================================================
       ESCAPAR HTML
       ========================================================= */

    function escaparHTML(valor) {

      if (
        valor === null ||
        valor === undefined
      ) {
        return "";
      }

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       NOME
       ========================================================= */

    function pegarNome(cliente) {

      return (
        cliente.nome ??
        cliente.cliente ??
        cliente.razao_social ??
        cliente.razaoSocial ??
        cliente.fantasia ??
        cliente.nome_cliente ??
        cliente.NOME ??
        cliente.Nome ??
        "Cliente"
      );

    }


    /* =========================================================
       ENDEREÇO
       ========================================================= */

    function pegarEndereco(cliente) {

      const enderecoCompleto =
        cliente.endereco ??
        cliente.endereço ??
        cliente.address ??
        cliente.ENDERECO ??
        cliente.Endereco;


      if (
        enderecoCompleto !== undefined &&
        enderecoCompleto !== null &&
        String(enderecoCompleto).trim() !== ""
      ) {

        return String(
          enderecoCompleto
        ).trim();

      }


      const rua =
        cliente.rua ??
        cliente.Rua ??
        cliente.logradouro ??
        cliente.Logradouro ??
        "";

      const numero =
        cliente.numero ??
        cliente.número ??
        cliente.Numero ??
        cliente.Número ??
        "";

      const bairro =
        cliente.bairro ??
        cliente.Bairro ??
        "";

      const cidade =
        cliente.cidade ??
        cliente.Cidade ??
        "";

      const uf =
        cliente.uf ??
        cliente.UF ??
        cliente.estado ??
        cliente.Estado ??
        "";


      const partes = [];


      if (rua) {
        partes.push(String(rua));
      }

      if (numero) {
        partes.push(String(numero));
      }

      if (bairro) {
        partes.push(String(bairro));
      }

      if (cidade) {
        partes.push(String(cidade));
      }

      if (uf) {
        partes.push(String(uf));
      }


      return partes.join(", ");

    }


    /* =========================================================
       CIDADE
       ========================================================= */

    function pegarCidade(cliente) {

      return (
        cliente.cidade ??
        cliente.Cidade ??
        cliente.municipio ??
        cliente.Municipio ??
        "Caxias do Sul"
      );

    }


    /* =========================================================
       CACHE
       ========================================================= */

    function carregarCache() {

      try {

        const dados =
          localStorage.getItem(
            CHAVE_CACHE
          );


        if (!dados) {
          return {};
        }


        const cache =
          JSON.parse(dados);


        if (
          typeof cache !== "object" ||
          cache === null
        ) {
          return {};
        }


        return cache;

      } catch (erro) {

        console.warn(
          "Não foi possível carregar o cache.",
          erro
        );

        return {};

      }

    }


    function salvarCache(
      cache
    ) {

      try {

        localStorage.setItem(
          CHAVE_CACHE,
          JSON.stringify(cache)
        );

      } catch (erro) {

        console.warn(
          "Não foi possível salvar o cache.",
          erro
        );

      }

    }


    const cacheGeocodificacao =
      carregarCache();


    /* =========================================================
       CHAVE DO ENDEREÇO
       ========================================================= */

    function criarChaveEndereco(
      endereco
    ) {

      return String(
        endereco || ""
      )
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    /* =========================================================
       PREPARAR CONSULTA COMPLETA
       ========================================================= */

    function consultaCompleta(
      cliente
    ) {

      let consulta =
        cliente.endereco.trim();


      const cidade =
        pegarCidade(
          cliente.original
        );


      if (
        cidade &&
        !consulta
          .toLowerCase()
          .includes(
            String(cidade).toLowerCase()
          )
      ) {

        consulta +=
          ", " + cidade;

      }


      if (
        !consulta
          .toLowerCase()
          .includes("rio grande do sul")
      ) {

        consulta +=
          ", RS";

      }


      if (
        !consulta
          .toLowerCase()
          .includes("brasil")
      ) {

        consulta +=
          ", Brasil";

      }


      return consulta;

    }


    /* =========================================================
       CONSULTA SIMPLIFICADA
       ========================================================= */

    function consultaSimplificada(
      cliente
    ) {

      let endereco =
        cliente.endereco
          .trim();


      const cidade =
        pegarCidade(
          cliente.original
        );


      /*
        Remove algumas informações muito
        específicas que podem atrapalhar
        a primeira busca.
      */

      endereco =
        endereco
          .replace(
            /\bcep\b\s*:?\s*\d{5}-?\d{3}/gi,
            ""
          )
          .replace(
            /\d{5}-\d{3}/g,
            ""
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      let consulta =
        endereco;


      if (
        cidade &&
        !consulta
          .toLowerCase()
          .includes(
            String(cidade).toLowerCase()
          )
      ) {

        consulta +=
          ", " + cidade;

      }


      consulta +=
        ", RS, Brasil";


      return consulta;

    }


    /* =========================================================
       PREPARAR CLIENTES
       ========================================================= */

    function carregarClientes() {

      let fonte = null;


      if (
        typeof CLIENTES !== "undefined" &&
        Array.isArray(CLIENTES)
      ) {

        fonte = CLIENTES;

      }


      if (
        !fonte &&
        typeof clientes !== "undefined" &&
        Array.isArray(clientes)
      ) {

        fonte = clientes;

      }


      if (
        !fonte &&
        typeof dadosClientes !== "undefined" &&
        Array.isArray(dadosClientes)
      ) {

        fonte = dadosClientes;

      }


      if (
        !fonte &&
        typeof dados !== "undefined" &&
        Array.isArray(dados)
      ) {

        fonte = dados;

      }


      if (!fonte) {

        throw new Error(
          "Não encontrei uma lista de clientes no clientes.js."
        );

      }


      clientes =
        fonte
          .map(
            (cliente, indice) => {

              return {

                original: cliente,

                indice: indice,

                nome:
                  pegarNome(cliente),

                endereco:
                  pegarEndereco(cliente),

                status:
                  "aguardando",

                tentativa:
                  0,

                lat:
                  null,

                lon:
                  null

              };

            }
          )
          .filter(
            cliente =>
              cliente.endereco &&
              cliente.endereco.trim() !== ""
          );


      contadorClientes.textContent =
        clientes.length;


      montarLista();

    }


    /* =========================================================
       LISTA
       ========================================================= */

    function montarLista() {

      listaClientes.innerHTML = "";


      if (
        clientes.length === 0
      ) {

        listaClientes.innerHTML = `
          <div class="cliente-item">
            <div class="cliente-status falha">
              Nenhum cliente com endereço encontrado.
            </div>
          </div>
        `;

        return;

      }


      clientes.forEach(
        cliente => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "cliente-item";


          item.id =
            "cliente-" +
            cliente.indice;


          item.innerHTML = `

            <div class="cliente-nome">
              ${escaparHTML(cliente.nome)}
            </div>

            <div class="cliente-endereco">
              ${escaparHTML(cliente.endereco)}
            </div>

            <div
              class="cliente-status aguardando"
              id="status-cliente-${cliente.indice}"
            >
              Aguardando localização...
            </div>

          `;


          listaClientes.appendChild(
            item
          );

        }
      );

    }


    /* =========================================================
       STATUS DO CLIENTE
       ========================================================= */

    function atualizarStatusCliente(
      cliente,
      texto,
      classe
    ) {

      const elemento =
        document.getElementById(
          "status-cliente-" +
          cliente.indice
        );


      if (!elemento) {
        return;
      }


      elemento.textContent =
        texto;


      elemento.className =
        "cliente-status " +
        classe;

    }


    /* =========================================================
       RESUMO
       ========================================================= */

    function atualizarResumo() {

      infoEncontrados.textContent =
        encontrados;

      infoFalhas.textContent =
        falhas;

      infoProcessados.textContent =
        processados;

    }


    /* =========================================================
       PROGRESSO
       ========================================================= */

    function atualizarProgresso() {

      if (
        clientes.length === 0
      ) {

        barraProgresso.style.width =
          "0%";

        return;

      }


      const percentual =
        (
          processados /
          clientes.length
        ) * 100;


      barraProgresso.style.width =
        percentual + "%";

    }


    /* =========================================================
       NOMINATIM
       ========================================================= */

    async function consultarNominatim(
      consulta
    ) {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({

          q: consulta,

          format: "jsonv2",

          addressdetails: "1",

          limit: "8",

          countrycodes: "br",

          "accept-language": "pt-BR"

        });


      const resposta =
        await fetch(
          url
        );


      if (!resposta.ok) {

        throw new Error(
          "HTTP " +
          resposta.status
        );

      }


      const resultados =
        await resposta.json();


      if (
        !Array.isArray(resultados) ||
        resultados.length === 0
      ) {

        return [];

      }


      return resultados;

    }


    /* =========================================================
       PONTUAÇÃO DO RESULTADO
       ========================================================= */

    function pontuarResultado(
      resultado,
      cliente
    ) {

      let pontos = 0;


      const display =
        String(
          resultado.display_name || ""
        ).toLowerCase();


      const cidade =
        String(
          pegarCidade(
            cliente.original
          )
        ).toLowerCase();


      const endereco =
        String(
          cliente.endereco
        ).toLowerCase();


      /*
        Resultado brasileiro.
      */

      if (
        display.includes("brasil")
      ) {

        pontos += 10;

      }


      /*
        Rio Grande do Sul.
      */

      if (
        display.includes(
          "rio grande do sul"
        )
      ) {

        pontos += 15;

      }


      /*
        Cidade.
      */

      if (
        cidade &&
        display.includes(cidade)
      ) {

        pontos += 30;

      }


      /*
        Rua/avenida/logradouro.
      */

      const rua =
        cliente.original.rua ??
        cliente.original.Rua ??
        cliente.original.logradouro ??
        cliente.original.Logradouro ??
        "";


      if (
        rua &&
        display.includes(
          String(rua).toLowerCase()
        )
      ) {

        pontos += 35;

      }


      /*
        Número.
      */

      const numero =
        cliente.original.numero ??
        cliente.original.número ??
        cliente.original.Numero ??
        cliente.original.Número ??
        "";


      if (
        numero &&
        display.includes(
          String(numero).toLowerCase()
        )
      ) {

        pontos += 20;

      }


      /*
        Bairro.
      */

      const bairro =
        cliente.original.bairro ??
        cliente.original.Bairro ??
        "";


      if (
        bairro &&
        display.includes(
          String(bairro).toLowerCase()
        )
      ) {

        pontos += 20;

      }


      /*
        Resultado de endereço.
      */

      const tipo =
        String(
          resultado.type || ""
        ).toLowerCase();


      if (
        tipo === "house" ||
        tipo === "residential"
      ) {

        pontos += 15;

      }


      return pontos;

    }


    /* =========================================================
       ESCOLHER MELHOR RESULTADO
       ========================================================= */

    function escolherMelhorResultado(
      resultados,
      cliente
    ) {

      if (
        !resultados ||
        resultados.length === 0
      ) {

        return null;

      }


      const avaliados =
        resultados.map(
          resultado => {

            return {

              resultado:
                resultado,

              pontos:
                pontuarResultado(
                  resultado,
                  cliente
                )

            };

          }
        );


      avaliados.sort(
        (a, b) =>
          b.pontos -
          a.pontos
      );


      return avaliados[0].resultado;

    }


    /* =========================================================
       VALIDAR COORDENADAS
       ========================================================= */

    function coordenadasValidas(
      lat,
      lon
    ) {

      return (
        Number.isFinite(lat) &&
        Number.isFinite(lon) &&
        lat >= -90 &&
        lat <= 90 &&
        lon >= -180 &&
        lon <= 180
      );

    }


    /* =========================================================
       ADICIONAR MARCADOR
       ========================================================= */

    function adicionarMarcador(
      cliente,
      lat,
      lon,
      vindoDoCache = false
    ) {

      const marcador =
        L.circleMarker(
          [lat, lon],
          {

            radius: 8,

            weight: 2,

            color: "#ffffff",

            fillColor:
              vindoDoCache
                ? "#16a34a"
                : "#2563eb",

            fillOpacity: .95

          }
        );


      marcador.bindPopup(`

        <div class="popup-titulo">
          ${escaparHTML(cliente.nome)}
        </div>

        <div class="popup-endereco">
          ${escaparHTML(cliente.endereco)}
        </div>

        <div class="popup-coordenadas">
          ${lat.toFixed(6)}, ${lon.toFixed(6)}
        </div>

      `);


      marcador.addTo(
        camadaMarcadores
      );


      limitesMapa.extend(
        [lat, lon]
      );

    }


    /* =========================================================
       PROCURAR NO CACHE
       ========================================================= */

    function procurarNoCache(
      cliente
    ) {

      const chave =
        criarChaveEndereco(
          cliente.endereco
        );


      if (
        !chave ||
        !cacheGeocodificacao[chave]
      ) {

        return null;

      }


      const dados =
        cacheGeocodificacao[chave];


      const lat =
        Number(dados.lat);


      const lon =
        Number(dados.lon);


      if (
        !coordenadasValidas(
          lat,
          lon
        )
      ) {

        return null;

      }


      return {
        lat: lat,
        lon: lon
      };

    }


    /* =========================================================
       SALVAR NO CACHE
       ========================================================= */

    function salvarCoordenadaCache(
      cliente,
      lat,
      lon
    ) {

      const chave =
        criarChaveEndereco(
          cliente.endereco
        );


      if (!chave) {
        return;
      }


      cacheGeocodificacao[chave] = {

        lat: lat,

        lon: lon,

        nome: cliente.nome,

        endereco: cliente.endereco,

        atualizado:
          new Date().toISOString()

      };


      salvarCache(
        cacheGeocodificacao
      );

    }


    /* =========================================================
       LOCALIZAR CLIENTE
       ========================================================= */

    async function localizarCliente(
      cliente
    ) {

      /*
        PRIMEIRO: CACHE
      */

      const cache =
        procurarNoCache(
          cliente
        );


      if (cache) {

        cliente.lat =
          cache.lat;

        cliente.lon =
          cache.lon;

        cliente.status =
          "encontrado";

        cliente.tentativa =
          0;


        adicionarMarcador(
          cliente,
          cache.lat,
          cache.lon,
          true
        );


        encontrados++;


        atualizarStatusCliente(
          cliente,
          "🟢 Localizado — coordenada salva",
          "sucesso"
        );


        return;

      }


      /*
        PRIMEIRA TENTATIVA
      */

      cliente.tentativa =
        1;


      atualizarStatusCliente(
        cliente,
        "🔎 Tentativa 1 — procurando...",
        "localizando"
      );


      statusTexto.textContent =
        "Localizando " +
        (cliente.indice + 1) +
        " de " +
        clientes.length;


      statusDetalhe.textContent =
        cliente.nome +
        " — " +
        cliente.endereco;


      try {

        const consulta1 =
          consultaCompleta(
            cliente
          );


        const resultados1 =
          await consultarNominatim(
            consulta1
          );


        let resultado =
          escolherMelhorResultado(
            resultados1,
            cliente
          );


        /*
          Se encontrou um resultado,
          verificamos as coordenadas.
        */

        if (resultado) {

          const lat =
            Number(
              resultado.lat
            );

          const lon =
            Number(
              resultado.lon
            );


          if (
            coordenadasValidas(
              lat,
              lon
            )
          ) {

            cliente.lat =
              lat;

            cliente.lon =
              lon;

            cliente.status =
              "encontrado";


            salvarCoordenadaCache(
              cliente,
              lat,
              lon
            );


            adicionarMarcador(
              cliente,
              lat,
              lon
            );


            encontrados++;


            atualizarStatusCliente(
              cliente,
              "🟢 Localizado",
              "sucesso"
            );


            return;

          }

        }


        /*
          SEGUNDA TENTATIVA
        */

        cliente.tentativa =
          2;


        atualizarStatusCliente(
          cliente,
          "🟠 Tentativa 2 — buscando endereço simplificado...",
          "segunda-tentativa"
        );


        statusDetalhe.textContent =
          cliente.nome +
          " — segunda tentativa";


        /*
          Respeitamos o intervalo antes
          da segunda consulta.
        */

        await esperar(
          INTERVALO_GEOCODIFICACAO
        );


        const consulta2 =
          consultaSimplificada(
            cliente
          );


        const resultados2 =
          await consultarNominatim(
            consulta2
          );


        resultado =
          escolherMelhorResultado(
            resultados2,
            cliente
          );


        if (resultado) {

          const lat =
            Number(
              resultado.lat
            );

          const lon =
            Number(
              resultado.lon
            );


          if (
            coordenadasValidas(
              lat,
              lon
            )
          ) {

            cliente.lat =
              lat;

            cliente.lon =
              lon;

            cliente.status =
              "encontrado";


            salvarCoordenadaCache(
              cliente,
              lat,
              lon
            );


            adicionarMarcador(
              cliente,
              lat,
              lon
            );


            encontrados++;


            atualizarStatusCliente(
              cliente,
              "🟢 Localizado — 2ª tentativa",
              "sucesso"
            );


            return;

          }

        }


        /*
          Não encontrou.
        */

        cliente.status =
          "falha";


        falhas++;


        atualizarStatusCliente(
          cliente,
          "🔴 Não localizado após 2 tentativas",
          "falha"
        );


      } catch (erro) {

        console.error(
          "Erro ao localizar cliente:",
          cliente,
          erro
        );


        /*
          Mesmo se houver erro na primeira
          tentativa, fazemos a segunda tentativa
          simplificada.
        */

        try {

          cliente.tentativa =
            2;


          atualizarStatusCliente(
            cliente,
            "🟠 Tentativa alternativa...",
            "segunda-tentativa"
          );


          await esperar(
            INTERVALO_GEOCODIFICACAO
          );


          const consulta2 =
            consultaSimplificada(
              cliente
            );


          const resultados2 =
            await consultarNominatim(
              consulta2
            );


          const resultado =
            escolherMelhorResultado(
              resultados2,
              cliente
            );


          if (resultado) {

            const lat =
              Number(
                resultado.lat
              );

            const lon =
              Number(
                resultado.lon
              );


            if (
              coordenadasValidas(
                lat,
                lon
              )
            ) {

              cliente.lat =
                lat;

              cliente.lon =
                lon;

              cliente.status =
                "encontrado";


              salvarCoordenadaCache(
                cliente,
                lat,
                lon
              );


              adicionarMarcador(
                cliente,
                lat,
                lon
              );


              encontrados++;


              atualizarStatusCliente(
                cliente,
                "🟢 Localizado — tentativa alternativa",
                "sucesso"
              );


              return;

            }

          }


        } catch (erro2) {

          console.error(
            "Segunda tentativa falhou:",
            erro2
          );

        }


        cliente.status =
          "falha";


        falhas++;


        atualizarStatusCliente(
          cliente,
          "🔴 Não localizado",
          "falha"
        );

      }

    }


    /* =========================================================
       LOCALIZAR TODOS
       ========================================================= */

    async function localizarTodos() {

      if (processando) {
        return;
      }


      if (
        clientes.length === 0
      ) {

        statusTexto.textContent =
          "Nenhum cliente disponível.";

        statusDetalhe.textContent =
          "Verifique o clientes.js.";

        return;

      }


      processando =
        true;


      btnLocalizar.disabled =
        true;


      btnLocalizar.textContent =
        "⏳ LOCALIZANDO...";


      camadaMarcadores.clearLayers();


      limitesMapa =
        L.latLngBounds([]);


      encontrados = 0;

      falhas = 0;

      processados = 0;


      atualizarResumo();

      atualizarProgresso();


      clientes.forEach(
        cliente => {

          cliente.status =
            "aguardando";

          cliente.tentativa =
            0;

          cliente.lat =
            null;

          cliente.lon =
            null;


          atualizarStatusCliente(
            cliente,
            "Aguardando localização...",
            "aguardando"
          );

        }
      );


      /*
        PROCESSAMENTO SEQUENCIAL
      */

      for (
        let i = 0;
        i < clientes.length;
        i++
      ) {

        const cliente =
          clientes[i];


        await localizarCliente(
          cliente
        );


        processados++;


        atualizarResumo();

        atualizarProgresso();


        /*
          Pequeno intervalo entre clientes.
          Além do intervalo das tentativas,
          isso mantém a interface respirando.
        */

        if (
          i <
          clientes.length - 1
        ) {

          await esperar(
            INTERVALO_GEOCODIFICACAO
          );

        }

      }


      /*
        Ajusta o mapa para mostrar
        todos os pontos encontrados.
      */

      if (
        encontrados > 0 &&
        limitesMapa.isValid()
      ) {

        map.fitBounds(
          limitesMapa,
          {
            padding: [25, 25]
          }
        );

      }


      statusTexto.textContent =
        "✅ Localização concluída";


      statusDetalhe.textContent =
        encontrados +
        " localizados • " +
        falhas +
        " não localizados";


      btnLocalizar.disabled =
        false;


      btnLocalizar.textContent =
        "📍 LOCALIZAR NOVAMENTE";


      processando =
        false;

    }


    /* =========================================================
       BOTÃO
       ========================================================= */

    btnLocalizar.addEventListener(
      "click",
      localizarTodos
    );


    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    try {

      carregarClientes();


      statusTexto.textContent =
        "Pronto para localizar os clientes.";


      statusDetalhe.textContent =
        clientes.length +
        " clientes carregados. " +
        'Clique em "Localizar" para começar.';


    } catch (erro) {

      console.error(
        erro
      );


      statusTexto.textContent =
        "❌ Erro ao carregar clientes";


      statusDetalhe.textContent =
        erro.message;


      contadorClientes.textContent =
        "0";


      listaClientes.innerHTML = `

        <div class="cliente-item">

          <div class="cliente-status falha">
            ${escaparHTML(erro.message)}
          </div>

        </div>

      `;

    }


    /* =========================================================
       AJUSTE DO MAPA
       ========================================================= */

    setTimeout(
      () => {

        map.invalidateSize();

      },
      300
    );


    window.addEventListener(
      "resize",
      () => {

        map.invalidateSize();

      }
    );

  </script>
