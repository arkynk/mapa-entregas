<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Mapa de Entregas</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* =====================================================
   CABEÇALHO
===================================================== */

header {
  background: #111827;
  color: white;
  padding: 10px;
  flex-shrink: 0;
  z-index: 2000;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 18px;
}

.subtitle {
  margin-top: 2px;
  font-size: 11px;
  opacity: .7;
}

.header-count {
  background: #2563eb;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.btn-blue {
  background: #2563eb;
  color: white;
}

.btn-green {
  background: #059669;
  color: white;
}

.btn-orange {
  background: #d97706;
  color: white;
}

.btn-gray {
  background: #374151;
  color: white;
}

.btn-red {
  background: #dc2626;
  color: white;
}

/* =====================================================
   MAPA
===================================================== */

#mapContainer {
  position: relative;
  height: 34vh;
  min-height: 210px;
  max-height: 380px;
  flex-shrink: 0;
  background: #ddd;
}

#map {
  width: 100%;
  height: 100%;
}

#mapButton {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 1000;
  background: white;
  color: #111827;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}

/* MAPA EXPANDIDO */

body.map-expanded #mapContainer {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  max-height: none;
  min-height: 0;
  z-index: 10000;
}

body.map-expanded header,
body.map-expanded #bottomPanel {
  display: none;
}

/* =====================================================
   PAINEL
===================================================== */

#bottomPanel {
  flex: 1;
  min-height: 0;
  background: white;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#progressArea {
  padding: 7px 10px;
  border-bottom: 1px solid #e5e7eb;
  flex-shrink: 0;
}

#progressText {
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 4px;
}

.progress-bg {
  height: 7px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width .2s;
}

#statusText {
  margin-top: 4px;
  font-size: 10px;
  color: #4b5563;
}

#failureText {
  margin-top: 4px;
  font-size: 10px;
  color: #b91c1c;
  max-height: 60px;
  overflow-y: auto;
}

#listTitle {
  padding: 8px 10px;
  font-size: 13px;
  font-weight: bold;
  border-bottom: 1px solid #e5e7eb;
  flex-shrink: 0;
}

#deliveryList {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* =====================================================
   ENTREGA
===================================================== */

.delivery {
  padding: 9px 10px;
  border-bottom: 1px solid #e5e7eb;
}

.delivery-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.delivery-name {
  font-size: 13px;
  font-weight: bold;
}

.delivery-distance {
  color: #2563eb;
  font-size: 10px;
  font-weight: bold;
  white-space: nowrap;
}

.delivery-address {
  margin-top: 3px;
  font-size: 11px;
  color: #4b5563;
  line-height: 1.35;
}

.delivery-corrected {
  margin-top: 3px;
  font-size: 10px;
  color: #059669;
  font-weight: bold;
}

.delivery-not-found {
  margin-top: 3px;
  font-size: 10px;
  color: #b91c1c;
}

.delivery-actions {
  display: flex;
  gap: 5px;
  margin-top: 6px;
}

.delivery-actions button {
  padding: 6px 8px;
  font-size: 10px;
}

.status {
  display: inline-block;
  margin-top: 4px;
  padding: 3px 5px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: bold;
}

.status-pendente {
  background: #fef3c7;
  color: #92400e;
}

.status-carta {
  background: #dcfce7;
  color: #166534;
}

.status-nao-localizado {
  background: #fee2e2;
  color: #991b1b;
}

.status-risco {
  background: #fef3c7;
  color: #92400e;
}

/* =====================================================
   MODAL
===================================================== */

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 50000;
}

.modal-box {
  width: 100%;
  max-width: 600px;
  background: white;
  border-radius: 18px 18px 0 0;
  padding: 18px;
}

.modal-title {
  font-size: 18px;
  font-weight: bold;
}

.modal-address {
  margin-top: 8px;
  font-size: 13px;
  color: #4b5563;
  line-height: 1.4;
}

.modal-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}

.modal-buttons button {
  min-height: 44px;
}

.modal-close {
  width: 100%;
  margin-top: 10px;
  background: #e5e7eb;
}

/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 800px) {

  #mapContainer {
    height: 40vh;
  }

  #modal {
    align-items: center;
  }

  .modal-box {
    border-radius: 18px;
  }

}

</style>

</head>

<body>

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

  <div class="header-top">

    <div>

      <h1>📦 Mapa de Entregas</h1>

      <div class="subtitle">
        Localização inteligente dos clientes
      </div>

    </div>

    <div

      class="header-count"
    >
      0/0
    </div>

  </div>

  <div class="toolbar">

    <button
      id="locateButton"
      class="btn-blue"
      onclick="localizarTodos()"
    >
      🗺️ Localizar
    </button>

    <button
      class="btn-green"
      onclick="minhaLocalizacao()"
    >
      📍 GPS
    </button>

    <button
      class="btn-orange"
      onclick="tentarFalhas()"
    >
      🔄 Falhas
    </button>

    <button
      class="btn-gray"
      onclick="exportarCSV()"

    </button>

<!-- =====================================================
     MAPA
===================================================== -->

<div id="mapContainer">

  <div id="map"></div>

  <button
    id="mapButton"
    onclick="alternarMapa()"

    ⛶ Expandir mapa
  </button>

</div>

<!-- =====================================================
     PAINEL
===================================================== -->

<div id="bottomPanel">

  <div id="progressArea">

    <div id="progressText">
      Preparando...
    </div>

    <div class="progress-bg">

      <div id="progressBar"></div>

    </div>

    <div id="statusText">
      Pronto.
    </div>

    <div id="failureText"></div>

  </div>

  <div id="listTitle">
    📍 Entregas pendentes
  </div>

  <div id="deliveryList"></div>

</div>

<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  onclick="fecharModal(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div
      id="modalTitle"
      class="modal-title"
    >
      Entrega
    </div>

    <div
      id="modalAddress"
      class="modal-address"
    ></div>

    <div class="modal-buttons">

      <button
        class="btn-green"
        onclick="alterarStatus('CARTA')"
      >
        ✉️ Carta
      </button>

      <button
        class="btn-red"
        onclick="alterarStatus('NAO_LOCALIZADO')"
      >
        ❌ Não localizado
      </button>

      <button
        class="btn-orange"
        onclick="alterarStatus('ZONA_DE_RISCO')"
      >
        ⚠️ Zona de risco
      </button>

      <button
        class="btn-blue"
        onclick="navegarSelecionado()"
      >
        🧭 Navegar
      </button>

    </div>

    <button
      class="modal-close"
      onclick="fecharModal()"
    >
      Fechar
    </button>

  </div>

</div>

<!-- =====================================================
     ARQUIVOS
===================================================== -->

<script src="./clientes.js"></script>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const STORAGE_KEY =
  "mapa_entregas_clientes_v6";

const CACHE_KEY =
  "mapa_entregas_geocache_v6";

const CENTER =
  [-29.1678, -51.1794];

const TIMEOUT =
  9000;

const DELAY =
  1200;

/* =====================================================
   CLIENTES
===================================================== */

const listaClientes =
  Array.isArray(window.CLIENTES)
    ? window.CLIENTES
    : [];

console.log(
  "CLIENTES:",
  listaClientes.length
);

/* =====================================================
   DADOS
===================================================== */

let entregas =
  listaClientes.map(
    (cliente, index) => {

      const id =
        cliente.id ??
        index + 1;

      const endereco =
        cliente.endereco ||
        cliente.address ||
        [
          cliente.rua,
          cliente.numero,
          cliente.bairro,
          cliente.cidade ||
            "Caxias do Sul",
          cliente.uf ||
            "RS"
        ]
        .filter(Boolean)
        .join(", ");

      return {

        id,

        label:
          "Entrega " + id,

        address:
          endereco,

        rua:
          cliente.rua || "",

        numero:
          cliente.numero || "",

        bairro:
          cliente.bairro || "",

        bairroCorrigido:
          cliente.bairroCorrigido || "",

        cidade:
          cliente.cidade ||
          "Caxias do Sul",

        uf:
          cliente.uf ||
          "RS",

        status:
          "PENDENTE",

        lat:
          Number.isFinite(
            Number(cliente.lat)
          )
            ? Number(cliente.lat)
            : null,

        lon:
          Number.isFinite(
            Number(cliente.lon)
          )
            ? Number(cliente.lon)
            : null,

        updatedAt:
          null,

        geocodeSource:
          "",

        geocodeError:
          ""

      };

    }
  );

/* =====================================================
   RECUPERAR ESTADO SALVO
===================================================== */

try {

  const saved =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    );

  if(Array.isArray(saved)) {

    const byId =
      new Map(
        saved.map(
          item =>
            [
              Number(item.id),
              item
            ]
        )
      );

    entregas =
      entregas.map(
        item => {

          const old =
            byId.get(
              Number(item.id)
            );

          if(!old) {
            return item;
          }

          return {

            ...item,

            status:
              old.status ||
              item.status,

            lat:
              Number.isFinite(
                Number(old.lat)
              )
                ? Number(old.lat)
                : item.lat,

            lon:
              Number.isFinite(
                Number(old.lon)
              )
                ? Number(old.lon)
                : item.lon,

            updatedAt:
              old.updatedAt ||
              null,

            bairroCorrigido:
              old.bairroCorrigido ||
              "",

            geocodeSource:
              old.geocodeSource ||
              "",

            geocodeError:
              old.geocodeError ||
              ""

          };

        }
      );

  }

} catch(error) {

  console.log(
    "Nenhum estado anterior."
  );

}

/* =====================================================
   CACHE DE GEOCODIFICAÇÃO
===================================================== */

let cache = {};

try {

  const savedCache =
    JSON.parse(
      localStorage.getItem(
        CACHE_KEY
      )
    );

  if(
    savedCache &&
    typeof savedCache === "object"
  ) {

    cache =
      savedCache;

  }

} catch(error) {

  cache = {};

}

/* =====================================================
   MAPA
===================================================== */

const mapa =
  L.map("map");

mapa.setView(
  CENTER,
  12
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(mapa);

const camadaMarcadores =
  L.layerGroup()
   .addTo(mapa);

let marcadores =
  {};

let posicaoUsuario =
  null;

let entregaSelecionada =
  null;

/* =====================================================
   MAPA EXPANDIR
===================================================== */

function alternarMapa() {

  document.body.classList.toggle(
    "map-expanded"
  );

  const button =
    document.getElementById(
      "mapButton"
    );

  if(
    document.body.classList.contains(
      "map-expanded"
    )
  ) {

    button.textContent =
      "↙️ Fechar mapa";

  } else {

    button.textContent =
      "⛶ Expandir mapa";

  }

  setTimeout(
    () => {

      mapa.invalidateSize();

    },
    300
  );

}

/* =====================================================
   UTILITÁRIOS
===================================================== */

function normalizar(texto) {

  return String(
    texto || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim()
  .toUpperCase();

}

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

function possuiCoordenadas(entrega) {

  return (
    Number.isFinite(
      Number(entrega.lat)
    ) &&
    Number.isFinite(
      Number(entrega.lon)
    )
  );

}

function salvar() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      entregas
    )
  );

}

function salvarCache() {

  localStorage.setItem(
    CACHE_KEY,
    JSON.stringify(
      cache
    )
  );

}

function escapeHtml(valor) {

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

/* =====================================================
   ENDEREÇO
===================================================== */

function obterEndereco(entrega) {

  return String(
    entrega.address ||
    entrega.endereco ||
    ""
  ).trim();

}

function analisarEndereco(entrega) {

  const original =
    obterEndereco(
      entrega
    );

  const partes =
    original
      .split(",")
      .map(
        x =>
          x.trim()
      )
      .filter(Boolean);

  let rua =
    entrega.rua ||
    partes[0] ||
    "";

  let numero =
    entrega.numero ||
    partes[1] ||
    "";

  let bairro =
    entrega.bairro ||
    partes[2] ||
    "";

  const match =
    String(numero).match(
      /\d+[A-Za-z]?/
    );

  if(match) {

    numero =
      match[0];

  }

  return {

    original,

    rua,

    numero,

    bairro

  };

}

/* =====================================================
   CHAVES DE CACHE
===================================================== */

function chaveEndereco(entrega) {

  const dados =
    analisarEndereco(
      entrega
    );

  return normalizar(
    dados.original
  );

}

/* =====================================================
   CONSULTAS
===================================================== */

function gerarConsultas(entrega) {

  const dados =
    analisarEndereco(
      entrega
    );

  const cidade =
    entrega.cidade ||
    "Caxias do Sul";

  const uf =
    entrega.uf ||
    "RS";

  const consultas =
    [];

  if(
    dados.rua &&
    dados.numero
  ) {

    consultas.push({

      nome:
        "Rua + número",

      query:
        `${dados.rua}, ${dados.numero}, ${cidade}, ${uf}, Brasil`

    });

  }

  if(
    dados.rua &&
    dados.numero &&
    dados.bairro
  ) {

    consultas.push({

      nome:
        "Rua + número + bairro",

      query:
        `${dados.rua}, ${dados.numero}, ${dados.bairro}, ${cidade}, ${uf}, Brasil`

    });

  }

  if(
    dados.original
  ) {

    consultas.push({

      nome:
        "Endereço original",

      query:
        dados.original

    });

  }

  return consultas;

}

/* =====================================================
   TIMEOUT
===================================================== */

async function consultarNominatim(query) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => {

        controller.abort();

      },
      TIMEOUT
    );

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&limit=5" +
      "&countrycodes=br" +
      "&accept-language=pt-BR" +
      "&q=" +
      encodeURIComponent(
        query
      );

    const resposta =
      await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );

    if(
      !resposta.ok
    ) {

      throw new Error(
        "HTTP " +
        resposta.status
      );

    }

    return await resposta.json();

  } finally {

    clearTimeout(
      timer
    );

  }

}

/* =====================================================
   ESCOLHER RESULTADO
===================================================== */

function escolherResultado(
  resultados,
  entrega
) {

  if(
    !Array.isArray(resultados) ||
    resultados.length === 0
  ) {

    return null;

  }

  const dados =
    analisarEndereco(
      entrega
    );

  const candidatos =
    resultados.filter(
      resultado => {

        const a =
          resultado.address ||
          {};

        const cidade =
          normalizar(
            a.city ||
            a.town ||
            a.municipality ||
            a.village ||
            ""
          );

        return cidade.includes(
          "CAXIAS DO SUL"
        );

      }
    );

  const lista =
    candidatos.length
      ? candidatos
      : resultados;

  let melhor =
    null;

  let melhorPontuacao =
    -Infinity;

  lista.forEach(
    resultado => {

      const a =
        resultado.address ||
        {};

      let pontos =
        0;

      const cidade =
        normalizar(
          a.city ||
          a.town ||
          a.municipality ||
          ""
        );

      if(
        cidade.includes(
          "CAXIAS DO SUL"
        )
      ) {

        pontos += 100;

      }

      const numero =
        String(
          a.house_number ||
          ""
        );

      if(
        dados.numero &&
        numero ===
        String(
          dados.numero
        )
      ) {

        pontos += 50;

      }

      const ruaResultado =
        normalizar(
          a.road ||
          ""
        );

      const ruaBusca =
        normalizar(
          dados.rua
        );

      if(
        ruaResultado &&
        ruaBusca &&
        (
          ruaResultado.includes(
            ruaBusca
          ) ||
          ruaBusca.includes(
            ruaResultado
          )
        )
      ) {

        pontos += 40;

      }

      const bairroResultado =
        normalizar(
          a.suburb ||
          a.neighbourhood ||
          a.quarter ||
          ""
        );

      const bairroBusca =
        normalizar(
          dados.bairro
        );

      if(
        bairroResultado &&
        bairroBusca &&
        (
          bairroResultado.includes(
            bairroBusca
          ) ||
          bairroBusca.includes(
            bairroResultado
          )
        )
      ) {

        pontos += 50;

      }

      if(
        pontos >
        melhorPontuacao
      ) {

        melhorPontuacao =
          pontos;

        melhor =
          resultado;

      }

    }
  );

  return melhor;

}

/* =====================================================
   LOCALIZAR UM CLIENTE
===================================================== */

async function localizarUm(
  entrega,
  callback
) {

  /*
    IMPORTANTE:

    Se não houver coordenadas,
    sempre tentamos novamente.

    Não usamos "já tentou" como
    motivo para pular o cliente.
  */

  const chave =
    chaveEndereco(
      entrega
    );

  if(
    cache[chave] &&
    Number.isFinite(
      Number(
        cache[chave].lat
      )
    ) &&
    Number.isFinite(
      Number(
        cache[chave].lon
      )
    )
  ) {

    entrega.lat =
      Number(
        cache[chave].lat
      );

    entrega.lon =
      Number(
        cache[chave].lon
      );

    entrega.bairroCorrigido =
      cache[chave].bairro ||
      "";

    entrega.geocodeSource =
      "Cache";

    entrega.geocodeError =
      "";

    return true;

  }

  const consultas =
    gerarConsultas(
      entrega
    );

  for(
    let i = 0;
    i < consultas.length;
    i++
  ) {

    const tentativa =
      consultas[i];

    if(callback) {

      callback(
        tentativa.nome
      );

    }

    try {

      const resultados =
        await consultarNominatim(
          tentativa.query
        );

      const resultado =
        escolherResultado(
          resultados,
          entrega
        );

      if(
        resultado
      ) {

        const lat =
          Number(
            resultado.lat
          );

        const lon =
          Number(
            resultado.lon
          );

        if(
          Number.isFinite(lat) &&
          Number.isFinite(lon)
        ) {

          entrega.lat =
            lat;

          entrega.lon =
            lon;

          entrega.geocodeSource =
            tentativa.nome;

          entrega.geocodeError =
            "";

          const a =
            resultado.address ||
            {};

          entrega.bairroCorrigido =
            a.suburb ||
            a.neighbourhood ||
            a.quarter ||
            a.residential ||
            "";

          cache[chave] = {

            lat,

            lon,

            bairro:
              entrega.bairroCorrigido,

            source:
              tentativa.nome,

            displayName:
              resultado.display_name ||
              ""

          };

          salvarCache();

          return true;

        }

      }

    } catch(error) {

      console.warn(
        "Falha:",
        tentativa.nome,
        error
      );

      entrega.geocodeError =
        String(
          error.message ||
          error
        );

    }

    /*
      Pequena pausa entre tentativas.
    */

    await sleep(
      500
    );

  }

  return false;

}

/* =====================================================
   LOCALIZAR TODOS
===================================================== */

async function localizarTodos() {

  const botao =
    document.getElementById(
      "locateButton"
    );

  if(
    botao.disabled
  ) {

    return;

  }

  /*
    AQUI ESTÁ A CORREÇÃO PRINCIPAL:

    Todo PENDENTE sem coordenada
    entra na fila.

    Não importa se já falhou antes.
  */

  const fila =
    entregas.filter(
      entrega =>
        entrega.status === "PENDENTE" &&
        !possuiCoordenadas(
          entrega
        )
    );

  const total =
    fila.length;

  const progress =
    document.getElementById(
      "progressBar"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );

  const statusText =
    document.getElementById(
      "statusText"
    );

  const failureText =
    document.getElementById(
      "failureText"
    );

  if(
    total === 0
  ) {

    progress.style.width =
      "100%";

    progressText.textContent =
      "Todas as entregas pendentes já possuem localização.";

    statusText.textContent =
      "Nenhum cliente pendente sem coordenadas.";

    atualizarTudo();

    return;

  }

  botao.disabled =
    true;

  botao.textContent =
    "⏳ Localizando...";

  failureText.innerHTML =
    "";

  let encontrados =
    0;

  let falhas =
    [];

  try {

    for(
      let i = 0;
      i < fila.length;
      i++
    ) {

      const entrega =
        fila[i];

      progressText.textContent =
        `Localizando ${i + 1} de ${total}`;

      progress.style.width =
        `${(
          i /
          total
        ) * 100}%`;

      statusText.textContent =
        `🔎 ${entrega.label} — preparando...`;

      atualizarLista();

      const sucesso =
        await localizarUm(
          entrega,
          tentativa => {

            statusText.textContent =
              `🔎 ${entrega.label} — ${tentativa}`;

          }
        );

      if(sucesso) {

        encontrados++;

        statusText.textContent =
          `✅ ${entrega.label} localizada`;

      } else {

        falhas.push(
          `${entrega.label} — ${obterEndereco(entrega)}`
        );

        statusText.textContent =
          `⚠️ ${entrega.label} não encontrada. Pulando para a próxima.`;

      }

      salvar();

      atualizarTudo();

      /*
        Respeitar intervalo do Nominatim.
      */

      await sleep(
        DELAY
      );

    }

  } finally {

    progress.style.width =
      "100%";

    progressText.textContent =
      `Concluído: ${encontrados} localizados, ${falhas.length} não localizados.`;

    if(
      falhas.length
    ) {

      failureText.innerHTML =
        "<b>Falhas nesta rodada:</b><br>" +
        falhas
          .map(
            item =>
              "• " +
              escapeHtml(
                item
              )
          )
          .join("<br>");

    } else {

      failureText.innerHTML =
        "✅ Todos os clientes desta rodada foram localizados.";

    }

    botao.disabled =
      false;

    botao.textContent =
      "🗺️ Localizar";

    salvar();

    atualizarTudo();

  }

}

/* =====================================================
   TENTAR FALHAS
===================================================== */

async function tentarFalhas() {

  /*
    Limpa apenas os erros.
    NÃO apaga coordenadas válidas.
  */

  entregas.forEach(
    entrega => {

      if(
        !possuiCoordenadas(
          entrega
        )
      ) {

        entrega.geocodeError =
          "";

      }

    }
  );

  salvar();

  await localizarTodos();

}

/* =====================================================
   MARCADORES
===================================================== */

function desenharMarcadores() {

  camadaMarcadores.clearLayers();

  marcadores =
    {};

  let quantidade =
    0;

  entregas.forEach(
    entrega => {

      if(
        !possuiCoordenadas(
          entrega
        )
      ) {

        return;

      }

      quantidade++;

      let cor =
        "#2563eb";

      if(
        entrega.status === "CARTA"
      ) {

        cor =
          "#059669";

      }

      if(
        entrega.status ===
        "NAO_LOCALIZADO"
      ) {

        cor =
          "#dc2626";

      }

      if(
        entrega.status ===
        "ZONA_DE_RISCO"
      ) {

        cor =
          "#d97706";

      }

      const icone =
        L.divIcon({

          className:
            "",

          html:
            `
            <div style="
              width:30px;
              height:30px;
              border-radius:50%;
              background:${cor};
              border:3px solid white;
              box-shadow:0 2px 8px rgba(0,0,0,.45);
              display:flex;
              align-items:center;
              justify-content:center;
              color:white;
              font-size:10px;
              font-weight:bold;
            ">
              ${entrega.id}
            </div>
            `,

          iconSize:
            [30,30],

          iconAnchor:
            [15,15]

        });

      const marker =
        L.marker(
          [
            entrega.lat,
            entrega.lon
          ],
          {
            icon:
              icone
          }
        );

      marker.bindPopup(
        `
        <strong>
          ${escapeHtml(
            entrega.label
          )}
        </strong>

        <br>

        ${escapeHtml(
          obterEndereco(
            entrega
          )
        )}

        ${
          entrega.bairroCorrigido
            ? `
              <br><br>
              <span style="color:#059669">
                📍 Bairro:
                ${escapeHtml(
                  entrega.bairroCorrigido
                )}
              </span>
              `
            : ""
        }

        <br><br>

        <button
          onclick="abrirEntrega(${entrega.id})"
          style="
            background:#2563eb;
            color:white;
            border:0;
            padding:7px 10px;
            border-radius:6px;
            font-weight:bold;
          "
        >
          Abrir entrega
        </button>
        `
      );

      marker.addTo(
        camadaMarcadores
      );

      marcadores[
        entrega.id
      ] =
        marker;

    }
  );

}

/* =====================================================
   DISTÂNCIA
===================================================== */

function distanciaKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;

  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;

  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}

/* =====================================================
   LISTA COMPLETA
===================================================== */

function atualizarLista() {

  const lista =
    document.getElementById(
      "deliveryList"
    );

  /*
    AGORA NÃO LIMITAMOS A 5,
    16 OU QUALQUER OUTRO NÚMERO.

    TODOS os clientes pendentes
    são colocados na lista.
  */

  const pendentes =
    entregas.filter(
      entrega =>
        entrega.status ===
        "PENDENTE"
    );

  pendentes.forEach(
    entrega => {

      if(
        posicaoUsuario &&
        possuiCoordenadas(
          entrega
        )
      ) {

        entrega._distancia =
          distanciaKm(
            posicaoUsuario.lat,
            posicaoUsuario.lon,
            entrega.lat,
            entrega.lon
          );

      } else {

        entrega._distancia =
          Infinity;

      }

    }
  );

  /*
    Se o GPS estiver ativo:
    mais próximos primeiro.

    Sem GPS:
    ordem dos IDs.
  */

  if(posicaoUsuario) {

    pendentes.sort(
      (a,b) =>
        a._distancia -
        b._distancia
    );

  } else {

    pendentes.sort(
      (a,b) =>
        Number(a.id) -
        Number(b.id)
    );

  }

  lista.innerHTML =
    pendentes
      .map(
        renderEntrega
      )
      .join("");

  document.getElementById(
    "listTitle"
  ).textContent =
    `📍 Entregas pendentes — ${pendentes.length} clientes`;

}

/* =====================================================
   RENDER ENTREGA
===================================================== */

function renderEntrega(
  entrega
) {

  let distancia =
    "";

  if(
    posicaoUsuario &&
    Number.isFinite(
      entrega._distancia
    )
  ) {

    distancia =
      `${entrega._distancia.toFixed(1)} km`;

  }

  let bairro =
    "";

  if(
    entrega.bairroCorrigido
  ) {

    bairro =
      `
      <div class="delivery-corrected">

        📍 Bairro localizado:
        ${escapeHtml(
          entrega.bairroCorrigido
        )}

      </div>
      `;

  }

  let erro =
    "";

  if(
    !possuiCoordenadas(
      entrega
    ) &&
    entrega.geocodeError
  ) {

    erro =
      `
      <div class="delivery-not-found">
        ⚠️ Ainda não localizado
      </div>
      `;

  }

  return `

    <div class="delivery">

      <div class="delivery-head">

        <div class="delivery-name">
          ${escapeHtml(
            entrega.label
          )}
        </div>

        <div class="delivery-distance">
          ${distancia}
        </div>

      </div>

      <div class="delivery-address">
        ${escapeHtml(
          obterEndereco(
            entrega
          )
        )}
      </div>

      ${bairro}

      ${erro}

      <span
        class="status ${classeStatus(
          entrega.status
        )}"
      >
        ${nomeStatus(
          entrega.status
        )}
      </span>

      <div class="delivery-actions">

        <button
          class="btn-blue"
          onclick="abrirEntrega(${entrega.id})"
        >
          Abrir
        </button>

        ${
          possuiCoordenadas(
            entrega
          )
            ? `
              <button
                class="btn-green"
                onclick="navegar(${entrega.id})"
              >
                🧭 Navegar
              </button>
              `
            : `
              <button
                class="btn-orange"
                onclick="localizarCliente(${entrega.id})"
              >
                📍 Localizar
              </button>
              `
        }

      </div>

    </div>

  `;

}

/* =====================================================
   LOCALIZAR CLIENTE INDIVIDUAL
===================================================== */

async function localizarCliente(id) {

  const entrega =
    entregas.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!entrega)
    return;

  const sucesso =
    await localizarUm(
      entrega,
      tentativa => {

        document.getElementById(
          "statusText"
        ).textContent =
          `🔎 ${entrega.label} — ${tentativa}`;

      }
    );

  if(sucesso) {

    document.getElementById(
      "statusText"
    ).textContent =
      `✅ ${entrega.label} localizada.`;

  } else {

    document.getElementById(
      "statusText"
    ).textContent =
      `⚠️ ${entrega.label} não foi localizada.`;

  }

  salvar();

  atualizarTudo();

}

/* =====================================================
   STATUS
===================================================== */

function classeStatus(status) {

  if(
    status === "CARTA"
  )
    return "status-carta";

  if(
    status ===
    "NAO_LOCALIZADO"
  )
    return "status-nao-localizado";

  if(
    status ===
    "ZONA_DE_RISCO"
  )
    return "status-risco";

  return "status-pendente";

}

function nomeStatus(status) {

  if(
    status === "CARTA"
  )
    return "CARTA";

  if(
    status ===
    "NAO_LOCALIZADO"
  )
    return "NÃO LOCALIZADO";

  if(
    status ===
    "ZONA_DE_RISCO"
  )
    return "ZONA DE RISCO";

  return "PENDENTE";

}

/* =====================================================
   MODAL
===================================================== */

function abrirEntrega(id) {

  const entrega =
    entregas.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!entrega)
    return;

  entregaSelecionada =
    entrega;

  document.getElementById(
    "modalTitle"
  ).textContent =
    entrega.label;

  let endereco =
    escapeHtml(
      obterEndereco(
        entrega
      )
    );

  if(
    entrega.bairroCorrigido
  ) {

    endereco +=
      `
      <br><br>

      <strong style="color:#059669">

        📍 Bairro encontrado:
        ${escapeHtml(
          entrega.bairroCorrigido
        )}

      </strong>
      `;

  }

  document.getElementById(
    "modalAddress"
  ).innerHTML =
    endereco;

  document.getElementById(
    "modal"
  ).style.display =
    "flex";

  if(
    possuiCoordenadas(
      entrega
    )
  ) {

    mapa.setView(
      [
        entrega.lat,
        entrega.lon
      ],
      16
    );

    if(
      marcadores[
        entrega.id
      ]
    ) {

      marcadores[
        entrega.id
      ].openPopup();

    }

  }

}

function fecharModal() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";

  entregaSelecionada =
    null;

}

function alterarStatus(status) {

  if(
    !entregaSelecionada
  )
    return;

  entregaSelecionada.status =
    status;

  entregaSelecionada.updatedAt =
    new Date()
      .toISOString();

  salvar();

  atualizarTudo();

  fecharModal();

}

/* =====================================================
   NAVEGAÇÃO
===================================================== */

function navegar(id) {

  const entrega =
    entregas.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(
    !entrega ||
    !possuiCoordenadas(
      entrega
    )
  ) {

    alert(
      "Este cliente ainda não possui localização."
    );

    return;

  }

  const url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      `${entrega.lat},${entrega.lon}`
    ) +
    "&travelmode=driving";

  window.open(
    url,
    "_blank"
  );

}

function navegarSelecionado() {

  if(
    entregaSelecionada
  ) {

    navegar(
      entregaSelecionada.id
    );

  }

}

/* =====================================================
   GPS
===================================================== */

function minhaLocalizacao() {

  if(
    !navigator.geolocation
  ) {

    alert(
      "Seu navegador não suporta GPS."
    );

    return;

  }

  navigator.geolocation.getCurrentPosition(

    position => {

      posicaoUsuario = {

        lat:
          position.coords.latitude,

        lon:
          position.coords.longitude

      };

      L.circleMarker(
        [
          posicaoUsuario.lat,
          posicaoUsuario.lon
        ],
        {
          radius: 8,
          color: "#2563eb",
          fillColor: "#2563eb",
          fillOpacity: .9
        }
      )
      .addTo(mapa)
      .bindPopup(
        "📍 Você está aqui"
      );

      mapa.setView(
        [
          posicaoUsuario.lat,
          posicaoUsuario.lon
        ],
        15
      );

      atualizarLista();

    },

    error => {

      alert(
        "Não foi possível obter sua localização."
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 30000
    }

  );

}

/* =====================================================
   EXPORTAR
===================================================== */

function escaparCSV(valor) {

  return '"' +
    String(
      valor ?? ""
    )
    .replace(
      /"/g,
      '""'
    ) +
    '"';

}

function exportarCSV() {

  const cabecalho = [

    "ID",
    "Entrega",
    "Endereco",
    "Status",
    "Atualizado_em",
    "Latitude",
    "Longitude",
    "Bairro_Corrigido",
    "Fonte_Geocodificacao"

  ];

  const linhas =
    entregas.map(
      entrega => [

        entrega.id,

        entrega.label,

        obterEndereco(
          entrega
        ),

        entrega.status,

        entrega.updatedAt ||
          "",

        possuiCoordenadas(
          entrega
        )
          ? entrega.lat
          : "",

        possuiCoordenadas(
          entrega
        )
          ? entrega.lon
          : "",

        entrega.bairroCorrigido ||
          "",

        entrega.geocodeSource ||
          ""

      ]
    );

  const csv =
    [
      cabecalho,
      ...linhas
    ]
    .map(
      linha =>
        linha
          .map(
            escaparCSV
          )
          .join(";")
    )
    .join("\n");

  const blob =
    new Blob(
      [
        "\ufeff" +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const link =
    document.createElement(
      "a"
    );

  link.href =
    url;

  link.download =
    "clientes_corrigidos.csv";

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  URL.revokeObjectURL(
    url
  );

}

/* =====================================================
   CONTADOR
===================================================== */

function atualizarContador() {

  const total =
    entregas.length;

  const localizados =
    entregas.filter(
      possuiCoordenadas
    ).length;

  document.getElementById(
    "headerCount"
  ).textContent =
    `${localizados}/${total}`;

}

/* =====================================================
   ATUALIZAR TUDO
===================================================== */

function atualizarTudo() {

  atualizarContador();

  desenharMarcadores();

  atualizarLista();

}
