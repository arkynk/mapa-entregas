<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mapa de Entregas</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* =========================
   HEADER
========================= */

header {
  background: #111827;
  color: white;
  padding: 12px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  z-index: 1000;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

h1 {
  margin: 0;
  font-size: 18px;
}

.subtitle {
  font-size: 12px;
  opacity: .75;
  margin-top: 3px;
}

.header-count {
  background: #2563eb;
  padding: 7px 10px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
}

/* =========================
   BOTÕES
========================= */

.toolbar {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 12px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.btn-primary {
  background: #2563eb;
  color: white;
}

.btn-secondary {
  background: #374151;
  color: white;
}

.btn-success {
  background: #059669;
  color: white;
}

.btn-warning {
  background: #d97706;
  color: white;
}

.btn-danger {
  background: #dc2626;
  color: white;
}

/* =========================
   MAPA
========================= */

#map {
  flex: 1;
  min-height: 280px;
  z-index: 1;
}

/* =========================
   PAINEL INFERIOR
========================= */

.bottom-panel {
  background: white;
  border-top: 1px solid #d1d5db;
  max-height: 46vh;
  display: flex;
  flex-direction: column;
  z-index: 500;
}

.progress-area {
  padding: 10px 12px 7px;
  border-bottom: 1px solid #e5e7eb;
}

.progress-text {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
  line-height: 1.4;
}

.progress-container {
  height: 8px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width .2s;
}

#geocodeStatus {
  min-height: 18px;
}

.list-title {
  padding: 9px 12px;
  font-weight: bold;
  font-size: 14px;
  border-bottom: 1px solid #e5e7eb;
}

#deliveryList {
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}

/* =========================
   ENTREGA
========================= */

.delivery {
  padding: 10px 12px;
  border-bottom: 1px solid #e5e7eb;
}

.delivery-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.delivery-title {
  font-weight: bold;
  font-size: 13px;
}

.distance {
  font-size: 11px;
  color: #2563eb;
  white-space: nowrap;
  font-weight: bold;
}

.delivery-address {
  margin-top: 4px;
  font-size: 12px;
  color: #4b5563;
  line-height: 1.35;
}

.delivery-corrected {
  margin-top: 4px;
  font-size: 11px;
  color: #059669;
  font-weight: bold;
}

.delivery-actions {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.delivery-actions button {
  padding: 7px 9px;
  font-size: 11px;
}

/* =========================
   STATUS
========================= */

.status {
  display: inline-block;
  margin-top: 5px;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: bold;
}

.status-pendente {
  background: #fef3c7;
  color: #92400e;
}

.status-carta {
  background: #dcfce7;
  color: #166534;
}

.status-nao-localizado {
  background: #fee2e2;
  color: #991b1b;
}

.status-risco {
  background: #fef3c7;
  color: #92400e;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 5000;
}

.modal {
  width: 100%;
  max-width: 600px;
  background: white;
  border-radius: 18px 18px 0 0;
  padding: 18px;
  max-height: 85vh;
  overflow: auto;
}

.modal h2 {
  margin: 0 0 8px;
  font-size: 18px;
}

.modal-address {
  font-size: 13px;
  color: #4b5563;
  line-height: 1.4;
  margin-bottom: 12px;
}

.modal-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.modal-buttons button {
  min-height: 44px;
}

.close-modal {
  width: 100%;
  margin-top: 10px;
  background: #e5e7eb;
  color: #111827;
}

/* =========================
   OUTROS
========================= */

.failures {
  margin-top: 8px;
  font-size: 11px;
  color: #991b1b;
  max-height: 100px;
  overflow: auto;
}

.locating {
  color: #2563eb;
}

.found {
  color: #059669;
}

.small-note {
  font-size: 10px;
  color: #6b7280;
  padding: 5px 12px 8px;
}

.leaflet-popup-content {
  font-size: 13px;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 4px;
}

.popup-address {
  color: #4b5563;
  margin-bottom: 7px;
}

.popup-button {
  background: #2563eb;
  color: white;
  padding: 7px 9px;
  border-radius: 7px;
  display: inline-block;
  font-weight: bold;
  font-size: 11px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 800px) {

  .bottom-panel {
    max-height: 42vh;
  }

  .modal-backdrop {
    align-items: center;
  }

  .modal {
    border-radius: 18px;
  }

}

<div id="map"></div>

<div class="bottom-panel">

<!-- =========================
     MODAL
========================= -->

<div
  id="modalBackdrop"

>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >

    <h2 id="modalTitle">

    </h2>

    <div
      id="modalAddress"
      class="modal-address"
    ></div>

    <div class="modal-buttons">

      <button
        class="btn-success"
        onclick="setStatus('CARTA')"

        ✉️ Carta

<!-- =====================================================
     CLIENTES
====================================================== -->

<script src="./clientes.js"></script>

<!-- =====================================================
     LEAFLET
====================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>

"use strict";

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const STORAGE_KEY =
  "mapa_entregas_clientes_v4";

const CACHE_KEY =
  "mapa_entregas_geocache_clientes_v4";

const DEFAULT_CENTER =
  [-29.1678, -51.1794];

const GEOCODE_TIMEOUT =
  10000;

const REQUEST_DELAY =
  1200;

/* =========================================================
   CLIENTES
   CORREÇÃO IMPORTANTE:
   CLIENTES é um const global criado pelo clientes.js.
========================================================= */

const sourceClients =
  typeof CLIENTES !== "undefined" &&
  Array.isArray(CLIENTES)
    ? CLIENTES
    : [];

/* =========================================================
   DADOS INICIAIS
========================================================= */

const INITIAL_DATA =
  sourceClients.map(
    (cliente, index) => {

      const address =
        cliente.endereco ||
        cliente.address ||
        [
          cliente.rua,
          cliente.numero,
          cliente.bairro,
          cliente.cidade ||
            "Caxias do Sul",
          cliente.uf ||
            "RS"
        ]
        .filter(Boolean)
        .join(", ");

      return {

        id:
          cliente.id ??
          index + 1,

        label:
          "Entrega " +
          (
            cliente.id ??
            index + 1
          ),

        address:
          address,

        rua:
          cliente.rua ||
          "",

        numero:
          cliente.numero ||
          "",

        bairro:
          cliente.bairro ||
          "",

        bairroCorrigido:
          cliente.bairroCorrigido ||
          "",

        cidade:
          cliente.cidade ||
          "Caxias do Sul",

        uf:
          cliente.uf ||
          "RS",

        observacao:
          cliente.observacao ||
          "",

        status:
          "PENDENTE",

        lat:
          Number.isFinite(
            Number(cliente.lat)
          )
            ? Number(cliente.lat)
            : null,

        lon:
          Number.isFinite(
            Number(cliente.lon)
          )
            ? Number(cliente.lon)
            : null,

        updatedAt:
          null,

        geocodeSource:
          "",

        geocodeTentativa:
          ""

      };

    }
  );

/* =========================================================
   CARREGAR STORAGE
========================================================= */

let deliveries = [];

let geocache = {};

let selectedDelivery =
  null;

let userLocation =
  null;

try {

  let saved =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    );

  /*
    Se não existir V4, tenta V3.
    Isso ajuda a preservar os dados
    da versão anterior.
  */

  if(!Array.isArray(saved)) {

    saved =
      JSON.parse(
        localStorage.getItem(
          "mapa_entregas_clientes_v3"
        )
      );

  }

  if(!Array.isArray(saved)) {

    saved =
      JSON.parse(
        localStorage.getItem(
          "mapa_entregas_clientes_v2"
        )
      );

  }

  if(Array.isArray(saved)) {

    const savedById =
      new Map(
        saved.map(
          item => [
            Number(item.id),
            item
          ]
        )
      );

    deliveries =
      INITIAL_DATA.map(
        item => {

          const old =
            savedById.get(
              Number(item.id)
            );

          if(old) {

            return {
              ...item,
              ...old,

              /*
                O endereço atual do clientes.js
                sempre tem prioridade.
              */

              address:
                item.address

            };

          }

          return {
            ...item
          };

        }
      );

  } else {

    deliveries =
      INITIAL_DATA.map(
        item => ({
          ...item
        })
      );

  }

} catch(error) {

  console.error(
    "Erro ao carregar dados:",
    error
  );

  deliveries =
    INITIAL_DATA.map(
      item => ({
        ...item
      })
    );

}

/* =========================================================
   CACHE
========================================================= */

try {

  const savedCache =
    JSON.parse(
      localStorage.getItem(
        CACHE_KEY
      )
    );

  if(
    savedCache &&
    typeof savedCache === "object"
  ) {

    geocache =
      savedCache;

  }

} catch(error) {

  geocache = {};

}

/* =========================================================
   MAPA
========================================================= */

const map =
  L.map("map");

map.setView(
  DEFAULT_CENTER,
  12
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

const markerLayer =
  L.layerGroup()
   .addTo(map);

let markersById = {};

/* =========================================================
   UTILITÁRIOS
========================================================= */

function normalize(value) {

  return String(
    value || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim()
  .toUpperCase();

}

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

function saveData() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        deliveries
      )
    );

  } catch(error) {

    console.error(
      "Erro ao salvar:",
      error
    );

  }

}

function saveCache() {

  try {

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(
        geocache
      )
    );

  } catch(error) {

    console.error(
      "Erro ao salvar cache:",
      error
    );

  }

}

function validCoordinate(d) {

  return (
    Number.isFinite(
      Number(d.lat)
    ) &&
    Number.isFinite(
      Number(d.lon)
    )
  );

}

function getAddress(d) {

  return String(
    d.address ||
    d.endereco ||
    [
      d.rua,
      d.numero,
      d.bairro,
      d.cidade,
      d.uf
    ]
    .filter(Boolean)
    .join(", ")
  ).trim();

}

/* =========================================================
   PARSER DE ENDEREÇO
========================================================= */

function parseAddress(d) {

  const original =
    getAddress(d);

  const parts =
    original
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean);

  let rua =
    "";

  let numero =
    "";

  let bairro =
    "";

  if(parts.length >= 3) {

    rua =
      parts[0];

    numero =
      parts[1];

    bairro =
      parts[2];

  }

  if(d.rua)
    rua = d.rua;

  if(d.numero)
    numero = d.numero;

  if(d.bairro)
    bairro = d.bairro;

  const numberMatch =
    String(numero).match(
      /^\s*(\d+[A-Za-z]?)/
    );

  if(numberMatch) {

    numero =
      numberMatch[1];

  }

  return {

    original,
    rua,
    numero,
    bairro

  };

}

/* =========================================================
   MONTAR CONSULTAS
========================================================= */

function buildQueries(d) {

  const parsed =
    parseAddress(d);

  const rua =
    parsed.rua;

  const numero =
    parsed.numero;

  const bairro =
    parsed.bairro;

  const cidade =
    d.cidade ||
    "Caxias do Sul";

  const uf =
    d.uf ||
    "RS";

  const queries =
    [];

  /*
    1 - RUA + NÚMERO
  */

  if(
    rua &&
    numero
  ) {

    queries.push({

      tipo:
        "rua + número",

      query:
        `${rua}, ${numero}, ${cidade}, ${uf}, Brasil`

    });

  }

  /*
    2 - RUA + NÚMERO + BAIRRO
  */

  if(
    rua &&
    numero &&
    bairro
  ) {

    queries.push({

      tipo:
        "rua + número + bairro",

      query:
        `${rua}, ${numero}, ${bairro}, ${cidade}, ${uf}, Brasil`

    });

  }

  /*
    3 - ENDEREÇO ORIGINAL
  */

  if(parsed.original) {

    queries.push({

      tipo:
        "endereço completo",

      query:
        parsed.original

    });

  }

  /*
    4 - RUA + CIDADE
  */

  if(rua) {

    queries.push({

      tipo:
        "rua + cidade",

      query:
        `${rua}, ${cidade}, ${uf}, Brasil`

    });

  }

  /*
    Remove consultas duplicadas.
  */

  const seen =
    new Set();

  return queries.filter(
    item => {

      const key =
        normalize(
          item.query
        );

      if(
        seen.has(key)
      ) {

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

/* =========================================================
   CACHE
========================================================= */

function cacheKeysForDelivery(d) {

  const parsed =
    parseAddress(d);

  const keys =
    [];

  if(
    parsed.rua &&
    parsed.numero
  ) {

    keys.push(
      normalize(
        `${parsed.rua}|${parsed.numero}`
      )
    );

  }

  keys.push(
    normalize(
      parsed.original
    )
  );

  return keys;

}

function findCachedCoordinate(d) {

  const keys =
    cacheKeysForDelivery(d);

  for(
    const key of keys
  ) {

    if(
      geocache[key] &&
      Number.isFinite(
        Number(
          geocache[key].lat
        )
      ) &&
      Number.isFinite(
        Number(
          geocache[key].lon
        )
      )
    ) {

      return geocache[key];

    }

  }

  return null;

}

/* =========================================================
   NOMINATIM
========================================================= */

async function fetchGeocode(query) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => {
        controller.abort();
      },
      GEOCODE_TIMEOUT
    );

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=5" +
      "&countrycodes=br" +
      "&accept-language=pt-BR" +
      "&addressdetails=1" +
      "&q=" +
      encodeURIComponent(
        query
      );

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    if(
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return await response.json();

  } finally {

    clearTimeout(
      timer
    );

  }

}

/* =========================================================
   ESCOLHER RESULTADO
========================================================= */

function chooseBestResult(
  results
) {

  if(
    !Array.isArray(results) ||
    !results.length
  ) {

    return null;

  }

  /*
    Primeiro procura Caxias do Sul.
  */

  const caxias =
    results.filter(
      result => {

        const address =
          result.address ||
          {};

        const city =
          normalize(
            address.city ||
            address.town ||
            address.municipality ||
            address.village ||
            ""
          );

        return city.includes(
          "CAXIAS DO SUL"
        );

      }
    );

  if(caxias.length)
    return caxias[0];

  /*
    Se não achou explicitamente,
    ainda usa o primeiro resultado.
  */

  return results[0];

}

/* =========================================================
   LOCALIZAR UMA ENTREGA
========================================================= */

async function geocodeOne(
  d,
  progressCallback
) {

  /*
    Primeiro verifica cache.
  */

  const cached =
    findCachedCoordinate(d);

  if(cached) {

    d.lat =
      Number(
        cached.lat
      );

    d.lon =
      Number(
        cached.lon
      );

    d.bairroCorrigido =
      cached.bairro ||
      d.bairroCorrigido ||
      "";

    d.geocodeSource =
      "cache";

    d.geocodeTentativa =
      "cache";

    return {

      success:
        true,

      source:
        "cache",

      bairro:
        d.bairroCorrigido

    };

  }

  const queries =
    buildQueries(d);

  if(!queries.length) {

    return {

      success:
        false,

      reason:
        "endereço insuficiente"

    };

  }

  for(
    let i = 0;
    i < queries.length;
    i++
  ) {

    const attempt =
      queries[i];

    if(progressCallback) {

      progressCallback(
        attempt.tipo,
        i + 1,
        queries.length
      );

    }

    try {

      const results =
        await fetchGeocode(
          attempt.query
        );

      const result =
        chooseBestResult(
          results
        );

      if(!result)
        continue;

      const lat =
        Number(
          result.lat
        );

      const lon =
        Number(
          result.lon
        );

      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        continue;

      }

      /*
        Coordenadas.
      */

      d.lat =
        lat;

      d.lon =
        lon;

      d.geocodeSource =
        attempt.tipo;

      d.geocodeTentativa =
        attempt.query;

      /*
        Bairro retornado pelo Nominatim.
      */

      const address =
        result.address ||
        {};

      const bairro =
        address.suburb ||
        address.neighbourhood ||
        address.quarter ||
        address.residential ||
        address.city_district ||
        "";

      if(bairro) {

        d.bairroCorrigido =
          bairro;

      }

      /*
        Cache por rua + número.
      */

      const parsed =
        parseAddress(d);

      if(
        parsed.rua &&
        parsed.numero
      ) {

        const key =
          normalize(
            `${parsed.rua}|${parsed.numero}`
          );

        geocache[key] = {

          lat,
          lon,

          bairro:
            d.bairroCorrigido ||
            "",

          source:
            attempt.tipo,

          updatedAt:
            new Date()
              .toISOString()

        };

      }

      /*
        Cache por endereço completo.
      */

      geocache[
        normalize(
          parsed.original
        )
      ] = {

        lat,
        lon,

        bairro:
          d.bairroCorrigido ||
          "",

        source:
          attempt.tipo,

        updatedAt:
          new Date()
            .toISOString()

      };

      saveCache();

      return {

        success:
          true,

        source:
          attempt.tipo,

        bairro:
          d.bairroCorrigido ||
          ""

      };

    } catch(error) {

      console.warn(
        "Erro na tentativa:",
        attempt.tipo,
        error
      );

    }

    /*
      Pequena pausa antes
      da próxima tentativa.
    */

    await sleep(300);

  }

  return {

    success:
      false,

    reason:
      "nenhuma tentativa encontrou o endereço"

  };

}

/* =========================================================
   LOCALIZAR TODOS
========================================================= */

async function geocodeAll() {

  const button =
    document.getElementById(
      "geocodeBtn"
    );

  if(
    button.dataset.running === "1"
  ) {

    return;

  }

  button.dataset.running =
    "1";

  button.disabled =
    true;

  button.textContent =
    "⏳ Localizando...";

  const pending =
    deliveries.filter(
      d =>
        d.status === "PENDENTE" &&
        !validCoordinate(d)
    );

  const total =
    pending.length;

  const progressBar =
    document.getElementById(
      "progressBar"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );

  const status =
    document.getElementById(
      "geocodeStatus"
    );

  const failureList =
    document.getElementById(
      "failureList"
    );

  failureList.innerHTML =
    "";

  if(!total) {

    progressText.textContent =
      "Todas as entregas pendentes já possuem localização.";

    progressBar.style.width =
      "100%";

    status.textContent =
      "Nenhuma nova localização necessária.";

    unlockGeocodeButton();

    renderAll();

    return;

  }

  let ok =
    0;

  let fail =
    0;

  const failures =
    [];

  try {

    for(
      let i = 0;
      i < pending.length;
      i++
    ) {

      const d =
        pending[i];

      const current =
        i + 1;

      progressText.textContent =
        `Localizando ${current} de ${total}`;

      progressBar.style.width =
        `${(i / total) * 100}%`;

      status.className =
        "small-note locating";

      status.textContent =
        `🔎 ${d.label}: preparando busca...`;

      renderList();

      const result =
        await geocodeOne(
          d,
          (
            tipo,
            tentativa,
            totalTentativas
          ) => {

            status.textContent =
              `🔎 ${d.label} — tentativa ${tentativa}/${totalTentativas}: ${tipo}`;

          }
        );

      if(result.success) {

        ok++;

        status.className =
          "small-note found";

        status.textContent =
          `✅ ${d.label} localizado por ${result.source}` +
          (
            result.bairro
              ? ` — Bairro: ${result.bairro}`
              : ""
          );

      } else {

        fail++;

        failures.push(
          `${d.label} — ${getAddress(d)}`
        );

        status.className =
          "small-note";

        status.textContent =
          `⚠️ ${d.label} não localizado. Indo para o próximo...`;

      }

      saveData();

      renderMarkers();

      renderList();

      updateHeader();

      /*
        Respeita intervalo entre consultas.
      */

      await sleep(
        REQUEST_DELAY
      );

    }

  } catch(error) {

    console.error(
      "Erro geral:",
      error
    );

    status.textContent =
      "⚠️ O processo encontrou um erro, mas o botão será liberado.";

  } finally {

    progressBar.style.width =
      "100%";

    progressText.textContent =
      `Concluído: ${ok} localizados, ${fail} não localizados.`;

    if(failures.length) {

      failureList.innerHTML =
        "<b>Não localizados:</b><br>" +
        failures
          .map(
            item =>
              "• " + item
          )
          .join("<br>");

    } else {

      failureList.innerHTML =
        "✅ Todas as entregas foram localizadas.";

    }

    saveData();

    renderAll();

    /*
      GARANTE QUE O BOTÃO
      NUNCA FIQUE TRAVADO.
    */

    unlockGeocodeButton();

  }

}

/* =========================================================
   LIBERAR BOTÃO
========================================================= */

function unlockGeocodeButton() {

  const button =
    document.getElementById(
      "geocodeBtn"
    );

  button.dataset.running =
    "0";

  button.disabled =
    false;

  button.textContent =
    "🗺️ Localizar entregas";

}

/* =========================================================
   TENTAR NOVAMENTE
========================================================= */

async function retryFailed() {

  await geocodeAll();

}

/* =========================================================
   MARCADORES
========================================================= */

function clearMarkers() {

  markerLayer.clearLayers();

  markersById =
    {};

}

function renderMarkers() {

  clearMarkers();

  deliveries.forEach(
    d => {

      if(
        !validCoordinate(d)
      ) {

        return;

      }

      let iconColor =
        "#2563eb";

      if(
        d.status === "CARTA"
      ) {

        iconColor =
          "#059669";

      }

      if(
        d.status === "NAO_LOCALIZADO"
      ) {

        iconColor =
          "#dc2626";

      }

      if(
        d.status === "ZONA_DE_RISCO"
      ) {

        iconColor =
          "#d97706";

      }

      const icon =
        L.divIcon({

          className:
            "",

          html:
            `
            <div style="
              width:30px;
              height:30px;
              border-radius:50%;
              background:${iconColor};
              border:3px solid white;
              box-shadow:0 2px 7px rgba(0,0,0,.45);
              display:flex;
              align-items:center;
              justify-content:center;
              color:white;
              font-size:11px;
              font-weight:bold;
            ">
              ${d.id}
            </div>
            `,

          iconSize:
            [30,30],

          iconAnchor:
            [15,15]

        });

      const marker =
        L.marker(
          [
            d.lat,
            d.lon
          ],
          {
            icon
          }
        );

      const bairroText =
        d.bairroCorrigido
          ? `
            <div style="
              color:#059669;
              font-size:11px;
              margin-top:4px
            ">
              📍 Bairro encontrado:
              ${escapeHtml(
                d.bairroCorrigido
              )}
            </div>
            `
          : "";

      marker.bindPopup(
        `
        <div class="popup-title">
          ${escapeHtml(
            d.label
          )}
        </div>

        <div class="popup-address">
          ${escapeHtml(
            getAddress(d)
          )}
        </div>

        ${bairroText}

        <div style="margin-top:8px">

          <span
            class="popup-button"
            onclick="openDelivery(${d.id})"
          >
            Abrir entrega
          </span>

        </div>
        `
      );

      marker.addTo(
        markerLayer
      );

      markersById[d.id] =
        marker;

    }
  );

}

/* =========================================================
   DISTÂNCIA
========================================================= */

function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;

  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;

  const a =
    Math.sin(
      dLat / 2
    ) *
    Math.sin(
      dLat / 2
    ) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(
      dLon / 2
    ) *
    Math.sin(
      dLon / 2
    );

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}

/* =========================================================
   LISTA
========================================================= */

function renderList() {

  const list =
    document.getElementById(
      "deliveryList"
    );

  const pending =
    deliveries
      .filter(
        d =>
          d.status === "PENDENTE"
      );

  if(!userLocation) {

    pending.sort(
      (a,b) =>
        Number(a.id) -
        Number(b.id)
    );

    list.innerHTML =
      pending
        .map(
          renderDelivery
        )
        .join("");

    return;

  }

  pending.forEach(
    d => {

      if(
        validCoordinate(d)
      ) {

        d.distance =
          distanceKm(
            userLocation.lat,
            userLocation.lon,
            d.lat,
            d.lon
          );

      } else {

        d.distance =
          Infinity;

      }

    }
  );

  pending.sort(
    (a,b) =>
      a.distance -
      b.distance
  );

  list.innerHTML =
    pending
      .map(
        renderDelivery
      )
      .join("");

}

/* =========================================================
   ITEM DA LISTA
========================================================= */

function renderDelivery(d) {

  let distance =
    "";

  if(
    userLocation &&
    Number.isFinite(
      d.distance
    )
  ) {

    distance =
      `${d.distance.toFixed(1)} km`;

  }

  const corrected =
    d.bairroCorrigido &&
    normalize(
      d.bairroCorrigido
    ) !==
    normalize(
      d.bairro
    )
      ? `
        <div class="delivery-corrected">
          📍 Bairro encontrado:
          ${escapeHtml(
            d.bairroCorrigido
          )}
        </div>
        `
      : "";

  return `

    <div class="delivery">

      <div class="delivery-top">

        <div class="delivery-title">
          ${escapeHtml(
            d.label
          )}
        </div>

        <div class="distance">
          ${distance}
        </div>

      </div>

      <div class="delivery-address">
        ${escapeHtml(
          getAddress(d)
        )}
      </div>

      ${corrected}

      <span
        class="status status-${statusClass(
          d.status
        )}"
      >
        ${statusLabel(
          d.status
        )}
      </span>

      <div class="delivery-actions">

        <button
          class="btn-primary"
          onclick="openDelivery(${d.id})"
        >
          Abrir
        </button>

        ${
          validCoordinate(d)
            ? `
              <button
                class="btn-success"
                onclick="navigateTo(${d.id})"
              >
                🧭 Navegar
              </button>
              `
            : ""
        }

      </div>

    </div>

  `;

}

/* =========================================================
   STATUS
========================================================= */

function statusClass(status) {

  if(
    status === "CARTA"
  )
    return "carta";

  if(
    status === "NAO_LOCALIZADO"
  )
    return "nao-localizado";

  if(
    status === "ZONA_DE_RISCO"
  )
    return "risco";

  return "pendente";

}

function statusLabel(status) {

  if(
    status === "CARTA"
  )
    return "CARTA";

  if(
    status === "NAO_LOCALIZADO"
  )
    return "NÃO LOCALIZADO";

  if(
    status === "ZONA_DE_RISCO"
  )
    return "ZONA DE RISCO";

  return "PENDENTE";

}

/* =========================================================
   MODAL
========================================================= */

function openDelivery(id) {

  const d =
    deliveries.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!d)
    return;

  selectedDelivery =
    d;

  document.getElementById(
    "modalTitle"
  ).textContent =
    d.label;

  let addressHtml =
    escapeHtml(
      getAddress(d)
    );

  if(
    d.bairroCorrigido
  ) {

    addressHtml +=
      `
      <br><br>

      <strong style="color:#059669">

        📍 Bairro encontrado:

        ${escapeHtml(
          d.bairroCorrigido
        )}

      </strong>
      `;

  }

  document.getElementById(
    "modalAddress"
  ).innerHTML =
    addressHtml;

  document.getElementById(
    "modalBackdrop"
  ).style.display =
    "flex";

  /*
    Centraliza o mapa no cliente.
  */

  if(
    validCoordinate(d)
  ) {

    map.setView(
      [
        d.lat,
        d.lon
      ],
      16
    );

    if(
      markersById[d.id]
    ) {

      markersById[d.id]
        .openPopup();

    }

  }

}

function closeModal() {

  document.getElementById(
    "modalBackdrop"
  ).style.display =
    "none";

  selectedDelivery =
    null;

}

function setStatus(status) {

  if(
    !selectedDelivery
  )
    return;

  selectedDelivery.status =
    status;

  selectedDelivery.updatedAt =
    new Date()
      .toISOString();

  saveData();

  renderAll();

  closeModal();

}

function navigateSelected() {

  if(
    !selectedDelivery
  )
    return;

  navigateTo(
    selectedDelivery.id
  );

}

/* =========================================================
   GOOGLE MAPS
========================================================= */

function navigateTo(id) {

  const d =
    deliveries.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!d)
    return;

  if(
    !validCoordinate(d)
  ) {

    alert(
      "Esta entrega ainda não possui localização."
    );

    return;

  }

  const url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      `${d.lat},${d.lon}`
    ) +
    "&travelmode=driving";

  window.open(
    url,
    "_blank"
  );

}

/* =========================================================
   LOCALIZAÇÃO DO USUÁRIO
========================================================= */

function locateMe() {

  if(
    !navigator.geolocation
  ) {

    alert(
      "Seu navegador não suporta localização."
    );

    return;

  }

  navigator.geolocation.getCurrentPosition(

    position => {

      userLocation = {

        lat:
          position.coords.latitude,

        lon:
          position.coords.longitude

      };

      map.setView(
        [
          userLocation.lat,
          userLocation.lon
        ],
        15
      );

      L.circleMarker(
        [
          userLocation.lat,
          userLocation.lon
        ],
        {
          radius:
            8,

          color:
            "#2563eb",

          fillColor:
            "#2563eb",

          fillOpacity:
            .9
        }
      )
      .addTo(map)
      .bindPopup(
        "📍 Você está aqui"
      );

      renderList();

    },

    error => {

      alert(
        "Não foi possível obter sua localização."
      );

    },

    {
      enableHighAccuracy:
        true,

      timeout:
        10000,

      maximumAge:
        30000
    }

  );

}

/* =========================================================
   EXPORTAR CSV
========================================================= */

function csvEscape(value) {

  return `"${String(
    value ?? ""
  ).replace(
    /"/g,
    '""'
  )}"`;

}

function exportCSV() {

  const headers = [

    "ID",
    "Entrega",
    "Endereco",
    "Status",
    "Atualizado_em",
    "Latitude",
    "Longitude",
    "Bairro_Original",
    "Bairro_Corrigido",
    "Fonte_Geocodificacao",
    "Tentativa_Geocodificacao"

  ];

  const rows =
    deliveries.map(
      d => [

        d.id,

        d.label,

        getAddress(d),

        d.status,

        d.updatedAt ||
          "",

        validCoordinate(d)
          ? d.lat
          : "",

        validCoordinate(d)
          ? d.lon
          : "",

        d.bairro ||
          "",

        d.bairroCorrigido ||
          "",

        d.geocodeSource ||
          "",

        d.geocodeTentativa ||
          ""

      ]
    );

  const csv =
    [
      headers,
      ...rows
    ]
    .map(
      row =>
        row
          .map(csvEscape)
          .join(";")
    )
    .join("\n");

  const blob =
    new Blob(
      [
        "\ufeff" +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  const date =
    new Date()
      .toISOString()
      .slice(
        0,
        10
      );

  a.href =
    url;

  a.download =
    `entregas_clientes_${date}.csv`;

  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}

/* =========================================================
   CONTADOR
========================================================= */

function updateHeader() {

  const total =
    deliveries.length;

  const located =
    deliveries.filter(
      validCoordinate
    ).length;

  document.getElementById(
    "headerCount"
  ).textContent =
    `${located}/${total}`;

}

/* =========================================================
   RENDER GERAL
========================================================= */

function renderAll() {

  updateHeader();

  renderMarkers();

  renderList();

}

/* =========================================================
   SEGURANÇA
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
