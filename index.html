<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Mapa de Entregas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
    }

    body {
      overflow-x: hidden;
    }

    /* ==============================
       CABEÇALHO
       ============================== */

    header {
      width: 100%;
      background: #111827;
      color: #ffffff;
      padding: 11px 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.20);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .titulo {
      min-width: 0;
    }

    .titulo h1 {
      margin: 0;
      font-size: 19px;
      line-height: 22px;
      font-weight: 700;
      white-space: nowrap;
    }

    .titulo p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #cbd5e1;
    }

    .contador {
      flex-shrink: 0;
      min-width: 68px;
      padding: 6px 9px;
      border-radius: 9px;
      background: #1f2937;
      border: 1px solid #374151;
      text-align: center;
    }

    .contador strong {
      display: block;
      font-size: 17px;
      line-height: 18px;
    }

    .contador span {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      color: #cbd5e1;
    }

    /* ==============================
       CONTEÚDO
       ============================== */

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px;
    }

    /* ==============================
       BOTÃO
       ============================== */

    .botao-localizar {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25);
    }

    .botao-localizar:active {
      transform: scale(0.99);
    }

    .botao-localizar:disabled {
      background: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ==============================
       STATUS
       ============================== */

    .status {
      width: 100%;
      background: #ffffff;
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
    }

    .status-texto {
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
    }

    .status-detalhe {
      margin-top: 4px;
      color: #64748b;
      font-size: 11px;
      line-height: 15px;
      word-break: break-word;
    }

    .progresso-container {
      width: 100%;
      height: 8px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 20px;
      background: #e2e8f0;
    }

    .progresso {
      width: 0%;
      height: 100%;
      background: #2563eb;
      border-radius: 20px;
      transition: width 0.25s ease;
    }

    /* ==============================
       MAPA
       ============================== */

    #map {
      width: 100%;
      height: 42vh;
      min-height: 280px;
      max-height: 360px;
      border-radius: 12px;
      overflow: hidden;
      background: #dbeafe;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    /* ==============================
       RESUMO
       ============================== */

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .resumo-item {
      background: #ffffff;
      border-radius: 10px;
      padding: 9px 5px;
      text-align: center;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.07);
    }

    .resumo-numero {
      display: block;
      font-size: 19px;
      font-weight: 700;
      line-height: 21px;
    }

    .resumo-label {
      display: block;
      margin-top: 3px;
      font-size: 9px;
      color: #64748b;
    }

    /* ==============================
       LISTA
       ============================== */

    .lista-container {
      margin-top: 10px;
      background: #ffffff;
      border-radius: 11px;
      padding: 10px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
    }

    .lista-titulo {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .cliente-item {
      padding: 9px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .cliente-item:last-child {
      border-bottom: 0;
    }

    .cliente-nome {
      font-size: 13px;
      font-weight: 700;
      line-height: 17px;
    }

    .cliente-endereco {
      margin-top: 3px;
      color: #64748b;
      font-size: 11px;
      line-height: 15px;
    }

    .cliente-status {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 15px;
    }

    .aguardando {
      color: #64748b;
    }

    .localizando {
      color: #2563eb;
    }

    .segunda-tentativa {
      color: #d97706;
    }

    .sucesso {
      color: #15803d;
    }

    .falha {
      color: #dc2626;
    }

    /* ==============================
       LEAFLET
       ============================== */

    .leaflet-popup-content {
      margin: 10px 12px;
    }

    .popup-nome {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .popup-endereco {
      font-size: 12px;
      line-height: 16px;
      color: #475569;
    }

    @media (min-width: 700px) {

      main {
        padding: 15px;
      }

      #map {
        height: 500px;
        max-height: none;
      }

      .titulo h1 {
        font-size: 21px;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="header-top">

      <div class="titulo">

        <h1>📦 Mapa de Entregas</h1>

        <p>Localização dos clientes</p>

      </div>

      <div class="contador">

        <strong id="contadorClientes">0</strong>

        <span>clientes</span>

      </div>

    </div>

  </header>


  <main>

    <button
      id="botaoLocalizar"
      class="botao-localizar"
      type="button"
    >
      📍 LOCALIZAR CLIENTES
    </button>


    <div class="status">

      <div
        id="statusTexto"
        class="status-texto"
      >
        Aguardando início...
      </div>

      <div
        id="statusDetalhe"
        class="status-detalhe"
      >
        Toque no botão acima para iniciar a localização dos clientes.
      </div>

      <div class="progresso-container">

        <div
          id="barraProgresso"
          class="progresso"
        ></div>

      </div>

    </div>


    <div id="map"></div>


    <div class="resumo">

      <div class="resumo-item">

        <span
          id="contadorProcessados"
          class="resumo-numero"
        >
          0
        </span>

        <span class="resumo-label">
          Processados
        </span>

      </div>


      <div class="resumo-item">

        <span
          id="contadorEncontrados"
          class="resumo-numero"
        >
          0
        </span>

        <span class="resumo-label">
          Localizados
        </span>

      </div>


      <div class="resumo-item">

        <span
          id="contadorFalhas"
          class="resumo-numero"
        >
          0
        </span>

        <span class="resumo-label">
          Não localizados
        </span>

      </div>

    </div>


    <div class="lista-container">

      <div class="lista-titulo">
        📋 Lista de clientes
      </div>

      <div id="listaClientes"></div>

    </div>

  </main>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script src="./clientes.js?v=20261006"></script>


  <script>

    /* ============================================================
       CONFIGURAÇÕES
       ============================================================ */

    const CENTRO_INICIAL = [
      -29.1678,
      -51.1794
    ];

    const ZOOM_INICIAL = 12;

    const INTERVALO_GEOCODIFICACAO = 1500;


    /* ============================================================
       ELEMENTOS
       ============================================================ */

    const botaoLocalizar =
      document.getElementById("botaoLocalizar");

    const statusTexto =
      document.getElementById("statusTexto");

    const statusDetalhe =
      document.getElementById("statusDetalhe");

    const barraProgresso =
      document.getElementById("barraProgresso");

    const contadorClientes =
      document.getElementById("contadorClientes");

    const contadorProcessados =
      document.getElementById("contadorProcessados");

    const contadorEncontrados =
      document.getElementById("contadorEncontrados");

    const contadorFalhas =
      document.getElementById("contadorFalhas");

    const listaClientes =
      document.getElementById("listaClientes");


    /* ============================================================
       MAPA
       ============================================================ */

    const mapa = L.map("map", {
      zoomControl: true,
      attributionControl: true
    }).setView(
      CENTRO_INICIAL,
      ZOOM_INICIAL
    );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }
    ).addTo(mapa);


    const camadaMarcadores =
      L.layerGroup().addTo(mapa);


    /* ============================================================
       VARIÁVEIS
       ============================================================ */

    let clientes = [];

    let processando = false;

    let encontrados = 0;

    let falhas = 0;

    let processados = 0;

    let limitesMapa =
      L.latLngBounds([]);


    /* ============================================================
       FUNÇÕES BÁSICAS
       ============================================================ */

    function esperar(ms) {

      return new Promise(
        resolve => setTimeout(resolve, ms)
      );

    }


    function escaparHTML(valor) {

      if (valor === null || valor === undefined) {
        return "";
      }

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ============================================================
       PEGAR NOME
       ============================================================ */

    function pegarNome(cliente) {

      if (!cliente || typeof cliente !== "object") {
        return "Cliente";
      }

      const possibilidades = [
        cliente.nome,
        cliente.cliente,
        cliente.razao_social,
        cliente.razaoSocial,
        cliente.fantasia,
        cliente.nome_cliente,
        cliente.NOME,
        cliente.Nome
      ];

      for (const valor of possibilidades) {

        if (
          valor !== undefined &&
          valor !== null &&
          String(valor).trim() !== ""
        ) {

          return String(valor).trim();

        }

      }

      return "Cliente";

    }


    /* ============================================================
       PEGAR ENDEREÇO
       ============================================================ */

    function pegarEndereco(cliente) {

      if (!cliente || typeof cliente !== "object") {
        return "";
      }


      const enderecoDireto = [
        cliente.endereco,
        cliente.endereço,
        cliente.address,
        cliente.ENDERECO,
        cliente.Endereco
      ];


      for (const valor of enderecoDireto) {

        if (
          valor !== undefined &&
          valor !== null &&
          String(valor).trim() !== ""
        ) {

          return String(valor).trim();

        }

      }


      const partes = [];


      const rua =
        cliente.rua ??
        cliente.Rua ??
        cliente.logradouro ??
        cliente.Logradouro ??
        cliente.ENDERECO_RUA ??
        "";


      const numero =
        cliente.numero ??
        cliente.Numero ??
        cliente.n ??
        cliente.N ??
        "";


      const bairro =
        cliente.bairro ??
        cliente.Bairro ??
        "";


      const cidade =
        cliente.cidade ??
        cliente.Cidade ??
        cliente.municipio ??
        cliente.Municipio ??
        "";


      const uf =
        cliente.uf ??
        cliente.UF ??
        cliente.estado ??
        cliente.Estado ??
        "";


      if (String(rua).trim() !== "") {
        partes.push(String(rua).trim());
      }


      if (String(numero).trim() !== "") {
        partes.push(String(numero).trim());
      }


      if (String(bairro).trim() !== "") {
        partes.push(String(bairro).trim());
      }


      if (String(cidade).trim() !== "") {
        partes.push(String(cidade).trim());
      }


      if (String(uf).trim() !== "") {
        partes.push(String(uf).trim());
      }


      return partes.join(", ");

    }


    /* ============================================================
       CARREGAR CLIENTES
       ============================================================ */

    function carregarClientes() {

      let dados = null;


      if (
        typeof CLIENTES !== "undefined" &&
        Array.isArray(CLIENTES)
      ) {

        dados = CLIENTES;

      }
      else if (
        typeof clientes !== "undefined" &&
        Array.isArray(clientes)
      ) {

        dados = clientes;

      }
      else if (
        typeof dadosClientes !== "undefined" &&
        Array.isArray(dadosClientes)
      ) {

        dados = dadosClientes;

      }
      else if (
        typeof dados !== "undefined" &&
        Array.isArray(dados)
      ) {

        dados = dados;

      }


      if (!Array.isArray(dados)) {

        statusTexto.textContent =
          "Erro ao carregar clientes.";

        statusDetalhe.textContent =
          "Não foi encontrada uma lista válida no arquivo clientes.js.";

        return;

      }


      clientes = dados
        .map((cliente, indice) => {

          return {

            original: cliente,

            indice: indice,

            nome: pegarNome(cliente),

            endereco: pegarEndereco(cliente),

            status: "Aguardando localização...",

            lat: null,

            lon: null

          };

        })
        .filter(cliente => {

          return (
            cliente.endereco &&
            cliente.endereco.trim() !== ""
          );

        });


      contadorClientes.textContent =
        clientes.length;


      atualizarLista();


      atualizarInformacoes();


      if (clientes.length === 0) {

        statusTexto.textContent =
          "Nenhum cliente encontrado.";

        statusDetalhe.textContent =
          "Verifique o conteúdo do arquivo clientes.js.";

      }

    }


    /* ============================================================
       ATUALIZAR STATUS DO CLIENTE
       ============================================================ */

    function atualizarStatusCliente(
      cliente,
      texto,
      classe
    ) {

      cliente.status = texto;

      const elemento =
        document.getElementById(
          "cliente-" + cliente.indice
        );


      if (!elemento) {
        return;
      }


      const status =
        elemento.querySelector(
          ".cliente-status"
        );


      if (!status) {
        return;
      }


      status.textContent = texto;

      status.className =
        "cliente-status " +
        (classe || "");

    }


    /* ============================================================
       ATUALIZAR LISTA
       ============================================================ */

    function atualizarLista() {

      listaClientes.innerHTML = "";


      clientes.forEach(cliente => {

        const item =
          document.createElement("div");

        item.className =
          "cliente-item";

        item.id =
          "cliente-" + cliente.indice;


        item.innerHTML = `

          <div class="cliente-nome">
            ${escaparHTML(cliente.nome)}
          </div>

          <div class="cliente-endereco">
            ${escaparHTML(cliente.endereco)}
          </div>

          <div class="cliente-status aguardando">
            ${escaparHTML(cliente.status)}
          </div>

        `;


        listaClientes.appendChild(item);

      });

    }


    /* ============================================================
       ATUALIZAR INFORMAÇÕES
       ============================================================ */

    function atualizarInformacoes() {

      contadorProcessados.textContent =
        processados;

      contadorEncontrados.textContent =
        encontrados;

      contadorFalhas.textContent =
        falhas;


      let porcentagem = 0;


      if (clientes.length > 0) {

        porcentagem =
          Math.round(
            (processados / clientes.length) * 100
          );

      }


      barraProgresso.style.width =
        porcentagem + "%";

    }


    /* ============================================================
       CONSULTA NOMINATIM
       ============================================================ */

    async function consultarNominatim(
      endereco
    ) {

      let enderecoCompleto =
        String(endereco || "").trim();


      if (!enderecoCompleto) {
        return null;
      }


      /*
       * PRIMEIRA BUSCA
       *
       * Mantemos o mesmo princípio da versão
       * que estava funcionando.
       */

      if (
        !/Brasil/i.test(enderecoCompleto)
      ) {

        enderecoCompleto += ", Brasil";

      }


      const parametros =
        new URLSearchParams({

          format: "jsonv2",

          addressdetails: "1",

          limit: "5",

          countrycodes: "br",

          "accept-language": "pt-BR",

          q: enderecoCompleto

        });


      const url =
        "https://nominatim.openstreetmap.org/search?" +
        parametros.toString();


      try {

        const resposta =
          await fetch(url, {
            method: "GET"
          });


        if (!resposta.ok) {

          throw new Error(
            "HTTP " + resposta.status
          );

        }


        const resultados =
          await resposta.json();


        if (
          Array.isArray(resultados) &&
          resultados.length > 0
        ) {

          /*
           * Primeiro tentamos encontrar um resultado
           * claramente brasileiro.
           *
           * Se não houver, usamos o primeiro.
           *
           * NÃO fazemos pontuação complexa.
           */

          const brasileiro =
            resultados.find(resultado => {

              const display =
                String(
                  resultado.display_name || ""
                ).toLowerCase();

              const address =
                resultado.address || {};

              const pais =
                String(
                  address.country || ""
                ).toLowerCase();

              const estado =
                String(
                  address.state || ""
                ).toLowerCase();

              return (
                pais.includes("brasil") ||
                display.includes("brasil") ||
                estado.includes("rio grande do sul")
              );

            });


          return brasileiro || resultados[0];

        }


        return null;

      }
      catch (erro) {

        console.warn(
          "Erro na primeira consulta:",
          erro
        );

        return null;

      }

    }


    /* ============================================================
       SEGUNDA TENTATIVA
       ============================================================ */

    async function consultarNominatimFallback(
      endereco
    ) {

      let texto =
        String(endereco || "").trim();


      if (!texto) {
        return null;
      }


      /*
       * A segunda tentativa é propositalmente
       * mais simples.
       *
       * Ela só é usada quando a primeira busca
       * não encontrou absolutamente nada.
       */

      const partes =
        texto
          .split(",")
          .map(parte => parte.trim())
          .filter(Boolean);


      let enderecoSimplificado = texto;


      if (partes.length > 2) {

        enderecoSimplificado =
          partes
            .slice(0, 3)
            .join(", ");

      }


      if (
        !/Brasil/i.test(enderecoSimplificado)
      ) {

        enderecoSimplificado +=
          ", Brasil";

      }


      const parametros =
        new URLSearchParams({

          format: "jsonv2",

          addressdetails: "1",

          limit: "5",

          countrycodes: "br",

          "accept-language": "pt-BR",

          q: enderecoSimplificado

        });


      const url =
        "https://nominatim.openstreetmap.org/search?" +
        parametros.toString();


      try {

        const resposta =
          await fetch(url, {
            method: "GET"
          });


        if (!resposta.ok) {

          throw new Error(
            "HTTP " + resposta.status
          );

        }


        const resultados =
          await resposta.json();


        if (
          Array.isArray(resultados) &&
          resultados.length > 0
        ) {

          return resultados[0];

        }


        return null;

      }
      catch (erro) {

        console.warn(
          "Erro na segunda consulta:",
          erro
        );

        return null;

      }

    }


    /* ============================================================
       ADICIONAR MARCADOR
       ============================================================ */

    function adicionarMarcador(
      cliente,
      resultado
    ) {

      const lat =
        Number(resultado.lat);

      const lon =
        Number(resultado.lon);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        return false;

      }


      /*
       * Segurança para evitar coordenadas absurdas.
       *
       * NÃO alteramos sinal,
       * NÃO invertimos latitude/longitude.
       */

      if (
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        return false;

      }


      cliente.lat = lat;

      cliente.lon = lon;


      const marcador =
        L.circleMarker(
          [lat, lon],
          {
            radius: 8,

            color: "#ffffff",

            weight: 2,

            fillColor: "#2563eb",

            fillOpacity: 0.95

          }
        );


      marcador.bindPopup(`

        <div class="popup-nome">
          ${escaparHTML(cliente.nome)}
        </div>

        <div class="popup-endereco">
          ${escaparHTML(cliente.endereco)}
        </div>

      `);


      marcador.addTo(
        camadaMarcadores
      );


      limitesMapa.extend([
        lat,
        lon
      ]);


      return true;

    }


    /* ============================================================
       LOCALIZAR UM CLIENTE
       ============================================================ */

    async function localizarCliente(
      cliente
    ) {

      atualizarStatusCliente(
        cliente,
        "Localizando...",
        "localizando"
      );


      statusDetalhe.textContent =
        cliente.nome +
        " — " +
        cliente.endereco;


      /*
       * PRIMEIRA TENTATIVA
       */

      let resultado =
        await consultarNominatim(
          cliente.endereco
        );


      /*
       * Se encontrou, usamos imediatamente.
       *
       * Não fazemos uma segunda consulta.
       */

      if (resultado) {

        const sucesso =
          adicionarMarcador(
            cliente,
            resultado
          );


        if (sucesso) {

          encontrados++;


          atualizarStatusCliente(
            cliente,
            "✓ Localizado",
            "sucesso"
          );


          atualizarInformacoes();


          return true;

        }

      }


      /*
       * Só chegamos aqui se a primeira busca
       * realmente não conseguiu localizar.
       */

      atualizarStatusCliente(
        cliente,
        "Tentando segunda busca...",
        "segunda-tentativa"
      );


      await esperar(1500);


      resultado =
        await consultarNominatimFallback(
          cliente.endereco
        );


      if (resultado) {

        const sucesso =
          adicionarMarcador(
            cliente,
            resultado
          );


        if (sucesso) {

          encontrados++;


          atualizarStatusCliente(
            cliente,
            "✓ Localizado na segunda tentativa",
            "sucesso"
          );


          atualizarInformacoes();


          return true;

        }

      }


      /*
       * Não localizado.
       */

      falhas++;


      atualizarStatusCliente(
        cliente,
        "✕ Não localizado",
        "falha"
      );


      atualizarInformacoes();


      return false;

    }


    /* ============================================================
       LOCALIZAR TODOS
       ============================================================ */

    async function localizarTodos() {

      if (processando) {
        return;
      }


      if (!clientes.length) {

        statusTexto.textContent =
          "Nenhum cliente disponível.";

        return;

      }


      processando = true;


      botaoLocalizar.disabled =
        true;


      botaoLocalizar.textContent =
        "⏳ LOCALIZANDO...";


      encontrados = 0;

      falhas = 0;

      processados = 0;


      limitesMapa =
        L.latLngBounds([]);


      camadaMarcadores.clearLayers();


      clientes.forEach(cliente => {

        cliente.status =
          "Aguardando localização...";

        cliente.lat = null;

        cliente.lon = null;

      });


      atualizarLista();


      atualizarInformacoes();


      statusTexto.textContent =
        "Iniciando localização...";


      statusDetalhe.textContent =
        "Consultando os endereços um por um.";


      for (
        let i = 0;
        i < clientes.length;
        i++
      ) {

        const cliente =
          clientes[i];


        statusTexto.textContent =
          "Localizando " +
          (i + 1) +
          " de " +
          clientes.length;


        await localizarCliente(
          cliente
        );


        processados++;


        atualizarInformacoes();


        /*
         * Intervalo entre clientes.
         *
         * Mantemos 1,5 segundo para evitar
         * excesso de requisições ao Nominatim.
         */

        if (
          i < clientes.length - 1
        ) {

          await esperar(
            INTERVALO_GEOCODIFICACAO
          );

        }

      }


      /*
       * Ajusta o mapa para mostrar todos
       * os clientes encontrados.
       */

      if (
        limitesMapa.isValid()
      ) {

        mapa.fitBounds(
          limitesMapa,
          {
            padding: [25, 25],

            maxZoom: 16

          }
        );

      }


      statusTexto.textContent =
        "Localização concluída";


      statusDetalhe.textContent =
        encontrados +
        " clientes localizados e " +
        falhas +
        " não localizados.";


      botaoLocalizar.disabled =
        false;


      botaoLocalizar.textContent =
        "📍 LOCALIZAR NOVAMENTE";


      processando = false;


      atualizarInformacoes();

    }


    /* ============================================================
       EVENTO DO BOTÃO
       ============================================================ */

    botaoLocalizar.addEventListener(
      "click",
      localizarTodos
    );


    /* ============================================================
       INICIALIZAÇÃO
       ============================================================ */

    carregarClientes();


    /*
     * Corrige o tamanho do mapa depois
     * que a página termina de carregar.
     */

    setTimeout(() => {

      mapa.invalidateSize();

    }, 300);


    window.addEventListener(
      "resize",
      () => {

        mapa.invalidateSize();

      }
    );

  </script>
