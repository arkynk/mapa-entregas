<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Mapa de Entregas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#eef2f5;
  color:#172033;
  font-family:Arial,sans-serif
}

body{
  padding-bottom:20px
}

header{

}

header h1{

}

header p{

}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;

}

.count{

.actions{

.go{

.nav{

  color:#172033
}

  position:fixed;

  background:#0008;
  z-index:3000;
  align-items:flex-end
}

.sheet{
  background:#fff;
  width:100%;

  padding:16px
}

.sheet h2{

}

.sheet p{

  line-height:1.4
}

.status{

  grid-template-columns:1fr;

}

.status button{
  border:0;
  border-radius:12px;
  padding:13px;

  color:#fff
}

.carta{
  background:#16a34a
}

.nao{
  background:#dc2626
}

.risco{
  background:#ea580c
}

  background:#e5e7eb!important;
  color:#111827!important
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <h1>📦 Mapa de Entregas</h1>
      <p>Localização inteligente dos clientes</p>
    </div>

    <div class="count" id="count">0/0</div>
  </div>

</header>

<div class="wrap">

    <b>Visitas pendentes:</b>

      <div id="bar"></div>

  </div>

  <div class="list-title">
    📍 Visitas que ainda faltam

</div>

<div class="modal" id="modal">

      <button
        class="nao"
        onclick="setStatus('NAO_LOCALIZADO')">
        ❌ NÃO LOCALIZADO

      <button
        class="risco"
        onclick="setStatus('ZONA_DE_RISCO')">
        ⚠️ ZONA DE RISCO
      </button>

      <button
        class="close"
        onclick="closeModal()">
        Fechar

    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const INITIAL = INITIAL_ADDRESSES.map(
  (address,i)=>({
    id:i+1,
    label:'Entrega '+(i+1),
    address,
    status:'PENDENTE',
    lat:null,
    lon:null,
    updatedAt:null
  })
);

let deliveries = loadData();

let userPos = null;

let userMarker = null;

let accuracyCircle = null;

let markers = new Map();

let selectedId = null;

let geocache = JSON.parse(
  localStorage.getItem(CACHE_KEY)||'{}'
);

Object.keys(geocache).forEach(k=>{

  const p={
    lat:Number(geocache[k]?.lat),
    lon:Number(geocache[k]?.lon)
  };

  if(validCoords(p)){
    geocache[k]=p;
  }else{
    delete geocache[k];
  }

});

localStorage.setItem(
  CACHE_KEY,
  JSON.stringify(geocache)
);

deliveries.forEach(validCoords);

const map = L.map('map').setView(
  CENTER,
  13
);

L.tileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* ============================
   VALIDAÇÃO DAS COORDENADAS
   ============================ */

function validCoords(d){

  let lat=Number(d.lat);
  let lon=Number(d.lon);

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){
    d.lat=null;
    d.lon=null;
    return false;
  }

  if(
    Math.abs(lat)>90 &&
    Math.abs(lon)<=90
  ){
    [lat,lon]=[lon,lat];
  }

  if(
    lat<-30 ||
    lat>-28 ||
    lon<-52 ||
    lon>-50.5
  ){
    d.lat=null;
    d.lon=null;
    return false;
  }

  d.lat=lat;
  d.lon=lon;

  return true;
}


/* ============================
   DADOS
   ============================ */

function loadData(){

  try{

    const x=JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

    if(
      Array.isArray(x) &&
      x.length
    ){
      return x;
    }

  }catch(e){}

  return structuredClone(INITIAL);
}

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(deliveries)
  );

}

function norm(s){

  return String(s)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/\s+/g,' ')
    .trim();

}

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


/* ============================
   DISTÂNCIA
   ============================ */

function distanceKm(a,b,c,d){

  if(
    ![a,b,c,d].every(Number.isFinite)
  ){
    return null;
  }

  if(
    Math.abs(a)>90 ||
    Math.abs(c)>90 ||
    Math.abs(b)>180 ||
    Math.abs(d)>180
  ){
    return null;
  }

  const r=6371;

  const x=
    Math.sin((c-a)*Math.PI/360)**2+
    Math.cos(a*Math.PI/180)*
    Math.cos(c*Math.PI/180)*
    Math.sin((d-b)*Math.PI/360)**2;

  return r*2*Math.atan2(
    Math.sqrt(
      Math.min(1,Math.max(0,x))
    ),
    Math.sqrt(
      1-Math.min(1,Math.max(0,x))
    )
  );

}

function distText(k){

  if(k==null)return '';

  return k<1
    ?Math.round(k*1000)+' m'
    :k.toFixed(1).replace('.',',')+' km';

}


/* ============================
   MAPA
   ============================ */

function clearMarkers(){

  markers.forEach(
    m=>map.removeLayer(m)
  );

  markers.clear();

}

function icon(){

  return L.divIcon({
    className:'',
    html:'<div class="pin"><span>📍</span></div>',
    iconSize:[34,34],
    iconAnchor:[10,32]
  });

}

function renderMarkers(){

  clearMarkers();

  deliveries
    .filter(
      d=>
        d.status==='PENDENTE' &&
        Number.isFinite(d.lat) &&
        Number.isFinite(d.lon)
    )
    .forEach(d=>{

      const m=L.marker(
        [d.lat,d.lon],
        {icon:icon()}
      ).addTo(map);

      m.bindPopup(
        '<b>'+
        esc(d.label)+
        '</b><br>'+
        esc(d.address)+
        '<br>'+
        '<button onclick="openDelivery('+d.id+')" '+
        'style="margin-top:7px;padding:8px;border:0;border-radius:8px;background:#172033;color:white;font-weight:bold">'+
        'Abrir entrega</button>'
      );

      m.on(
        'click',
        ()=>openDelivery(d.id)
      );

      markers.set(d.id,m);

    });

}


/* ============================
   LISTA
   ============================ */

function renderList(){

  const el=document.getElementById('list');

  let arr=deliveries.filter(
    d=>d.status==='PENDENTE'
  );

  if(userPos){

    arr=arr
      .map(d=>({
        ...d,
        dist:
          Number.isFinite(d.lat)&&
          Number.isFinite(d.lon)
            ?distanceKm(
              userPos.lat,
              userPos.lon,
              d.lat,
              d.lon
            )
            :null
      }))
      .sort(
        (a,b)=>
          a.dist==null
            ?1
            :b.dist==null
              ?-1
              :a.dist-b.dist
      );

  }

  const coords=arr.filter(
    d=>
      Number.isFinite(d.lat)&&
      Number.isFinite(d.lon)
  ).length;

  document.getElementById('count').textContent=
    arr.length+'/'+deliveries.length;

  document.getElementById('statusText').textContent=
    arr.length+
    ' pendentes. '+
    (
      coords<arr.length
        ?(arr.length-coords)+' ainda sem ponto no mapa.'
        :'Todos os pontos localizados.'
    );

  el.innerHTML=
    arr.map(d=>

      '<div class="card">'+

        '<div class="row">'+

          '<div class="title">'+
            esc(d.label)+
          '</div>'+

          '<div class="dist">'+
            (
              d.dist!=null
                ?distText(d.dist)
                :'📍 A localizar'
            )+
          '</div>'+

        '</div>'+

        '<div class="addr">'+
          esc(d.address)+
        '</div>'+

        '<div class="card-actions">'+

          '<button class="go" onclick="openDelivery('+d.id+')">'+
            'Ver no mapa'+
          '</button>'+

          '<button class="nav" onclick="navigateTo('+d.id+')">'+
            '🧭 Ir'+
          '</button>'+

        '</div>'+

      '</div>'

    ).join('') ||

    '<div class="notice">Nenhuma visita pendente.</div>';

}

function render(){

  renderMarkers();

  renderList();

}


/* ============================
   GPS
   ============================ */

function applyGPS(pos,center){

  const lat=Number(
    pos.coords.latitude
  );

  const lon=Number(
    pos.coords.longitude
  );

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon) ||
    Math.abs(lat)>90 ||
    Math.abs(lon)>180
  ){
    return;
  }

  userPos={
    lat,
    lon,
    accuracy:
      Number(pos.coords.accuracy)||0
  };

  if(userMarker)
    map.removeLayer(userMarker);

  if(accuracyCircle)
    map.removeLayer(accuracyCircle);

  const i=L.divIcon({
    className:'',
    html:'<div class="user-dot"></div>',
    iconSize:[22,22],
    iconAnchor:[11,11]
  });

  userMarker=
    L.marker(
      [lat,lon],
      {
        icon:i,
        zIndexOffset:1000
      }
    )
    .addTo(map)
    .bindPopup(
      '📍 Você está aqui<br>'+
      'Precisão aproximada: '+
      Math.round(userPos.accuracy)+
      ' metros'
    );

  accuracyCircle=
    L.circle(
      [lat,lon],
      {
        radius:userPos.accuracy,
        weight:1,
        fillOpacity:.08
      }
    ).addTo(map);

  if(center)
    map.setView(
      [lat,lon],
      15
    );

  renderList();

}

function locate(){

  if(!navigator.geolocation){

    alert(
      'GPS não disponível neste navegador.'
    );

    return;
  }

  navigator.geolocation.getCurrentPosition(
    p=>applyGPS(p,true),
    e=>
      alert(
        'Não foi possível obter sua localização. Código: '+
        e.code
      ),
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );

}


/* ============================
   ENTREGA
   ============================ */

function openDelivery(id){

  const d=deliveries.find(
    x=>x.id===id
  );

  if(!d)return;

  selectedId=id;

  document.getElementById(
    'mtitle'
  ).textContent=d.label;

  document.getElementById(
    'maddr'
  ).textContent=d.address;

  document.getElementById(
    'mdist'
  ).textContent=

    userPos &&
    Number.isFinite(d.lat) &&
    Number.isFinite(d.lon)

      ?

      '📏 '+
      distText(
        distanceKm(
          userPos.lat,
          userPos.lon,
          d.lat,
          d.lon
        )
      )+
      ' de você'

      :

      (
        !Number.isFinite(d.lat)
          ?'📍 Coordenadas ainda não localizadas'
          :''
      );

  document.getElementById(
    'modal'
  ).style.display='flex';

  if(
    Number.isFinite(d.lat)&&
    Number.isFinite(d.lon)
  ){

    map.setView(
      [d.lat,d.lon],
      16
    );

    const m=markers.get(id);

    if(m)
      m.openPopup();

  }

}

function closeModal(){

  document.getElementById(
    'modal'
  ).style.display='none';

  selectedId=null;

}

function setStatus(status){

  if(!selectedId)return;

  const d=deliveries.find(
    x=>x.id===selectedId
  );

  if(!d)return;

  d.status=status;

  d.updatedAt=
    new Date().toISOString();

  save();

  closeModal();

  render();

}

function navigateTo(id){

  const d=deliveries.find(
    x=>x.id===id
  );

  if(!d)return;

  const dest=
    Number.isFinite(d.lat)&&
    Number.isFinite(d.lon)

      ?

      d.lat+','+d.lon

      :

      encodeURIComponent(
        d.address
      );

  window.open(
    'https://www.google.com/maps/dir/?api=1&destination='+
    dest,
    '_blank'
  );

}


/* ==================================================
   NOVA BUSCA INTELIGENTE
   ================================================== */

/*
   Cria várias versões do endereço.

   A busca original continua sendo a primeira.

   Se ela falhar, somente então tentamos
   versões mais flexíveis.
*/

function gerarVariacoesEndereco(endereco){

  let base=String(endereco)
    .replace(/,\s*Brasil\s*$/i,'')
    .trim();

  let variantes=[];

  function add(v){

    v=String(v)
      .replace(/\s+/g,' ')
      .replace(/,\s*,/g,',')
      .trim();

    if(!v)return;

    const chave=norm(v);

    if(
      !variantes.some(
        x=>norm(x)===chave
      )
    ){
      variantes.push(v);
    }

  }


  /*
    1. Endereço original
  */

  add(base);


  /*
    2. Expande abreviações de rua
  */

  let v=base;

  v=v
    .replace(/^R\.\s*/i,'Rua ')
    .replace(/^R\s+/i,'Rua ')
    .replace(/^TV\.\s*/i,'Travessa ')
    .replace(/^TV\s+/i,'Travessa ');

  add(v);


  /*
    3. Corrige Nossa Senhora
  */

  v=v
    .replace(/\bN\s+Sra\.?\b/gi,'Nossa Senhora')
    .replace(/\bN\.?\s*Sra\.?\b/gi,'Nossa Senhora')
    .replace(/\bNossa\s+Sra\.?\b/gi,'Nossa Senhora')
    .replace(/\bNOSSA\s+SRA\s+DAS\s+GRACAS\b/gi,'Nossa Senhora das Gracas');

  add(v);


  /*
    4. Expande abreviações de bairro
  */

  v=v
    .replace(/\bSra\.?\b/gi,'Senhora')
    .replace(/\bS\.\s*/gi,'São ');

  add(v);


  /*
    5. Remove o bairro.

    Isso ajuda quando o mapa reconhece a rua
    e o número, mas não reconhece o bairro.
  */

  const partes=v.split(',');

  if(partes.length>=2){

    const ruaNumero=
      partes
        .slice(0,2)
        .join(',')
        .trim();

    add(
      ruaNumero+
      ', Caxias do Sul, RS, Brasil'
    );

  }


  /*
    6. Somente rua + número + cidade.

    Outra tentativa mais ampla.
  */

  const numeroMatch=
    v.match(/,\s*(\d+)\s*,/);

  if(numeroMatch){

    const numero=numeroMatch[1];

    const antesNumero=
      v.substring(
        0,
        numeroMatch.index
      ).trim();

    const rua=
      antesNumero
        .replace(/,\s*$/,'')
        .trim();

    add(
      rua+
      ', '+
      numero+
      ', Caxias do Sul, RS, Brasil'
    );

  }


  return variantes;

}


/*
   Faz uma consulta ao Nominatim.
*/

async function consultarNominatim(query){

  const url=
    'https://nominatim.openstreetmap.org/search?'+
    'format=jsonv2'+
    '&limit=5'+
    '&countrycodes=br'+
    '&accept-language=pt-BR'+
    '&addressdetails=1'+
    '&viewbox=-51.35,-29.05,-51.05,-29.30'+
    '&bounded=0'+
    '&q='+
    encodeURIComponent(query);

  const r=await fetch(
    url,
    {
      headers:{
        Accept:'application/json'
      }
    }
  );

  if(!r.ok)
    throw Error(
      'HTTP '+r.status
    );

  return await r.json();

}


/*
   Verifica se o resultado pertence realmente
   à região de Caxias do Sul.

   Isso evita que uma busca mais flexível
   jogue o cliente para outra cidade.
*/

function candidatoAceitavel(x){

  const p={
    lat:parseFloat(x.lat),
    lon:parseFloat(x.lon)
  };

  if(!validCoords(p))
    return false;

  const addr=x.address||{};

  const texto=norm(
    [
      addr.city,
      addr.town,
      addr.municipality,
      addr.county,
      x.display_name
    ]
    .filter(Boolean)
    .join(' ')
  );

  /*
     Caxias do Sul precisa aparecer
     na identificação do resultado.
  */

  if(
    !texto.includes('caxias do sul')
  ){
    return false;
  }

  return true;

}


/*
   Nova geocodificação.

   IMPORTANTE:
   A função só é chamada para clientes
   que ainda não possuem coordenadas.
*/

async function geocodeOne(d){

  const key=norm(d.address);


  /*
     1. Verifica o cache existente.
  */

  if(geocache[key]){

    const p={
      lat:Number(
        geocache[key].lat
      ),
      lon:Number(
        geocache[key].lon
      )
    };

    if(validCoords(p)){

      d.lat=p.lat;
      d.lon=p.lon;

      return true;

    }

    delete geocache[key];

  }


  /*
     2. PRIMEIRA TENTATIVA
        exatamente como antes.
  */

  const consultas=[];

  consultas.push(
    d.address+
    ', Caxias do Sul, RS, Brasil'
  );


  /*
     3. SEGUNDA ETAPA:
        variações inteligentes.
  */

  const variacoes=
    gerarVariacoesEndereco(
      d.address
    );

  variacoes.forEach(v=>{

    const completo=
      v
        .replace(
          /,\s*Caxias do Sul,\s*RS,\s*Brasil/gi,
          ''
        )
        .trim()+
      ', Caxias do Sul, RS, Brasil';

    consultas.push(completo);

  });


  /*
     Remove consultas duplicadas.
  */

  const consultasUnicas=[];

  consultas.forEach(q=>{

    const chave=norm(q);

    if(
      !consultasUnicas.some(
        x=>norm(x)===chave
      )
    ){

      consultasUnicas.push(q);

    }

  });


  /*
     Executa as tentativas na ordem.

     Se encontrar um resultado confiável,
     para imediatamente.
  */

  for(
    let tentativa=0;
    tentativa<consultasUnicas.length;
    tentativa++
  ){

    const q=consultasUnicas[tentativa];

    try{

      const data=
        await consultarNominatim(q);

      for(
        const x of data
      ){

        if(
          !candidatoAceitavel(x)
        ){
          continue;
        }

        const p={
          lat:parseFloat(x.lat),
          lon:parseFloat(x.lon)
        };

        if(!validCoords(p))
          continue;


        /*
           Encontrou.

           Salva no cliente.
        */

        d.lat=p.lat;
        d.lon=p.lon;


        /*
           Salva no cache usando
           o endereço original como chave.
        */

        geocache[key]={
          lat:p.lat,
          lon:p.lon
        };

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(geocache)
        );

        return true;

      }

    }catch(e){

      /*
         Se uma consulta falhar,
         tenta a próxima.
      */

    }


    /*
       Pequena pausa entre tentativas
       para não sobrecarregar o serviço.
    */

    await new Promise(
      r=>setTimeout(r,700)
    );

  }


  /*
     Nenhuma tentativa conseguiu.
  */

  return false;

}


/* ==================================================
   LOCALIZAR TODOS OS PONTOS PENDENTES
   ================================================== */

async function geocodeAll(){

  const btn=
    document.getElementById(
      'geocodeBtn'
    );

  btn.disabled=true;


  /*
     IMPORTANTE:

     Só entra aqui quem ainda NÃO possui
     coordenadas.

     Quem já foi localizado fica intacto.
  */

  const pending=
    deliveries.filter(
      d=>
        d.status==='PENDENTE' &&
        (
          !Number.isFinite(d.lat) ||
          !Number.isFinite(d.lon)
        )
    );


  let ok=0;

  let fail=0;


  if(!pending.length){

    document.getElementById(
      'statusText'
    ).textContent=
      'Todos os pontos já estão localizados.';

    btn.disabled=false;

    return;

  }


  for(
    let i=0;
    i<pending.length;
    i++
  ){

    const d=pending[i];


    document.getElementById(
      'statusText'
    ).textContent=
      '🔎 Localizando '+
      (i+1)+
      ' de '+
      pending.length+
      ': '+
      d.address;


    document.getElementById(
      'bar'
    ).style.width=
      (
        i/pending.length*100
      )+
      '%';


    try{

      if(
        await geocodeOne(d)
      ){

        ok++;

      }else{

        fail++;

      }

    }catch(e){

      fail++;

    }


    save();

    render();


    /*
       Pausa entre clientes.
    */

    await new Promise(
      r=>setTimeout(r,1100)
    );

  }


  document.getElementById(
    'bar'
  ).style.width='100%';


  document.getElementById(
    'statusText'
  ).textContent=
    'Concluído: '+
    ok+
    ' localizados, '+
    fail+
    ' não localizados.';


  btn.disabled=false;

  render();


  /*
     Ajusta o mapa para os pontos encontrados.
  */

  const pts=
    deliveries.filter(
      d=>
        d.status==='PENDENTE' &&
        Number.isFinite(d.lat) &&
        Number.isFinite(d.lon)
    );


  if(pts.length){

    const b=
      L.latLngBounds(
        pts.map(
          d=>[d.lat,d.lon]
        )
      );

    if(userPos){

      b.extend([
        userPos.lat,
        userPos.lon
      ]);

    }

    map.fitBounds(
      b,
      {
        padding:[25,25],
        maxZoom:15
      }
    );

  }

}


/* ============================
   EXPORTAÇÃO
   ============================ */

function exportCSV(){

  const rows=[
    [
      'ID',
      'Entrega',
      'Endereco',
      'Status',
      'Atualizado',
      'Latitude',
      'Longitude'
    ]
  ];

  deliveries.forEach(d=>

    rows.push([
      d.id,
      d.label,
      d.address,
      d.status,
      d.updatedAt||'',
      d.lat??'',
      d.lon??''
    ])

  );

  const csv=
    '\ufeff'+
    rows
      .map(
        r=>
          r
            .map(
              v=>
                '"'+
                String(v)
                  .replace(/"/g,'""')+
                '"'
            )
            .join(';')
      )
      .join('\n');


  const a=
    document.createElement('a');

  a.href=
    URL.createObjectURL(
      new Blob(
        [csv],
        {
          type:
            'text/csv;charset=utf-8'
        }
      )
    );

  a.download=
    'entregas_historico.csv';

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(a.href),
    1000
  );

}
