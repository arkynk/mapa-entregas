<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Mapa de Entregas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3V6r1mQ0nL7m0eN9M2rY8rYxK8Zs="
    crossorigin=""
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #eef1f5;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      background: #101827;
      color: white;
      padding: 12px 14px 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-area {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 25px;
      line-height: 1.05;
      font-weight: 800;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: #c8d0dd;
    }

    .counter {
      flex-shrink: 0;
      min-width: 74px;
      height: 58px;
      border-radius: 17px;
      background: #2864e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 800;
    }

    /* =========================
       BOTÕES
    ========================= */

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .toolbar button {
      border: 0;
      border-radius: 13px;
      min-height: 48px;
      padding: 7px 5px;
      font-size: 14px;
      font-weight: 800;
      color: white;
      cursor: pointer;
    }

    .btn-localizar {
      background: #2864e8;
    }

    .btn-gps {
      background: #079c6c;
    }

    .btn-falhas {
      background: #f08a00;
    }

    .btn-exportar {
      background: #526174;
    }

    .toolbar button:disabled {
      opacity: 0.55;
    }

    /* =========================
       ÁREA DO MAPA
    ========================= */

    .map-wrapper {
      position: relative;
      background: #dce1e8;
    }

    #map {
      width: 100%;
      height: 330px;
      transition: height 0.25s ease;
    }

    .map-wrapper.expanded #map {
      height: calc(100vh - 40px);
    }

    .map-toggle {
      position: absolute;
      z-index: 1000;
      top: 12px;
      right: 12px;

      border: 0;
      border-radius: 14px;
      background: white;
      color: #172033;

      padding: 12px 15px;
      font-size: 15px;
      font-weight: 800;

      box-shadow: 0 3px 12px rgba(0,0,0,0.22);
    }

    /* =========================
       PROGRESSO
    ========================= */

    .progress-section {
      background: white;
      padding: 12px 14px;
      border-bottom: 1px solid #d7dce4;
    }

    #geocodeStatus {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    #geocodeDetail {
      font-size: 13px;
      color: #697386;
      min-height: 18px;
      margin-bottom: 7px;
    }

    .progress-bg {
      width: 100%;
      height: 9px;
      border-radius: 20px;
      background: #e3e7ee;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #2864e8;
      transition: width 0.2s ease;
    }

    /* =========================
       LISTA
    ========================= */

    .list-header {
      background: white;
      padding: 14px;
      border-bottom: 1px solid #d7dce4;
    }

    .list-header h2 {
      margin: 0;
      font-size: 20px;
    }

    #nearbyList {
      padding: 10px;
    }

    .delivery-card {
      background: white;
      border-radius: 15px;
      margin-bottom: 10px;
      padding: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 5px solid #2864e8;
    }

    .delivery-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .delivery-title {
      font-size: 18px;
      font-weight: 800;
    }

    .distance {
      color: #2864e8;
      font-weight: 800;
      white-space: nowrap;
      text-align: right;
    }

    .address {
      margin-top: 8px;
      color: #4d5869;
      font-size: 14px;
      line-height: 1.4;
    }

    .corrected-address {
      margin-top: 6px;
      color: #07865e;
      font-size: 13px;
      font-weight: 700;
    }

    .card-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px;
    }

    .card-buttons button {
      border: 0;
      border-radius: 11px;
      padding: 11px 8px;
      font-size: 14px;
      font-weight: 800;
      color: white;
    }

    .navigate-btn {
      background: #2864e8;
    }

    .status-btn {
      background: #687384;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      color: #687384;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,0.55);
      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-box h3 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .modal-address {
      color: #687384;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .status-options {
      display: grid;
      gap: 8px;
    }

    .status-options button {
      border: 0;
      border-radius: 12px;
      padding: 14px;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    .status-carta {
      background: #079c6c;
    }

    .status-nao {
      background: #f08a00;
    }

    .status-risco {
      background: #d9363e;
    }

    .status-pendente {
      background: #2864e8;
    }

    .close-modal {
      margin-top: 10px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #e5e8ed;
      font-weight: 800;
      font-size: 15px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      header {
        padding: 10px 12px 9px;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        font-size: 12px;
      }

      .counter {
        min-width: 67px;
        height: 52px;
        font-size: 19px;
      }

      .toolbar {
        gap: 6px;
        margin-top: 8px;
      }

      .toolbar button {
        min-height: 45px;
        font-size: 13px;
        border-radius: 11px;
      }

      #map {
        height: 310px;
      }

      .map-wrapper.expanded #map {
        height: calc(100vh - 30px);
      }

      .map-toggle {
        padding: 10px 12px;
        font-size: 14px;
      }

    }

  </style>

</head>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="

</script>


<script src="./clientes.js?v=20261006"></script>


<script>

  /* ============================================================
     CLIENTES
  ============================================================ */

  const CLIENTES_CARREGADOS =
    typeof CLIENTES !== "undefined" &&
    Array.isArray(CLIENTES)
      ? CLIENTES
      : [];


  /* ============================================================
     CONFIGURAÇÕES
  ============================================================ */

  const STORAGE_KEY =
    "mapa_entregas_clientes_v5";

  const OLD_STORAGE_KEYS = [
    "mapa_entregas_clientes_v4",
    "mapa_entregas_clientes_v3",
    "mapa_entregas_clientes_v2"
  ];

  const CACHE_KEY =
    "mapa_entregas_geocache_v5";

  const DEFAULT_CENTER = [
    -29.1678,
    -51.1794
  ];


  /* ============================================================
     VARIÁVEIS
  ============================================================ */

  let deliveries = [];

  let geocache = {};

  let userPosition = null;

  let userMarker = null;

  let userAccuracyCircle = null;

  let currentModalId = null;

  let markerById = {};

  let mapExpanded = false;

  let lastNominatimRequest = 0;

  let gpsRequestInProgress = false;


  /* ============================================================
     ELEMENTOS
  ============================================================ */

  const counter =
    document.getElementById("counter");

  const geocodeBtn =
    document.getElementById("geocodeBtn");

  const retryBtn =
    document.getElementById("retryBtn");

  const gpsBtn =
    document.getElementById("gpsBtn");

  const exportBtn =
    document.getElementById("exportBtn");

  const geocodeStatus =
    document.getElementById("geocodeStatus");

  const geocodeDetail =
    document.getElementById("geocodeDetail");

  const progressBar =
    document.getElementById("progressBar");

  const listTitle =
    document.getElementById("listTitle");

  const nearbyList =
    document.getElementById("nearbyList");

  const modal =
    document.getElementById("modal");

  const modalTitle =
    document.getElementById("modalTitle");

  const modalAddress =
    document.getElementById("modalAddress");

  const closeModal =
    document.getElementById("closeModal");

  const mapWrapper =
    document.getElementById("mapWrapper");

  const mapToggle =
    document.getElementById("mapToggle");


  /* ============================================================
     MAPA
  ============================================================ */

  const map =
    L.map("map", {
      zoomControl: true
    }).setView(
      DEFAULT_CENTER,
      12
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  const markerLayer =
    L.layerGroup().addTo(map);


  /* ============================================================
     FUNÇÕES BÁSICAS
  ============================================================ */

  function wait(ms) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }


  function normalizeText(value) {

    return String(value || "")
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]+/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
    Verifica se uma coordenada
    individual é matematicamente válida.
  */

  function validCoordinates(
    lat,
    lon
  ) {

    const latitude =
      Number(lat);

    const longitude =
      Number(lon);


    return (
      Number.isFinite(latitude) &&
      Number.isFinite(longitude) &&
      latitude >= -90 &&
      latitude <= 90 &&
      longitude >= -180 &&
      longitude <= 180
    );

  }


  /*
    ============================================================
    CORREÇÃO DE LATITUDE/LONGITUDE INVERTIDAS

    Um erro muito comum em arquivos de clientes é:

      lat = -51.x
      lon = -29.x

    quando o correto seria:

      lat = -29.x
      lon = -51.x

    Para a região do RS isso é facilmente identificado.
  */

  function normalizeCoordinatePair(
    lat,
    lon
  ) {

    const latitude =
      Number(lat);

    const longitude =
      Number(lon);


    if (
      !validCoordinates(
        latitude,
        longitude
      )
    ) {

      return null;

    }


    /*
      Coordenadas invertidas típicas
      do Rio Grande do Sul/Brasil.
    */

    const looksSwapped =
      Math.abs(latitude) > 40 &&
      Math.abs(longitude) < 40;


    if (looksSwapped) {

      const swappedLat =
        longitude;

      const swappedLon =
        latitude;


      if (
        validCoordinates(
          swappedLat,
          swappedLon
        )
      ) {

        return {
          lat: swappedLat,
          lon: swappedLon,
          corrected: true
        };

      }

    }


    return {
      lat: latitude,
      lon: longitude,
      corrected: false
    };

  }


  /*
    ============================================================
    DISTÂNCIA HAVERSINE
  ============================================================
  */

  function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const aLat =
      Number(lat1);

    const aLon =
      Number(lon1);

    const bLat =
      Number(lat2);

    const bLon =
      Number(lon2);


    if (
      !validCoordinates(
        aLat,
        aLon
      ) ||
      !validCoordinates(
        bLat,
        bLon
      )
    ) {

      return Infinity;

    }


    const R = 6371;


    const dLat =
      (
        bLat -
        aLat
      ) *
      Math.PI /
      180;


    const dLon =
      (
        bLon -
        aLon
      ) *
      Math.PI /
      180;


    const lat1Rad =
      aLat *
      Math.PI /
      180;


    const lat2Rad =
      bLat *
      Math.PI /
      180;


    const a =
      Math.sin(
        dLat / 2
      ) ** 2 +
      Math.cos(
        lat1Rad
      ) *
      Math.cos(
        lat2Rad
      ) *
      Math.sin(
        dLon / 2
      ) ** 2;


    return (
      R *
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(
          1 - a
        )
      )
    );

  }


  /* ============================================================
     ENDEREÇO
  ============================================================ */

  function getAddress(
    cliente
  ) {

    if (
      cliente.address
    ) {

      return cliente.address;

    }


    if (
      cliente.endereco
    ) {

      return cliente.endereco;

    }


    const parts = [];


    if (
      cliente.rua
    ) {

      parts.push(
        cliente.rua
      );

    }


    if (
      cliente.numero
    ) {

      parts.push(
        cliente.numero
      );

    }


    if (
      cliente.bairro
    ) {

      parts.push(
        cliente.bairro
      );

    }


    if (
      cliente.cidade
    ) {

      parts.push(
        cliente.cidade
      );

    }


    if (
      cliente.uf
    ) {

      parts.push(
        cliente.uf
      );

    }


    return parts.join(
      ", "
    );

  }


  function getAddressParts(
    cliente
  ) {

    const address =
      getAddress(
        cliente
      );


    const raw =
      address
        .split(",")
        .map(
          x => x.trim()
        )
        .filter(
          Boolean
        );


    let rua =
      cliente.rua ||
      raw[0] ||
      "";


    let numero =
      cliente.numero ||
      "";


    let bairro =
      cliente.bairro ||
      "";


    if (
      !numero &&
      raw[1]
    ) {

      const match =
        raw[1].match(
          /\d+[A-Za-z]?/
        );


      if (match) {

        numero =
          match[0];

      }

    }


    if (
      !bairro &&
      raw[2]
    ) {

      bairro =
        raw[2];

    }


    return {
      rua,
      numero:
        String(numero),
      bairro
    };

  }


  /* ============================================================
     STORAGE
  ============================================================ */

  function readJson(
    key
  ) {

    try {

      const raw =
        localStorage.getItem(
          key
        );


      if (!raw) {

        return null;

      }


      return JSON.parse(
        raw
      );

    } catch (e) {

      return null;

    }

  }


  function saveData() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          deliveries
        )
      );

    } catch (e) {

      console.warn(
        "Não foi possível salvar:",
        e
      );

    }

  }


  function saveCache() {

    try {

      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(
          geocache
        )
      );

    } catch (e) {

      console.warn(
        "Não foi possível salvar cache:",
        e
      );

    }

  }


  /* ============================================================
     CARREGAR CLIENTES
  ============================================================ */

  function loadData() {

    let saved =
      readJson(
        STORAGE_KEY
      );


    /*
      Migração das versões antigas.
    */

    if (
      !Array.isArray(saved)
    ) {

      for (
        const oldKey of
        OLD_STORAGE_KEYS
      ) {

        const oldData =
          readJson(
            oldKey
          );


        if (
          Array.isArray(
            oldData
          )
        ) {

          saved =
            oldData;

          break;

        }

      }

    }


    const savedById = {};


    if (
      Array.isArray(
        saved
      )
    ) {

      saved.forEach(
        item => {

          if (
            item &&
            item.id !== undefined
          ) {

            savedById[
              String(
                item.id
              )
            ] = item;

          }

        }
      );

    }


    deliveries =
      CLIENTES_CARREGADOS.map(
        cliente => {

          const id =
            cliente.id;


          const old =
            savedById[
              String(id)
            ] || {};


          const address =
            getAddress(
              cliente
            );


          /*
            Primeiro tentamos
            coordenadas do clientes.js.
          */

          let coordinates =
            normalizeCoordinatePair(
              cliente.lat,
              cliente.lon
            );


          /*
            Se não houver coordenadas
            válidas, usamos as antigas.
          */

          if (
            !coordinates
          ) {

            coordinates =
              normalizeCoordinatePair(
                old.lat,
                old.lon
              );

          }


          const item = {

            ...old,

            id,

            label:
              cliente.label ||
              old.label ||
              "Entrega " +
              id,

            address,

            endereco:
              cliente.endereco ||
              old.endereco ||
              address,

            status:
              old.status ||
              cliente.status ||
              "PENDENTE",

            lat:
              coordinates
                ? coordinates.lat
                : null,

            lon:
              coordinates
                ? coordinates.lon
                : null,

            updatedAt:
              old.updatedAt ||
              null,

            correctedNeighborhood:
              old.correctedNeighborhood ||
              "",

            geocodeDisplayName:
              old.geocodeDisplayName ||
              "",

            geocodeSource:
              old.geocodeSource ||
              "",

            geocodeError:
              old.geocodeError ||
              "",

            actions:
              Array.isArray(
                old.actions
              )
                ? old.actions
                : []

          };


          /*
            Se detectamos coordenadas
            invertidas, marcamos a origem.
          */

          if (
            coordinates &&
            coordinates.corrected
          ) {

            item.geocodeSource =
              "coordenadas corrigidas";

          }


          return item;

        }
      );


    geocache =
      readJson(
        CACHE_KEY
      ) || {};


    /*
      Recupera coordenadas do cache.
    */

    deliveries.forEach(
      d => {

        if (
          !validCoordinates(
            d.lat,
            d.lon
          )
        ) {

          const key =
            normalizeText(
              d.address
            );


          const cached =
            geocache[key];


          if (
            cached
          ) {

            const normalized =
              normalizeCoordinatePair(
                cached.lat,
                cached.lon
              );


            if (
              normalized
            ) {

              d.lat =
                normalized.lat;

              d.lon =
                normalized.lon;

              d.correctedNeighborhood =
                cached.correctedNeighborhood ||
                "";

              d.geocodeDisplayName =
                cached.displayName ||
                "";

              d.geocodeSource =
                normalized.corrected
                  ? "cache corrigido"
                  : (
                      cached.source ||
                      "cache"
                    );

            }

          }

        }

      }
    );


    saveData();

    renderAll();

  }

  function renderAll() {

    renderSummary();

    renderMarkers();

    const pending =

      ).length;

        "Todas as entregas foram concluídas.";

        "Nenhuma entrega pendente.";

        "100%";

  /* ============================================================
     LISTA
  ============================================================ */

  function renderNearby() {

    nearbyList.innerHTML = "";


    const pending =
      deliveries.filter(
        d =>
          d.status ===
          "PENDENTE"
      );


    if (
      pending.length === 0
    ) {

      nearbyList.innerHTML = `
        <div class="empty">
          Todas as entregas pendentes
          foram concluídas.
        </div>
      `;

      return;

    }


    /*
      SEM GPS:
      não inventamos uma distância.
    */

    if (
      !userPosition
    ) {

      pending.forEach(
        d => {

          createDeliveryCard(
            d,
            null
          );

        }
      );


      return;

    }


    /*
      COM GPS:
      calcula distância real.
    */

    const sorted =
      pending
        .map(
          d => ({

            delivery:
              d,

            distance:
              distanceKm(
                userPosition.lat,
                userPosition.lon,
                Number(d.lat),
                Number(d.lon)
              )

          })
        )
        .sort(
          (a, b) =>
            a.distance -
            b.distance
        );


    sorted.forEach(
      item => {

        createDeliveryCard(
          item.delivery,
          item.distance
        );

      }
    );

  }


  function createDeliveryCard(
    d,
    distance
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "delivery-card";


    let distanceText;


    if (
      distance === null
    ) {

      distanceText =
        "📍 GPS";


    } else if (
      !Number.isFinite(
        distance
      )
    ) {

      distanceText =
        "Sem localização";


    } else if (
      distance < 1
    ) {

      distanceText =
        `${Math.round(
          distance * 1000
        )} m`;


    } else {

      distanceText =
        `${distance.toFixed(
          1
        )} km`;

    }


    const corrected =
      d.correctedNeighborhood
        ? `
          <div class="corrected-address">
            📍 Bairro localizado:
            ${escapeHtml(
              d.correctedNeighborhood
            )}
          </div>
        `
        : "";


    card.innerHTML = `

      <div class="delivery-top">

        <div class="delivery-title">
          Entrega ${escapeHtml(d.id)}
        </div>

        <div class="distance">
          ${distanceText}
        </div>

      </div>

      <div class="address">
        ${escapeHtml(d.address)}
      </div>

      ${corrected}

      <div class="card-buttons">

        <button
          class="navigate-btn">
          🧭 Navegar
        </button>

        <button
          class="status-btn">
          📋 Status
        </button>

      </div>

    `;


    card
      .querySelector(
        ".navigate-btn"
      )
      .addEventListener(
        "click",
        () => {

          navigateTo(d);

        }
      );


    card
      .querySelector(
        ".status-btn"
      )
      .addEventListener(
        "click",
        () => {

          openStatus(
            d.id
          );

        }
      );


    nearbyList.appendChild(
      card
    );

  }

      );

    );

  /* ============================================================
     GPS
  ============================================================ */

  function showUserPosition(
    latitude,
    longitude,
    accuracy
  ) {

    const coordinates =
      normalizeCoordinatePair(
        latitude,
        longitude
      );


    if (
      !coordinates
    ) {

      throw new Error(
        "GPS retornou coordenadas inválidas."
      );

    }


    userPosition = {

      lat:
        coordinates.lat,

      lon:
        coordinates.lon,

      accuracy:
        Number(accuracy) || 0

    };


    /*
      Remove marcador anterior.
    */

    if (
      userMarker
    ) {

      map.removeLayer(
        userMarker
      );

    }


    if (
      userAccuracyCircle
    ) {

      map.removeLayer(
        userAccuracyCircle
      );

    }


    /*
      Círculo de precisão.
    */

    if (
      userPosition.accuracy > 0
    ) {

      userAccuracyCircle =
        L.circle(
          [
            userPosition.lat,
            userPosition.lon
          ],
          {
            radius:
              userPosition.accuracy,

            color:
              "#2864e8",

            weight:
              1,

            fillColor:
              "#2864e8",

            fillOpacity:
              0.10
          }
        )
        .addTo(map);

    }


    /*
      Marcador principal.
    */

    userMarker =
      L.circleMarker(
        [
          userPosition.lat,
          userPosition.lon
        ],
        {
          radius: 11,
          color: "#ffffff",
          weight: 4,
          fillColor: "#2864e8",
          fillOpacity: 1
        }
      )
      .addTo(map);


    userMarker.bindPopup(
      `
        <b>📍 Você está aqui</b><br>
        Precisão aproximada:
        ${Math.round(
          userPosition.accuracy
        )} metros
      `
    );


    userMarker.openPopup();


    /*
      Centraliza o mapa exatamente
      na localização do celular.
    */

    map.setView(
      [
        userPosition.lat,
        userPosition.lon
      ],
      16
    );


    geocodeStatus.textContent =
      "📍 GPS localizado com sucesso.";


    geocodeDetail.textContent =
      `Precisão aproximada: ${Math.round(
        userPosition.accuracy
      )} metros. Lista ordenada pela sua localização atual.`;


    renderNearby();

  }


  function requestGPS(
    automatic = false
  ) {

    if (
      gpsRequestInProgress
    ) {

      return;

    }


    if (
      !navigator.geolocation
    ) {

      geocodeStatus.textContent =
        "⚠️ GPS não disponível.";

      geocodeDetail.textContent =
        "Seu navegador não disponibilizou a localização.";

      if (
        !automatic
      ) {

        alert(
          "Seu navegador não oferece localização GPS."
        );

      }

      return;

    }


    gpsRequestInProgress =
      true;


    gpsBtn.disabled =
      true;


    gpsBtn.textContent =
      "📍 Obtendo...";


    if (
      automatic
    ) {

      geocodeStatus.textContent =
        "📍 Obtendo sua localização...";

      geocodeDetail.textContent =
        "Aguardando o GPS do celular.";

    }


    navigator.geolocation.getCurrentPosition(

      position => {

        try {

          showUserPosition(
            position.coords.latitude,
            position.coords.longitude,
            position.coords.accuracy
          );

        } catch (error) {

          userPosition =
            null;


          geocodeStatus.textContent =
            "⚠️ GPS retornou uma localização inválida.";

          geocodeDetail.textContent =
            "Toque novamente em 📍 GPS.";

        }


        gpsRequestInProgress =
          false;


        gpsBtn.disabled =
          false;


        gpsBtn.textContent =
          "📍 GPS";

      },


      error => {

        gpsRequestInProgress =
          false;


        gpsBtn.disabled =
          false;


        gpsBtn.textContent =
          "📍 GPS";


        userPosition =
          null;


        renderNearby();


        let message =
          "Não foi possível obter sua localização.";


        if (
          error.code ===
          1
        ) {

          message =
            "Permissão de localização negada. Ative a localização do navegador para usar o GPS.";

        } else if (
          error.code ===
          2
        ) {

          message =
            "O celular não conseguiu determinar sua localização.";

        } else if (
          error.code ===
          3
        ) {

          message =
            "O GPS demorou demais para responder. Tente novamente.";

        }


        geocodeStatus.textContent =
          "⚠️ GPS não localizado.";

        geocodeDetail.textContent =
          message;


        if (
          !automatic
        ) {

          alert(
            message
          );

        }

      },

      {
        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:
          0
      }

    );

  }

  /* ============================================================
     NOMINATIM
  ============================================================ */

  async function waitNominatimGap() {

    const now =
      Date.now();


    const elapsed =
      now -
      lastNominatimRequest;


    const minimumGap =
      1200;


    if (
      elapsed <
      minimumGap
    ) {

      await wait(
        minimumGap -
        elapsed
      );

    }

  }


  async function fetchNominatim(
    query
  ) {

    await waitNominatimGap();


    lastNominatimRequest =
      Date.now();


    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => {

          controller.abort();

        },
        9000
      );


    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&limit=8" +
      "&countrycodes=br" +
      "&accept-language=pt-BR" +
      "&q=" +
      encodeURIComponent(
        query
      );


    try {

      const response =
        await fetch(
          url,
          {
            signal:
              controller.signal,

            headers: {
              Accept:
                "application/json"
            }
          }
        );


      if (
        response.status ===
        429
      ) {

        await wait(
          4000
        );


        throw new Error(
          "Limite do serviço de localização atingido."
        );

      }


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return await response.json();

    } finally {

      clearTimeout(
        timeout
      );

    }

  }


  /* ============================================================
     COMPARAÇÃO DE RESULTADOS
  ============================================================ */

  function tokenOverlap(
    a,
    b
  ) {

    const A =
      new Set(
        normalizeText(a)
          .split(" ")
          .filter(
            x =>
              x.length > 1
          )
      );


    const B =
      new Set(
        normalizeText(b)
          .split(" ")
          .filter(
            x =>
              x.length > 1
          )
      );


    if (
      A.size === 0
    ) {

      return 0;

    }


    let matches =
      0;


    A.forEach(
      token => {

        if (
          B.has(
            token
          )
        ) {

          matches++;

        }

      }
    );


    return (
      matches /
      A.size
    );

  }


  function resultCityOK(
    result
  ) {

    const a =
      result.address ||
      {};


    const city =
      normalizeText(
        a.city ||
        a.town ||
        a.municipality ||
        a.village ||
        ""
      );


    const state =
      normalizeText(
        a.state ||
        ""
      );


    const display =
      normalizeText(
        result.display_name ||
        ""
      );


    const cityOK =
      city.includes(
        "caxias do sul"
      ) ||
      display.includes(
        "caxias do sul"
      );


    const stateOK =
      state === "" ||
      state.includes(
        "rio grande do sul"
      ) ||
      state === "rs" ||
      display.includes(
        "rio grande do sul"
      );


    return (
      cityOK &&
      stateOK
    );

  }


  function getResultNeighborhood(
    result
  ) {

    const a =
      result.address ||
      {};


    return (
      a.neighbourhood ||
      a.suburb ||
      a.quarter ||
      a.residential ||
      a.city_district ||
      ""
    );

  }


  function chooseBestResult(
    results,
    parts
  ) {

    if (
      !Array.isArray(
        results
      )
    ) {

      return null;

    }


    const valid =
      results.filter(
        result =>
          resultCityOK(
            result
          )
      );


    if (
      valid.length === 0
    ) {

      return null;

    }


    const scored =
      valid.map(
        result => {

          const a =
            result.address ||
            {};


          const road =
            a.road ||
            a.pedestrian ||
            a.residential ||
            "";


          const houseNumber =
            String(
              a.house_number ||
              ""
            );


          const inputNumber =
            String(
              parts.numero ||
              ""
            ).replace(
              /\D/g,
              ""
            );


          const resultNumber =
            houseNumber.replace(
              /\D/g,
              ""
            );


          let score =
            0;


          const roadScore =
            tokenOverlap(
              parts.rua,
              road ||
              result.display_name
            );


          const neighborhood =
            getResultNeighborhood(
              result
            );


          const neighborhoodScore =
            tokenOverlap(
              parts.bairro,
              neighborhood ||
              result.display_name
            );


          if (
            roadScore > 0
          ) {

            score +=
              roadScore *
              40;

          }


          if (
            inputNumber &&
            resultNumber &&
            inputNumber ===
              resultNumber
          ) {

            score +=
              55;

          }


          if (
            neighborhoodScore > 0
          ) {

            score +=
              neighborhoodScore *
              45;

          }


          if (
            result.type ===
            "house"
          ) {

            score +=
              15;

          }


          if (
            result.type ===
            "building"
          ) {

            score +=
              10;

          }


          score +=
            100;


          return {

            result,

            score,

            neighborhoodScore,

            roadScore

          };

        }
      );


    scored.sort(
      (a, b) =>
        b.score -
        a.score
    );


    return scored[0];

  }


  /* ============================================================
     GEOCODIFICAÇÃO
  ============================================================ */

  async function geocodeOne(
    delivery,
    detailCallback
  ) {

    const cacheKey =
      normalizeText(
        delivery.address
      );


    /*
      1. CACHE
    */

    if (
      geocache[
        cacheKey
      ] &&
      validCoordinates(
        geocache[
          cacheKey
        ].lat,
        geocache[
          cacheKey
        ].lon
      )
    ) {

      const cached =
        geocache[
          cacheKey
        ];


      const normalized =
        normalizeCoordinatePair(
          cached.lat,
          cached.lon
        );


      if (
        normalized
      ) {

        delivery.lat =
          normalized.lat;

        delivery.lon =
          normalized.lon;

        delivery.correctedNeighborhood =
          cached.correctedNeighborhood ||
          "";

        delivery.geocodeDisplayName =
          cached.displayName ||
          "";

        delivery.geocodeSource =
          normalized.corrected
            ? "cache corrigido"
            : (
                cached.source ||
                "cache"
              );


        return true;

      }

    }


    const parts =
      getAddressParts(
        delivery
      );


    const queries = [];


    /*
      TENTATIVA 1
    */

    if (
      parts.rua &&
      parts.numero
    ) {

      queries.push({

        label:
          "Rua + número",

        query:
          `${parts.rua}, ${parts.numero}, Caxias do Sul, RS, Brasil`

      });

    }


    /*
      TENTATIVA 2
    */

    if (
      parts.rua &&
      parts.numero &&
      parts.bairro
    ) {

      queries.push({

        label:
          "Rua + número + bairro",

        query:
          `${parts.rua}, ${parts.numero}, ${parts.bairro}, Caxias do Sul, RS, Brasil`

      });

    }


    /*
      TENTATIVA 3
    */

    queries.push({

      label:
        "Endereço original",

      query:
        `${delivery.address}, Caxias do Sul, RS, Brasil`

    });


    let firstResult =
      null;


    for (
      let i = 0;
      i < queries.length;
      i++
    ) {

      const attempt =
        queries[i];


      if (
        detailCallback
      ) {

        detailCallback(
          `${attempt.label}: ${attempt.query}`
        );

      }


      try {

        const results =
          await fetchNominatim(
            attempt.query
          );


        const best =
          chooseBestResult(
            results,
            parts
          );


        if (
          best
        ) {

          if (
            !firstResult
          ) {

            firstResult = {

              ...best,

              label:
                attempt.label

            };

          }


          if (
            attempt.label ===
              "Rua + número + bairro"
          ) {

            if (
              best.neighborhoodScore >=
              0.4
            ) {

              return applyGeocode(
                delivery,
                best.result,
                attempt.label
              );

            }

          } else if (
            !parts.bairro &&
            attempt.label ===
              "Rua + número"
          ) {

            return applyGeocode(
              delivery,
              best.result,
              attempt.label
            );

          }

        }

      } catch (
        error
      ) {

        console.warn(
          "Falha ao localizar:",
          attempt.query,
          error
        );

      }

    }


    if (
      firstResult
    ) {

      return applyGeocode(
        delivery,
        firstResult.result,
        firstResult.label
      );

    }


    delivery.geocodeError =
      "Nenhuma localização encontrada.";


    return false;

  }


  function applyGeocode(
    delivery,
    result,
    source
  ) {

    const normalized =
      normalizeCoordinatePair(
        result.lat,
        result.lon
      );


    if (
      !normalized
    ) {

      return false;

    }


    const neighborhood =
      getResultNeighborhood(
        result
      );


    delivery.lat =
      normalized.lat;

    delivery.lon =
      normalized.lon;

    delivery.correctedNeighborhood =
      neighborhood ||
      "";

    delivery.geocodeDisplayName =
      result.display_name ||
      "";

    delivery.geocodeSource =
      source;

    delivery.geocodeError =
      "";


    geocache[
      normalizeText(
        delivery.address
      )
    ] = {

      lat:
        normalized.lat,

      lon:
        normalized.lon,

      correctedNeighborhood:
        neighborhood ||
        "",

      displayName:
        result.display_name ||
        "",

      source,

      savedAt:
        new Date().toISOString()

    };


    saveCache();


    return true;

  }


  /* ============================================================
     LOCALIZAR TODOS
  ============================================================ */

  async function geocodeAll(
    retryOnly = false
  ) {

    if (
      CLIENTES_CARREGADOS.length ===
      0
    ) {

      alert(
        "Nenhum cliente foi carregado.\n\nVerifique se o arquivo clientes.js está no mesmo repositório."
      );

      return;

    }


    const pending =
      deliveries.filter(
        d =>
          d.status ===
          "PENDENTE" &&
          !validCoordinates(
            d.lat,
            d.lon
          )
      );


    if (
      pending.length === 0
    ) {

      geocodeStatus.textContent =
        "Todos os clientes pendentes já possuem localização.";

      geocodeDetail.textContent =
        "Nenhuma nova localização necessária.";

      progressBar.style.width =
        "100%";

      renderAll();

      return;

    }


    geocodeBtn.disabled =
      true;

    retryBtn.disabled =
      true;

    gpsBtn.disabled =
      true;


    let success =
      0;

    let failed =
      0;


    progressBar.style.width =
      "0%";


    try {

      for (
        let i = 0;
        i < pending.length;
        i++
      ) {

        const d =
          pending[i];


        geocodeStatus.textContent =
          `Localizando ${i + 1} de ${pending.length}`;


        geocodeDetail.textContent =
          d.address;


        const ok =
          await geocodeOne(
            d,
            detail => {

              geocodeDetail.textContent =
                detail;

            }
          );


        if (
          ok
        ) {

          success++;

        } else {

          failed++;

        }


        const percent =
          (
            (i + 1) /
            pending.length
          ) *
          100;


        progressBar.style.width =
          percent +
          "%";


        saveData();

        renderAll();


        await wait(
          200
        );

      }


      geocodeStatus.textContent =
        `Concluído: ${success} localizados, ${failed} não localizados.`;


      geocodeDetail.textContent =
        failed > 0
          ? "Os que falharam podem ser tentados novamente pelo botão 🔄 Falhas."
          : "Todos os clientes foram localizados.";

    } finally {

      geocodeBtn.disabled =
        false;

      retryBtn.disabled =
        false;

      gpsBtn.disabled =
        false;

    }

  }


  /* ============================================================
     BOTÕES
  ============================================================ */

  geocodeBtn.addEventListener(
    "click",
    () => {

      geocodeAll(
        false
      );

    }
  );


  retryBtn.addEventListener(
    "click",
    () => {

      geocodeAll(
        true
      );

    }
  );


  /* ============================================================
     STATUS
  ============================================================ */

  function openStatus(
    id
  ) {

    const delivery =
      deliveries.find(
        d =>
          String(d.id) ===
          String(id)
      );


    if (
      !delivery
    ) {

      return;

    }


    currentModalId =
      delivery.id;


    modalTitle.textContent =
      `Entrega ${delivery.id}`;


    modalAddress.textContent =
      delivery.address;


    modal.classList.add(
      "show"
    );

  }


  window.openStatus =
    openStatus;


  closeModal.addEventListener(
    "click",
    () => {

      modal.classList.remove(
        "show"
      );

      currentModalId =
        null;

    }
  );


  modal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        modal
      ) {

        modal.classList.remove(
          "show"
        );

        currentModalId =
          null;

      }

    }
  );


  document
    .querySelectorAll(
      ".status-options button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (
              currentModalId ===
              null
            ) {

              return;

            }


            const delivery =
              deliveries.find(
                d =>
                  String(d.id) ===
                  String(
                    currentModalId
                  )
              );


            if (
              !delivery
            ) {

              return;

            }


            const newStatus =
              button.dataset.status;


            delivery.status =
              newStatus;


            delivery.updatedAt =
              new Date().toISOString();


            if (
              !Array.isArray(
                delivery.actions
              )
            ) {

              delivery.actions =
                [];

            }


            delivery.actions.push({

              status:
                newStatus,

              timestamp:
                new Date().toISOString(),

              address:
                delivery.address,

              lat:
                validCoordinates(
                  delivery.lat,
                  delivery.lon
                )
                  ? Number(
                      delivery.lat
                    )
                  : null,

              lon:
                validCoordinates(
                  delivery.lat,
                  delivery.lon
                )
                  ? Number(
                      delivery.lon
                    )
                  : null

            });


            saveData();

            renderAll();


            modal.classList.remove(
              "show"
            );


            currentModalId =
              null;

          }
        );

      }
    );


  /* ============================================================
     EXPORTAR
  ============================================================ */

  function csvEscape(
    value
  ) {

    const text =
      String(
        value === null ||
        value === undefined
          ? ""
          : value
      );


    return '"' +
      text
        .replace(
          /"/g,
          '""'
        ) +
      '"';

  }


  function exportCSV() {

    const headers = [

      "ID",

      "Endereco",

      "Status",

      "Atualizado_em",

      "Latitude",

      "Longitude",

      "Bairro_corrigido",

      "Endereco_localizado",

      "Fonte_localizacao"

    ];


    const rows =
      deliveries.map(
        d => [

          d.id,

          d.address,

          d.status,

          d.updatedAt ||
            "",

          validCoordinates(
            d.lat,
            d.lon
          )
            ? d.lat
            : "",

          validCoordinates(
            d.lat,
            d.lon
          )
            ? d.lon
            : "",

          d.correctedNeighborhood ||
            "",

          d.geocodeDisplayName ||
            "",

          d.geocodeSource ||
            ""

        ]
      );


    let csv =
      headers
        .map(
          csvEscape
        )
        .join(";") +
      "\n";


    rows.forEach(
      row => {

        csv +=
          row
            .map(
              csvEscape
            )
            .join(";") +
          "\n";

      }
    );


    const blob =
      new Blob(
        [
          "\ufeff" +
          csv
        ],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;


    a.download =
      "clientes_corrigidos.csv";


    document.body.appendChild(
      a
    );


    a.click();

    a.remove();


    URL.revokeObjectURL(
      url
    );

  }


  exportBtn.addEventListener(
    "click",
    exportCSV
  );


  /* ============================================================
     INICIALIZAÇÃO
  ============================================================ */

  if (
    CLIENTES_CARREGADOS.length ===
    0
  ) {

    geocodeStatus.textContent =
      "⚠️ Nenhum cliente carregado.";

    geocodeDetail.textContent =
      "O arquivo clientes.js não foi carregado ou não contém CLIENTES.";

    progressBar.style.width =
      "0%";

  } else {

    geocodeStatus.textContent =
      "📍 Obtendo sua localização...";

    geocodeDetail.textContent =
      `${CLIENTES_CARREGADOS.length} clientes carregados.`;

  }


  loadData();


  /*
    Corrige tamanho do mapa.
  */

  setTimeout(
    () => {

      map.invalidateSize();

    },
    400
  );


  window.addEventListener(
    "resize",
    () => {

      setTimeout(
        () => {

          map.invalidateSize();

        },
        100
      );

    }
  );


  /*
    ============================================================
    GPS AUTOMÁTICO

    Tenta pegar a posição do celular assim
    que o aplicativo termina de carregar.

    Se o navegador pedir permissão,
    permita a localização.
    ============================================================
  */

  setTimeout(
    () => {

      requestGPS(
        true
      );

    },
    800
  );


  /* ============================================================
     SERVICE WORKER
  ============================================================ */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker
      .register(
        "./sw.js"
      )
      .catch(
        () => {}
      );

  }

</script>

</body>
  </html>
