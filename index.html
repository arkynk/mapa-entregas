<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Mapa de Entregas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3mZ0Yw0q5s4n7F8x0K5w5F5F5F5F5="
    crossorigin=""
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f3f6;
      color: #172033;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* =========================
       CABEÇALHO
       ========================= */

    header {
      background: #111827;
      color: white;
      padding: 14px 18px 12px;
      position: relative;
      z-index: 1000;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 5px;
      color: #d5d9e2;
      font-size: 15px;
    }

    .counter {
      min-width: 72px;
      height: 58px;
      border-radius: 18px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* =========================
       BOTÕES
       ========================= */

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-top: 13px;
    }

    .toolbar button {
      border: 0;
      border-radius: 13px;
      min-height: 56px;
      padding: 8px 10px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: none;
    }

    #geocodeBtn {
      background: #2563eb;
    }

    #gpsBtn {
      background: #059669;
    }

    #retryBtn {
      background: #ea8a00;
    }

    #exportBtn {
      background: #4b5563;
    }

    .toolbar button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* =========================
       ÁREA DO MAPA
       ========================= */

    .map-section {
      position: relative;
      width: 100%;
      background: #d1d5db;
      z-index: 1;
    }

    #map {
      width: 100%;
      height: 390px;
      background: #d1d5db;
      position: relative;
      z-index: 1;
    }

    /*
      MAPA EXPANDIDO:
      fica fixo somente enquanto expandido.
      Não altera a posição do restante da página.
    */

    .map-section.expanded {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 5000;
      background: #d1d5db;
    }

    .map-section.expanded #map {
      width: 100%;
      height: 100dvh;
    }

    .map-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2000;
      border: 0;
      border-radius: 14px;
      background: white;
      color: #172033;
      padding: 14px 17px;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }

    .map-section.expanded .map-toggle {
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
    }

    /* =========================
       PROGRESSO
       ========================= */

    .progress-section {
      background: white;
      padding: 13px 18px 14px;
      border-bottom: 1px solid #d8dce3;
    }

    .progress-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .progress-track {
      width: 100%;
      height: 11px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      border-radius: 20px;
      transition: width 0.25s ease;
    }

    #geocodeStatus {
      margin-top: 8px;
      font-size: 16px;
      color: #4b5563;
    }

    #geocodeDetail {
      margin-top: 4px;
      font-size: 14px;
      color: #6b7280;
    }

    /* =========================
       LISTA
       ========================= */

    .list-section {
      background: #f1f3f6;
      padding-bottom: 40px;
    }

    .list-title {
      background: white;
      padding: 17px 18px;
      border-bottom: 1px solid #d8dce3;
      font-size: 22px;
      font-weight: bold;
    }

    #nearbyList {
      padding: 10px;
    }

    .delivery-card {
      background: white;
      border-radius: 16px;
      margin-bottom: 10px;
      padding: 14px;
      border-left: 6px solid #2563eb;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .delivery-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .delivery-title {
      font-size: 21px;
      font-weight: bold;
    }

    .delivery-distance {
      color: #2563eb;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .delivery-address {
      margin-top: 9px;
      color: #4b5563;
      font-size: 17px;
      line-height: 1.35;
    }

    .corrected-neighborhood {
      margin-top: 7px;
      color: #059669;
      font-size: 14px;
      font-weight: bold;
    }

    .delivery-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }

    .delivery-buttons button {
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .navigate-btn {
      background: #2563eb;
    }

    .status-btn {
      background: #6b7280;
    }

    .empty {
      background: white;
      padding: 25px 18px;
      color: #6b7280;
      text-align: center;
      font-size: 17px;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 9000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      max-height: 90dvh;
      overflow-y: auto;
    }

    .modal h2 {
      margin: 0 0 7px;
      font-size: 23px;
    }

    .modal-address {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.35;
      margin-bottom: 15px;
    }

    .status-options {
      display: grid;
      gap: 9px;
    }

    .status-options button {
      min-height: 54px;
      border: 0;
      border-radius: 13px;
      font-size: 17px;
      font-weight: bold;
      color: white;
    }

    .status-carta {
      background: #059669;
    }

    .status-nao {
      background: #ea8a00;
    }

    .status-risco {
      background: #dc2626;
    }

    .modal-close {
      background: #6b7280;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px;
      margin: 8px 0 13px;
      font-size: 16px;
      resize: vertical;
    }

    /* =========================
       LEAFLET
       ========================= */

    .leaflet-control-zoom a {
      font-size: 25px !important;
      width: 48px !important;
      height: 48px !important;
      line-height: 48px !important;
    }

    .leaflet-popup-content {
      font-size: 15px;
      line-height: 1.4;
    }

    .popup-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      padding: 10px;
      margin-top: 8px;
      font-weight: bold;
    }

    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 700px) {
      header {
        padding: 12px 14px 10px;
      }

      .title-area h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 14px;
      }

      .counter {
        min-width: 66px;
        height: 54px;
        font-size: 20px;
      }

      .toolbar {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar button {
        min-height: 54px;
        font-size: 16px;
      }

      /*
        MAPA REDUZIDO NO CELULAR
        para deixar espaço para a lista.
      */
      #map {
        height: 330px;
      }

      .list-title {
        font-size: 20px;
      }
    }

    @media (max-width: 420px) {
      #map {
        height: 300px;
      }

      .toolbar {
        gap: 7px;
      }

      .toolbar button {
        font-size: 15px;
        min-height: 51px;
      }

      .delivery-title {
        font-size: 19px;
      }

      .delivery-address {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header id="mainHeader">
    <div class="header-top">
      <div class="title-area">
        <h1>📦 Mapa de Entregas</h1>
        <div class="subtitle">Localização inteligente dos clientes</div>
      </div>

      <div class="counter" id="counter">
        0/0
      </div>
    </div>

    <div class="toolbar">

      <button id="geocodeBtn">
        🗺️ Localizar
      </button>

      <button id="gpsBtn">
        📍 GPS
      </button>

      <button id="retryBtn">
        🔄 Falhas
      </button>

      <button id="exportBtn">
        📤 Exportar
      </button>

    </div>
  </header>


  <!-- MAPA -->

  <section class="map-section" id="mapSection">

    <div id="map"></div>

    <button
      class="map-toggle"
      id="mapToggle"
      type="button"
    >
      ⛶ Expandir mapa
    </button>

  </section>


  <!-- PROGRESSO -->

  <section class="progress-section">

    <div
      class="progress-title"
      id="progressTitle"
    >
      Preparando...
    </div>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <div id="geocodeStatus">
      Inicializando...
    </div>

    <div id="geocodeDetail"></div>

  </section>


  <!-- LISTA -->

  <section class="list-section">

    <div class="list-title" id="listTitle">
      📍 Entregas pendentes — 0 clientes
    </div>

    <div id="nearbyList"></div>

  </section>


  <!-- MODAL STATUS -->

  <div
    class="modal-backdrop"
    id="modalBackdrop"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Entrega
      </h2>

      <div
        class="modal-address"
        id="modalAddress"
      ></div>

      <label>
        Observação:
      </label>

      <textarea
        id="observationInput"
        placeholder="Digite uma observação..."
      ></textarea>

      <div class="status-options">

        <button
          class="status-carta"
          data-status="CARTA"
        >
          📄 Carta
        </button>

        <button
          class="status-nao"
          data-status="NAO_LOCALIZADO"
        >
          ❌ Não localizado
        </button>

        <button
          class="status-risco"
          data-status="ZONA_RISCO"
        >
          ⚠️ Zona de risco
        </button>

        <button
          class="modal-close"
          id="modalClose"
        >
          Fechar
        </button>

      </div>

    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="./clientes.js?v=20261006"></script>


  <script>
    /* =========================================================
       CONFIGURAÇÃO
       ========================================================= */

    const STORAGE_KEY = "mapa_entregas_clientes_v5";
    const CACHE_KEY = "mapa_entregas_geocache_v5";

    const DEFAULT_CENTER = [
      -29.1678,
      -51.1794
    ];

    const NOMINATIM_DELAY = 1200;
    const NOMINATIM_TIMEOUT = 9000;


    /* =========================================================
       DADOS
       ========================================================= */

    const CLIENTES_ORIGINAIS =
      Array.isArray(window.CLIENTES)
        ? window.CLIENTES
        : [];

    const INITIAL_DATA =
      CLIENTES_ORIGINAIS.map(cliente => ({

        id: cliente.id,

        label:
          cliente.nome ||
          ("Entrega " + cliente.id),

        address:
          cliente.endereco ||
          cliente.address ||
          "",

        status:
          cliente.status ||
          "PENDENTE",

        lat:
          Number.isFinite(Number(cliente.lat))
            ? Number(cliente.lat)
            : null,

        lon:
          Number.isFinite(Number(cliente.lon))
            ? Number(cliente.lon)
            : null,

        updatedAt:
          cliente.updatedAt ||
          null,

        correctedNeighborhood:
          cliente.correctedNeighborhood ||
          "",

        geocodeDisplayName:
          cliente.geocodeDisplayName ||
          "",

        geocodeSource:
          cliente.geocodeSource ||
          "",

        geocodeError:
          cliente.geocodeError ||
          "",

        actions:
          Array.isArray(cliente.actions)
            ? cliente.actions
            : []

      }));


    let deliveries = [];

    let geocache = {};

    let map = null;

    let markerLayer = null;

    let markerById = {};

    let userMarker = null;

    let userPosition = null;

    let currentModalId = null;

    let lastNominatimRequest = 0;


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const geocodeBtn =
      document.getElementById("geocodeBtn");

    const gpsBtn =
      document.getElementById("gpsBtn");

    const retryBtn =
      document.getElementById("retryBtn");

    const exportBtn =
      document.getElementById("exportBtn");

    const mapSection =
      document.getElementById("mapSection");

    const mapToggle =
      document.getElementById("mapToggle");

    const progressTitle =
      document.getElementById("progressTitle");

    const progressBar =
      document.getElementById("progressBar");

    const geocodeStatus =
      document.getElementById("geocodeStatus");

    const geocodeDetail =
      document.getElementById("geocodeDetail");

    const counter =
      document.getElementById("counter");

    const listTitle =
      document.getElementById("listTitle");

    const nearbyList =
      document.getElementById("nearbyList");

    const modalBackdrop =
      document.getElementById("modalBackdrop");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalAddress =
      document.getElementById("modalAddress");

    const observationInput =
      document.getElementById("observationInput");


    /* =========================================================
       UTILIDADES
       ========================================================= */

    function sleep(ms) {
      return new Promise(resolve => {
        setTimeout(resolve, ms);
      });
    }


    function safeJSONParse(value, fallback) {

      try {

        return JSON.parse(value);

      } catch {

        return fallback;

      }

    }


    function normalizeText(value) {

      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    }


    function escapeHTML(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function addressKey(address) {

      return normalizeText(address);

    }


    function validCoordinates(lat, lon) {

      return (
        Number.isFinite(Number(lat)) &&
        Number.isFinite(Number(lon)) &&
        Math.abs(Number(lat)) <= 90 &&
        Math.abs(Number(lon)) <= 180
      );

    }


    function distanceKm(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371;

      const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

      const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      return (
        R *
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        )
      );

    }


    function formatDistance(km) {

      if (!Number.isFinite(km)) {
        return "";
      }

      if (km < 1) {
        return Math.round(km * 1000) + " m";
      }

      return km.toFixed(1) + " km";

    }


    /* =========================================================
       CARREGAMENTO / SALVAMENTO
       ========================================================= */

    function loadStorage() {

      const savedV5 =
        safeJSONParse(
          localStorage.getItem(STORAGE_KEY),
          null
        );

      const savedV4 =
        safeJSONParse(
          localStorage.getItem(
            "mapa_entregas_clientes_v4"
          ),
          null
        );

      const savedV3 =
        safeJSONParse(
          localStorage.getItem(
            "mapa_entregas_clientes_v3"
          ),
          null
        );

      const savedV2 =
        safeJSONParse(
          localStorage.getItem(
            "mapa_entregas_clientes_v2"
          ),
          null
        );

      const saved =
        Array.isArray(savedV5)
          ? savedV5
          : Array.isArray(savedV4)
            ? savedV4
            : Array.isArray(savedV3)
              ? savedV3
              : Array.isArray(savedV2)
                ? savedV2
                : [];

      const byId = new Map();

      saved.forEach(item => {

        if (item && item.id != null) {

          byId.set(
            String(item.id),
            item
          );

        }

      });


      deliveries =
        INITIAL_DATA.map(base => {

          const old =
            byId.get(
              String(base.id)
            );

          if (!old) {
            return {
              ...base
            };
          }

          return {

            ...base,

            status:
              old.status ||
              base.status,

            lat:
              validCoordinates(
                old.lat,
                old.lon
              )
                ? Number(old.lat)
                : base.lat,

            lon:
              validCoordinates(
                old.lat,
                old.lon
              )
                ? Number(old.lon)
                : base.lon,

            updatedAt:
              old.updatedAt ||
              null,

            correctedNeighborhood:
              old.correctedNeighborhood ||
              "",

            geocodeDisplayName:
              old.geocodeDisplayName ||
              "",

            geocodeSource:
              old.geocodeSource ||
              "",

            geocodeError:
              old.geocodeError ||
              "",

            actions:
              Array.isArray(old.actions)
                ? old.actions
                : []

          };

        });


      geocache =
        safeJSONParse(
          localStorage.getItem(CACHE_KEY),
          {}
        );

      if (
        !geocache ||
        typeof geocache !== "object"
      ) {
        geocache = {};
      }


      saveData();

    }


    function saveData() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(deliveries)
        );

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(geocache)
        );

      } catch (error) {

        console.warn(
          "Não foi possível salvar os dados:",
          error
        );

      }

    }


    /* =========================================================
       MAPA
       ========================================================= */

    function initializeMap() {

      map =
        L.map("map", {
          zoomControl: true,
          preferCanvas: true
        }).setView(
          DEFAULT_CENTER,
          12
        );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }
      ).addTo(map);


      markerLayer =
        L.layerGroup().addTo(map);


      setTimeout(() => {

        map.invalidateSize();

      }, 300);

    }


    /* =========================================================
       MARCADORES
       ========================================================= */

    function markerColor(status) {

      switch (status) {

        case "CARTA":
          return "#059669";

        case "NAO_LOCALIZADO":
          return "#ea8a00";

        case "ZONA_RISCO":
          return "#dc2626";

        default:
          return "#2563eb";

      }

    }


    function statusLabel(status) {

      switch (status) {

        case "CARTA":
          return "Carta";

        case "NAO_LOCALIZADO":
          return "Não localizado";

        case "ZONA_RISCO":
          return "Zona de risco";

        default:
          return "Pendente";

      }

    }


    function renderMarkers() {

      if (!map || !markerLayer) {
        return;
      }


      markerLayer.clearLayers();

      markerById = {};


      deliveries.forEach(delivery => {

        if (
          !validCoordinates(
            delivery.lat,
            delivery.lon
          )
        ) {
          return;
        }


        const marker =
          L.circleMarker(
            [
              Number(delivery.lat),
              Number(delivery.lon)
            ],
            {
              radius: 9,
              color: "#ffffff",
              weight: 3,
              fillColor:
                markerColor(
                  delivery.status
                ),
              fillOpacity: 1
            }
          );


        const corrected =
          delivery.correctedNeighborhood
            ? `
              <div style="
                margin-top:6px;
                color:#059669;
                font-weight:bold;
              ">
                Bairro encontrado:
                ${escapeHTML(
                  delivery.correctedNeighborhood
                )}
              </div>
            `
            : "";


        const popupHTML = `

          <div>

            <strong>
              ${escapeHTML(
                delivery.label
              )}
            </strong>

            <br>

            ${escapeHTML(
              delivery.address
            )}

            ${corrected}

            <br>

            <strong>
              Status:
            </strong>
            ${statusLabel(
              delivery.status
            )}

            <button
              class="popup-button"
              onclick="openDeliveryStatus(${delivery.id})"
            >
              📋 Alterar status
            </button>

          </div>

        `;


        marker.bindPopup(
          popupHTML
        );


        marker.addTo(
          markerLayer
        );


        markerById[
          delivery.id
        ] = marker;

      });

    }


    /* =========================================================
       RESUMO
       ========================================================= */

    function renderSummary() {

      const total =
        deliveries.length;

      const located =
        deliveries.filter(d =>
          validCoordinates(
            d.lat,
            d.lon
          )
        ).length;

      const pending =
        deliveries.filter(
          d =>
            d.status === "PENDENTE"
        ).length;


      counter.textContent =
        located + "/" + total;


      listTitle.textContent =
        "📍 Entregas pendentes — " +
        pending +
        " clientes";

    }

    function renderNearbyList() {

      const pending =
        deliveries.filter(
          d =>
            d.status === "PENDENTE"
        );


      if (!pending.length) {

        nearbyList.innerHTML = `
          <div class="empty">
            Nenhuma entrega pendente.
          </div>
        `;

        return;

      }


      const origin =
        userPosition
          ? userPosition
          : {
              lat: DEFAULT_CENTER[0],
              lon: DEFAULT_CENTER[1]
            };


      const items =
        pending
          .map(delivery => {

            let distance = Infinity;

            if (
              validCoordinates(
                delivery.lat,
                delivery.lon
              )
            ) {

              distance =
                distanceKm(
                  origin.lat,
                  origin.lon,
                  Number(delivery.lat),
                  Number(delivery.lon)
                );

            }


            return {
              delivery,
              distance
            };

          })
          .sort(
            (a, b) =>
              a.distance - b.distance
          );


      nearbyList.innerHTML = "";


      items.forEach(item => {

        const delivery =
          item.delivery;


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "delivery-card";


        const distanceText =
          Number.isFinite(
            item.distance
          )
            ? formatDistance(
                item.distance
              )
            : "Sem localização";


        const corrected =
          delivery.correctedNeighborhood
            ? `
              <div class="corrected-neighborhood">
                📍 Bairro encontrado:
                ${escapeHTML(
                  delivery.correctedNeighborhood
                )}
              </div>
            `
            : "";


        card.innerHTML = `

          <div class="delivery-header">

            <div class="delivery-title">
              ${escapeHTML(
                delivery.label
              )}
            </div>

            <div class="delivery-distance">
              ${distanceText}
            </div>

          </div>


          <div class="delivery-address">
            ${escapeHTML(
              delivery.address
            )}
          </div>

          ${corrected}


          <div class="delivery-buttons">

            <button
              class="navigate-btn"
              data-action="navigate"
            >
              🧭 Navegar
            </button>

            <button
              class="status-btn"
              data-action="status"
            >
              📋 Status
            </button>

          </div>

        `;


        const navigate =
          card.querySelector(
            '[data-action="navigate"]'
          );

        const status =
          card.querySelector(
            '[data-action="status"]'
          );


        navigate.addEventListener(
          "click",
          () => {

            navigateTo(
              delivery
            );

          }
        );


        status.addEventListener(
          "click",
          () => {

            openDeliveryStatus(
              delivery.id
            );

          }
        );


        nearbyList.appendChild(
          card
        );

      });

    }

          delivery.lon

      ) {

        alert(

    function locateUser() {

      if (
        !navigator.geolocation
      ) {

        alert(
          "Seu navegador não suporta GPS."
        );

        return;

      }


      gpsBtn.disabled = true;

      gpsBtn.textContent =
        "📍 Localizando...";


      navigator.geolocation.getCurrentPosition(

        position => {

          userPosition = {

            lat:
              position.coords.latitude,

            lon:
              position.coords.longitude

          };


          if (userMarker) {

            userMarker.remove();

          }


          userMarker =
            L.circleMarker(
              [
                userPosition.lat,
                userPosition.lon
              ],
              {
                radius: 10,
                color: "#ffffff",
                weight: 3,
                fillColor: "#2563eb",
                fillOpacity: 1
              }
            )
              .addTo(map)
              .bindPopup(
                "📍 Você está aqui"
              );


          map.setView(
            [
              userPosition.lat,
              userPosition.lon
            ],
            14
          );


          renderNearbyList();


          geocodeStatus.textContent =
            "Localização atualizada.";

          geocodeDetail.textContent =
            "A lista agora está ordenada pela distância até você.";


          gpsBtn.disabled = false;

          gpsBtn.textContent =
            "📍 GPS";

        },

        error => {

          console.error(error);

          alert(
            "Não foi possível obter sua localização. Verifique a permissão de localização do navegador."
          );


          gpsBtn.disabled = false;

          gpsBtn.textContent =
            "📍 GPS";

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        }

      );

    }

    async function fetchWithTimeout(
      url,
      timeout
    ) {

      const controller =
        new AbortController();

      const timer =
        setTimeout(
          () =>
            controller.abort(),
          timeout
        );


      try {

        const response =
          await fetch(
            url,
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              signal:
                controller.signal
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        return await response.json();

      } finally {

        clearTimeout(
          timer
        );

      }

    }


    async function respectNominatimDelay() {

      const now =
        Date.now();

      const elapsed =
        now -
        lastNominatimRequest;


      if (
        elapsed <
        NOMINATIM_DELAY
      ) {

        await sleep(
          NOMINATIM_DELAY -
          elapsed
        );

      }


      lastNominatimRequest =
        Date.now();

    }


    function parseAddress(
      address
    ) {

      const parts =
        String(address || "")
          .split(",")
          .map(
            part =>
              part.trim()
          )
          .filter(Boolean);


      let rua =
        parts[0] || "";


      let numero =
        "";


      if (
        parts[1]
      ) {

        const match =
          parts[1].match(
            /\d+[A-Za-z]?/
          );

        if (match) {
          numero =
            match[0];
        }

      }


      let bairro =
        parts[2] || "";


      return {
        rua,
        numero,
        bairro,
        cidade:
          "Caxias do Sul",
        uf:
          "RS"
      };

    }


    function getNeighborhood(
      address
    ) {

      if (!address) {
        return "";
      }


      return (
        address.neighbourhood ||
        address.suburb ||
        address.quarter ||
        address.residential ||
        address.city_district ||
        ""
      );

    }


    function overlapScore(
      input,
      result
    ) {

      const a =
        new Set(
          normalizeText(
            input
          )
            .split(" ")
            .filter(
              word =>
                word.length > 2
            )
        );


      const b =
        new Set(
          normalizeText(
            result
          )
            .split(" ")
            .filter(
              word =>
                word.length > 2
            )
        );


      if (
        !a.size ||
        !b.size
      ) {

        return 0;

      }


      let matches = 0;


      a.forEach(
        word => {

          if (
            b.has(word)
          ) {
            matches++;
          }

        }
      );


      return (
        matches /
        a.size
      );

    }


    function resultIsCaxias(
      result
    ) {

      const address =
        result.address ||
        {};


      const city =
        normalizeText(
          address.city ||
          address.town ||
          address.municipality ||
          address.village ||
          ""
        );


      const state =
        normalizeText(
          address.state ||
          ""
        );


      const display =
        normalizeText(
          result.display_name ||
          ""
        );


      const correctCity =
        city.includes(
          "caxias do sul"
        ) ||
        display.includes(
          "caxias do sul"
        );


      const correctState =
        !state ||
        state.includes(
          "rio grande do sul"
        ) ||
        state === "rs" ||
        display.includes(
          "rio grande do sul"
        );


      return (
        correctCity &&
        correctState
      );

    }


    function chooseBestResult(
      results,
      parts
    ) {

      if (
        !Array.isArray(results)
      ) {
        return null;
      }


      const candidates =
        results
          .filter(
            result =>
              resultIsCaxias(
                result
              )
          )
          .map(
            result => {

              const address =
                result.address ||
                {};


              let score = 0;


              score += 100;


              const resultRoad =
                address.road ||
                "";


              const roadScore =
                overlapScore(
                  parts.rua,
                  resultRoad ||
                  result.display_name ||
                  ""
                );


              score +=
                roadScore * 50;


              const resultNumber =
                String(
                  address.house_number ||
                  ""
                )
                  .replace(
                    /\D/g,
                    ""
                  );


              const inputNumber =
                String(
                  parts.numero ||
                  ""
                )
                  .replace(
                    /\D/g,
                    ""
                  );


              if (
                inputNumber &&
                resultNumber &&
                inputNumber === resultNumber
              ) {

                score += 70;

              }


              const neighborhood =
                getNeighborhood(
                  address
                );


              const neighborhoodScore =
                overlapScore(
                  parts.bairro,
                  neighborhood ||
                  result.display_name ||
                  ""
                );


              score +=
                neighborhoodScore * 60;


              if (
                result.type === "house" ||
                result.type === "building"
              ) {

                score += 15;

              }


              return {

                result,
                score,
                neighborhoodScore,
                roadScore

              };

            }
          )
          .sort(
            (a, b) =>
              b.score -
              a.score
          );


      return (
        candidates[0] ||
        null
      );

    }


    async function searchNominatim(
      query,
      parts
    ) {

      await respectNominatimDelay();


      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&addressdetails=1" +
        "&limit=8" +
        "&countrycodes=br" +
        "&accept-language=pt-BR" +
        "&q=" +
        encodeURIComponent(
          query
        );


      const results =
        await fetchWithTimeout(
          url,
          NOMINATIM_TIMEOUT
        );


      return chooseBestResult(
        results,
        parts
      );

    }


    async function geocodeOne(
      delivery,
      progressCallback
    ) {

      const fullKey =
        addressKey(
          delivery.address
        );


      /*
        PRIMEIRO:
        verifica cache.
      */

      if (
        geocache[fullKey] &&
        validCoordinates(
          geocache[fullKey].lat,
          geocache[fullKey].lon
        )
      ) {

        const cached =
          geocache[fullKey];


        delivery.lat =
          Number(
            cached.lat
          );

        delivery.lon =
          Number(
            cached.lon
          );


        delivery.correctedNeighborhood =
          cached.correctedNeighborhood ||
          delivery.correctedNeighborhood ||
          "";


        delivery.geocodeDisplayName =
          cached.displayName ||
          delivery.geocodeDisplayName ||
          "";


        delivery.geocodeSource =
          "cache";


        return {
          success: true,
          source: "cache"
        };

      }


      const parts =
        parseAddress(
          delivery.address
        );


      let firstResult =
        null;

      let secondResult =
        null;


      /*
        TENTATIVA 1
        Rua + número + cidade
      */

      if (
        parts.rua &&
        parts.numero
      ) {

        const query1 =
          `${parts.rua}, ${parts.numero}, Caxias do Sul, RS, Brasil`;


        progressCallback(
          "Rua + número"
        );


        try {

          firstResult =
            await searchNominatim(
              query1,
              parts
            );

        } catch (error) {

          console.warn(
            "Tentativa 1:",
            error
          );

        }

      }


      /*
        TENTATIVA 2
        Rua + número + bairro
      */

      if (
        parts.rua &&
        parts.numero &&
        parts.bairro
      ) {

        const query2 =
          `${parts.rua}, ${parts.numero}, ${parts.bairro}, Caxias do Sul, RS, Brasil`;


        progressCallback(
          "Rua + número + bairro"
        );


        try {

          secondResult =
            await searchNominatim(
              query2,
              parts
            );

        } catch (error) {

          console.warn(
            "Tentativa 2:",
            error
          );

        }

      }


      /*
        Escolha:
        se a segunda tentativa encontrou
        o bairro solicitado, ela ganha.
      */

      let chosen = null;

      if (
        secondResult &&
        (
          !firstResult ||
          secondResult.neighborhoodScore >= 0.45 ||
          secondResult.score >
            firstResult.score + 10
        )
      ) {

        chosen =
          secondResult;

      } else if (
        firstResult
      ) {

        chosen =
          firstResult;

      } else if (
        secondResult
      ) {

        chosen =
          secondResult;

      }


      /*
        TENTATIVA 3
        endereço original
      */

      if (!chosen) {

        progressCallback(
          "Endereço original"
        );


        try {

          const original =
            await searchNominatim(
              delivery.address,
              parts
            );


          if (original) {

            chosen =
              original;

          }

        } catch (error) {

          console.warn(
            "Tentativa 3:",
            error
          );

        }

      }


      if (!chosen) {

        delivery.geocodeError =
          "Endereço não localizado";


        return {
          success: false,
          error:
            "Não localizado"
        };

      }


      const result =
        chosen.result;


      const lat =
        parseFloat(
          result.lat
        );

      const lon =
        parseFloat(
          result.lon
        );


      if (
        !validCoordinates(
          lat,
          lon
        )
      ) {

        return {
          success: false,
          error:
            "Coordenadas inválidas"
        };

      }


      const correctedNeighborhood =
        getNeighborhood(
          result.address
        );


      delivery.lat =
        lat;

      delivery.lon =
        lon;


      delivery.correctedNeighborhood =
        correctedNeighborhood ||
        delivery.correctedNeighborhood ||
        "";


      delivery.geocodeDisplayName =
        result.display_name ||
        "";


      delivery.geocodeSource =
        "Nominatim";


      delivery.geocodeError =
        "";


      geocache[fullKey] = {

        lat,

        lon,

        correctedNeighborhood:
          delivery.correctedNeighborhood,

        displayName:
          delivery.geocodeDisplayName,

        savedAt:
          new Date().toISOString()

      };


      return {
        success: true,
        source: "Nominatim",
        neighborhood:
          delivery.correctedNeighborhood
      };

    }


    async function geocodeAll(
      onlyFailures = false
    ) {

      if (
        !deliveries.length
      ) {

        geocodeStatus.textContent =
          "Nenhum cliente carregado.";

        return;

      }


      const pending =
        deliveries.filter(
          delivery => {

            if (
              delivery.status !==
              "PENDENTE"
            ) {

              return false;

            }


            if (
              onlyFailures
            ) {

              return Boolean(
                delivery.geocodeError
              );

            }


            return !validCoordinates(
              delivery.lat,
              delivery.lon
            );

          }
        );


      if (!pending.length) {

        geocodeStatus.textContent =
          onlyFailures
            ? "Nenhuma falha pendente."
            : "Todas as entregas pendentes já possuem localização.";

        progressBar.style.width =
          "100%";

        progressTitle.textContent =
          "Pronto.";

        geocodeDetail.textContent =
          "Nenhuma nova localização necessária.";

        return;

      }


      geocodeBtn.disabled = true;

      retryBtn.disabled = true;


      let success = 0;

      let failed = 0;


      progressBar.style.width =
        "0%";


      progressTitle.textContent =
        "Localizando clientes...";


      try {

        for (
          let i = 0;
          i < pending.length;
          i++
        ) {

          const delivery =
            pending[i];


          const position =
            i + 1;


          progressTitle.textContent =
            `Localizando ${position} de ${pending.length}`;


          geocodeStatus.textContent =
            delivery.address;


          geocodeDetail.textContent =
            "Preparando busca...";


          try {

            const result =
              await geocodeOne(
                delivery,
                attempt => {

                  geocodeDetail.textContent =
                    "Tentando: " +
                    attempt;

                }
              );


            if (
              result.success
            ) {

              success++;

              geocodeStatus.textContent =
                "✓ Localizado: " +
                delivery.address;


              if (
                delivery.correctedNeighborhood
              ) {

                geocodeDetail.textContent =
                  "Bairro encontrado: " +
                  delivery.correctedNeighborhood;

              } else {

                geocodeDetail.textContent =
                  "Localização encontrada.";

              }

            } else {

              failed++;

              geocodeStatus.textContent =
                "✕ Não localizado: " +
                delivery.address;

              geocodeDetail.textContent =
                "Será possível tentar novamente.";

            }

          } catch (error) {

            console.error(
              "Erro ao localizar:",
              error
            );


            failed++;

            delivery.geocodeError =
              error.message ||
              "Erro desconhecido";


            geocodeStatus.textContent =
              "⚠️ Erro, passando para o próximo.";

            geocodeDetail.textContent =
              delivery.geocodeError;

          }


          const percent =
            (
              position /
              pending.length
            ) *
            100;


          progressBar.style.width =
            percent + "%";


          saveData();

          renderMarkers();

          renderSummary();

          renderNearbyList();


          /*
            Pequena pausa entre clientes.
          */

          if (
            i <
            pending.length - 1
          ) {

            await sleep(350);

          }

        }


        progressTitle.textContent =
          "Localização concluída.";


        geocodeStatus.textContent =
          `✓ ${success} localizados`;


        geocodeDetail.textContent =
          failed > 0
            ? `⚠️ ${failed} não localizados. Use "Falhas" para tentar novamente.`
            : "Todos os clientes foram localizados.";


        progressBar.style.width =
          "100%";


      } finally {

        /*
          MUITO IMPORTANTE:
          o botão sempre volta a funcionar,
          mesmo se ocorrer erro.
        */

        geocodeBtn.disabled = false;

        retryBtn.disabled = false;

        saveData();

        renderMarkers();

        renderSummary();

        renderNearbyList();

      }

    }

    function openDeliveryStatus(
      id
    ) {

      const delivery =
        deliveries.find(
          d =>
            Number(d.id) ===
            Number(id)
        );


      if (!delivery) {
        return;
      }


      currentModalId =
        delivery.id;


      modalTitle.textContent =
        delivery.label;


      modalAddress.textContent =
        delivery.address;


      observationInput.value =
        "";


      modalBackdrop.classList.add(
        "show"
      );

    }


    window.openDeliveryStatus =
      openDeliveryStatus;


    function closeModal() {

      modalBackdrop.classList.remove(
        "show"
      );

      currentModalId =
        null;

    }


    function setStatus(
      status
    ) {

      if (
        currentModalId == null
      ) {

        return;

      }


      const delivery =
        deliveries.find(
          d =>
            Number(d.id) ===
            Number(currentModalId)
        );


      if (!delivery) {
        return;
      }


      const observation =
        observationInput.value.trim();


      delivery.status =
        status;


      delivery.updatedAt =
        new Date().toISOString();


      if (
        !Array.isArray(
          delivery.actions
        )
      ) {

        delivery.actions = [];

      }


      delivery.actions.push({

        timestamp:
          delivery.updatedAt,

        status,

        observation,

        lat:
          delivery.lat,

        lon:
          delivery.lon

      });


      saveData();

      closeModal();

      renderMarkers();

      renderSummary();

      renderNearbyList();

    }

    function csvEscape(
      value
    ) {

      const text =
        String(
          value ?? ""
        );


      if (
        text.includes(";") ||
        text.includes('"') ||
        text.includes("\n")
      ) {

        return '"' +
          text.replace(
            /"/g,
            '""'
          ) +
          '"';

      }


      return text;

    }


    function exportCSV() {

      const headers = [

        "ID",

        "Entrega",

        "Endereco",

        "Status",

        "Atualizado_em",

        "Latitude",

        "Longitude",

        "Bairro_corrigido",

        "Localizacao_encontrada",

        "Fonte_localizacao"

      ];


      const rows =
        deliveries.map(
          delivery => [

            delivery.id,

            delivery.label,

            delivery.address,

            delivery.status,

            delivery.updatedAt || "",

            delivery.lat ?? "",

            delivery.lon ?? "",

            delivery.correctedNeighborhood || "",

            delivery.geocodeDisplayName || "",

            delivery.geocodeSource || ""

          ]
        );


      const csv =
        [
          headers,
          ...rows
        ]
          .map(
            row =>
              row
                .map(csvEscape)
                .join(";")
          )
          .join("\n");


      const blob =
        new Blob(
          [
            "\uFEFF" +
            csv
          ],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =
        "entregas_clientes_" +
        new Date()
          .toISOString()
          .slice(0, 10) +
        ".csv";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      URL.revokeObjectURL(
        url
      );

    }

      "click",
      locateUser
    );


    exportBtn.addEventListener(
      "click",
      exportCSV
    );


    mapToggle.addEventListener(
      "click",
      () => {

        const expanded =
          mapSection.classList.contains(
            "expanded"
          );


        if (expanded) {

          mapSection.classList.remove(
            "expanded"
          );

          mapToggle.textContent =
            "⛶ Expandir mapa";

          document.body.style.overflow =
            "";

        } else {

          mapSection.classList.add(
            "expanded"
          );

          mapToggle.textContent =
            "↙️ Fechar mapa";

          document.body.style.overflow =
            "hidden";

        }


        setTimeout(
          () => {

            if (map) {

              map.invalidateSize(
                true
              );

            }

          },
          250
        );

      }
    );


    modalBackdrop.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modalBackdrop
        ) {

          closeModal();

        }

      }
    );


    document
      .querySelectorAll(
        ".status-options button[data-status]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              setStatus(
                button.dataset.status
              );

            }
          );

        }
      );


    document
      .getElementById(
        "modalClose"
      )
      .addEventListener(
        "click",
        closeModal
      );


    window.addEventListener(
      "resize",
      () => {

        if (map) {

          setTimeout(
            () =>
              map.invalidateSize(
                true
              ),
            100
          );

        }

      }
    );


    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    function initializeApp() {

      loadStorage();

      initializeMap();

      renderMarkers();

      renderSummary();

      renderNearbyList();


      const located =
        deliveries.filter(
          d =>
            validCoordinates(
              d.lat,
              d.lon
            )
        ).length;


      const pending =
        deliveries.filter(
          d =>
            d.status === "PENDENTE"
        ).length;


      progressTitle.textContent =
        "Pronto.";


      if (
        deliveries.length === 0
      ) {

        geocodeStatus.textContent =
          "Nenhum cliente carregado.";

        geocodeDetail.textContent =
          "Verifique o arquivo clientes.js.";

      } else {

        geocodeStatus.textContent =
          `${located} de ${deliveries.length} clientes possuem localização.`;


        geocodeDetail.textContent =
          `${pending} entregas pendentes.`;

      }

    }


    initializeApp();


    /* =========================================================
       SERVICE WORKER
       ========================================================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./sw.js"
            )
            .catch(
              error =>
                console.warn(
                  "Service Worker:",
                  error
                )
            );

        }
      );

    }

  </script>

</body>
</html>
