<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Mapa de Entregas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #eef1f5;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    /* =========================================================
       CABEÇALHO COMPACTO
    ========================================================= */

    header {
      background: #101827;
      color: white;
      padding: 8px 10px 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title-area {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 21px;
      line-height: 1.05;
      font-weight: 800;
    }

    .subtitle {
      margin: 3px 0 0;
      font-size: 11px;
      color: #c8d0dd;
    }

    .counter {
      flex-shrink: 0;
      min-width: 62px;
      height: 50px;
      border-radius: 15px;
      background: #2864e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
    }

    /* =========================================================
       BOTÕES
    ========================================================= */

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 7px;
    }

    .toolbar button {
      border: 0;
      border-radius: 10px;
      min-height: 40px;
      padding: 5px 3px;
      font-size: 12px;
      font-weight: 800;
      color: white;
      cursor: pointer;
    }

    .btn-localizar {
      background: #2864e8;
    }

    .btn-gps {
      background: #079c6c;
    }

    .btn-falhas {
      background: #f08a00;
    }

    .btn-exportar {
      background: #526174;
    }

    .toolbar button:disabled {
      opacity: 0.55;
    }

    /* =========================================================
       MAPA
    ========================================================= */

    .map-wrapper {
      position: relative;
      width: 100%;
      background: #dce1e8;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 250px;
      min-height: 250px;
      background: #dce1e8;
    }

    .map-wrapper.expanded #map {
      height: calc(100vh - 35px);
      min-height: calc(100vh - 35px);
    }

    .map-toggle {
      position: absolute;
      z-index: 1000;
      top: 9px;
      right: 9px;
      border: 0;
      border-radius: 13px;
      background: white;
      color: #172033;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(0,0,0,0.22);
    }

    /* =========================================================
       PROGRESSO
    ========================================================= */

    .progress-section {
      background: white;
      padding: 9px 12px;
      border-bottom: 1px solid #d7dce4;
    }

    #geocodeStatus {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    #geocodeDetail {
      font-size: 12px;
      color: #697386;
      min-height: 16px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .progress-bg {
      width: 100%;
      height: 7px;
      border-radius: 20px;
      background: #e3e7ee;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #2864e8;
      transition: width 0.2s ease;
    }

    /* =========================================================
       LISTA
    ========================================================= */

    .list-header {
      background: white;
      padding: 10px 12px;
      border-bottom: 1px solid #d7dce4;
    }

    .list-header h2 {
      margin: 0;
      font-size: 18px;
    }

    #nearbyList {
      padding: 8px;
    }

    .delivery-card {
      background: white;
      border-radius: 13px;
      margin-bottom: 8px;
      padding: 11px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.08);
      border-left: 5px solid #2864e8;
    }

    .delivery-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .delivery-title {
      font-size: 17px;
      font-weight: 800;
    }

    .distance {
      color: #2864e8;
      font-weight: 800;
      white-space: nowrap;
      text-align: right;
      font-size: 15px;
    }

    .address {
      margin-top: 7px;
      color: #4d5869;
      font-size: 14px;
      line-height: 1.35;
    }

    .corrected-address {
      margin-top: 5px;
      color: #07865e;
      font-size: 12px;
      font-weight: 700;
    }

    .card-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 9px;
    }

    .card-buttons button {
      border: 0;
      border-radius: 10px;
      padding: 10px 7px;
      font-size: 14px;
      font-weight: 800;
      color: white;
    }

    .navigate-btn {
      background: #2864e8;
    }

    .status-btn {
      background: #687384;
    }

    .empty {
      background: white;
      border-radius: 13px;
      padding: 18px;
      text-align: center;
      color: #687384;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,0.55);
      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-box h3 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .modal-address {
      color: #687384;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .status-options {
      display: grid;
      gap: 7px;
    }

    .status-options button {
      border: 0;
      border-radius: 11px;
      padding: 13px;
      color: white;
      font-size: 15px;
      font-weight: 800;
    }

    .status-carta {
      background: #079c6c;
    }

    .status-nao {
      background: #f08a00;
    }

    .status-risco {
      background: #d9363e;
    }

    .status-pendente {
      background: #2864e8;
    }

    .close-modal {
      margin-top: 9px;
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 12px;
      background: #e5e8ed;
      font-weight: 800;
      font-size: 14px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 520px) {

      header {
        padding: 7px 9px 7px;
      }

      .title {
        font-size: 20px;
      }

      .subtitle {
        font-size: 10px;
      }

      .counter {
        min-width: 60px;
        height: 47px;
        font-size: 17px;
      }

      .toolbar {
        gap: 4px;
        margin-top: 6px;
      }

      .toolbar button {
        min-height: 38px;
        font-size: 11px;
        border-radius: 9px;
      }

      #map {
        height: 250px;
        min-height: 250px;
      }

      .map-wrapper.expanded #map {
        height: calc(100vh - 30px);
        min-height: calc(100vh - 30px);
      }

      .map-toggle {
        padding: 9px 11px;
        font-size: 13px;
      }

    }

  </style>

</head>

<script src="./clientes.js?v=20261006"></script>


<script>

  /* =========================================================
     CLIENTES
  ========================================================= */

  const CLIENTES_CARREGADOS =
    typeof CLIENTES !== "undefined" &&
    Array.isArray(CLIENTES)
      ? CLIENTES
      : [];


  /* =========================================================
     CONFIGURAÇÕES
  ========================================================= */

  const STORAGE_KEY =
    "mapa_entregas_clientes_v5";

  const OLD_STORAGE_KEYS = [
    "mapa_entregas_clientes_v4",
    "mapa_entregas_clientes_v3",
    "mapa_entregas_clientes_v2"
  ];

  const CACHE_KEY =
    "mapa_entregas_geocache_v5";

  const DEFAULT_CENTER = [
    -29.1678,
    -51.1794
  ];


  /* =========================================================
     VARIÁVEIS
  ========================================================= */

  let deliveries = [];

  let geocache = {};

  let userPosition = null;

  let userMarker = null;

  let userAccuracyCircle = null;

  let currentModalId = null;

  let markerById = {};

  let mapExpanded = false;

  let lastNominatimRequest = 0;

  let gpsRequestInProgress = false;


  /* =========================================================
     ELEMENTOS
  ========================================================= */

  const counter =
    document.getElementById("counter");

  const geocodeBtn =
    document.getElementById("geocodeBtn");

  const retryBtn =
    document.getElementById("retryBtn");

  const gpsBtn =
    document.getElementById("gpsBtn");

  const exportBtn =
    document.getElementById("exportBtn");

  const geocodeStatus =
    document.getElementById("geocodeStatus");

  const geocodeDetail =
    document.getElementById("geocodeDetail");

  const progressBar =
    document.getElementById("progressBar");

  const listTitle =
    document.getElementById("listTitle");

  const nearbyList =
    document.getElementById("nearbyList");

  const modal =
    document.getElementById("modal");

  const modalTitle =
    document.getElementById("modalTitle");

  const modalAddress =
    document.getElementById("modalAddress");

  const closeModal =
    document.getElementById("closeModal");

  const mapWrapper =
    document.getElementById("mapWrapper");

  const mapToggle =
    document.getElementById("mapToggle");


  /* =========================================================
     MAPA
  ========================================================= */

  const map =
    L.map("map", {
      zoomControl: true,
      preferCanvas: true
    }).setView(
      DEFAULT_CENTER,
      12
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "&copy; OpenStreetMap contributors",
      updateWhenZooming: false,
      updateWhenIdle: true
    }
  ).addTo(map);


  const markerLayer =
    L.layerGroup().addTo(map);


  /* =========================================================
     FUNÇÕES BÁSICAS
  ========================================================= */

  function wait(ms) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }


  function readJson(key) {

    try {

      const value =
        localStorage.getItem(key);

      if (!value) {
        return null;
      }

      return JSON.parse(value);

    } catch (error) {

      return null;

    }

  }


  function normalizeText(value) {

    return String(value || "")
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]+/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     COORDENADAS
  ========================================================= */

  function validCoordinates(
    lat,
    lon
  ) {

    const latitude =
      Number(lat);

    const longitude =
      Number(lon);

    return (
      Number.isFinite(latitude) &&
      Number.isFinite(longitude) &&
      latitude >= -90 &&
      latitude <= 90 &&
      longitude >= -180 &&
      longitude <= 180
    );

  }


  /*
    Corrige coordenadas invertidas.

    Também protege especificamente a região
    de Caxias do Sul contra sinais invertidos.
  */

  function normalizeCoordinatePair(
    lat,
    lon
  ) {

    let latitude =
      Number(lat);

    let longitude =
      Number(lon);


    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {

      return null;

    }


    /*
      Caso latitude/longitude tenham sido
      completamente invertidas.
    */

    if (
      Math.abs(latitude) > 40 &&
      Math.abs(longitude) < 40
    ) {

      const temp =
        latitude;

      latitude =
        longitude;

      longitude =
        temp;

    }


    /*
      Caxias do Sul está aproximadamente em:

      Latitude  -29
      Longitude -51

      Se vier +29 / -51, o sinal da latitude
      está invertido.

      Se vier -29 / +51, o sinal da longitude
      está invertido.
    */

    if (
      Math.abs(latitude) >= 25 &&
      Math.abs(latitude) <= 35 &&
      Math.abs(longitude) >= 45 &&
      Math.abs(longitude) <= 60
    ) {

      latitude =
        -Math.abs(latitude);

      longitude =
        -Math.abs(longitude);

    }


    if (
      !validCoordinates(
        latitude,
        longitude
      )
    ) {

      return null;

    }


    return {
      lat: latitude,
      lon: longitude
    };

  }


  /* =========================================================
     DISTÂNCIA HAVERSINE
  ========================================================= */

  function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const aLat =
      Number(lat1);

    const aLon =
      Number(lon1);

    const bLat =
      Number(lat2);

    const bLon =
      Number(lon2);


    if (
      !validCoordinates(
        aLat,
        aLon
      ) ||
      !validCoordinates(
        bLat,
        bLon
      )
    ) {

      return Infinity;

    }


    const R =
      6371;


    const dLat =
      (
        bLat -
        aLat
      ) *
      Math.PI /
      180;


    const dLon =
      (
        bLon -
        aLon
      ) *
      Math.PI /
      180;


    const lat1Rad =
      aLat *
      Math.PI /
      180;


    const lat2Rad =
      bLat *
      Math.PI /
      180;


    const a =
      Math.sin(
        dLat / 2
      ) ** 2 +

      Math.cos(
        lat1Rad
      ) *

      Math.cos(
        lat2Rad
      ) *

      Math.sin(
        dLon / 2
      ) ** 2;


    return (
      R *
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      )
    );

  }


  /* =========================================================
     ENDEREÇO
  ========================================================= */

  function getAddress(
    cliente
  ) {

    if (
      cliente.address
    ) {

      return cliente.address;

    }


    if (
      cliente.endereco
    ) {

      return cliente.endereco;

    }


    const parts = [];


    if (cliente.rua) {
      parts.push(cliente.rua);
    }

    if (cliente.numero) {
      parts.push(cliente.numero);
    }

    if (cliente.bairro) {
      parts.push(cliente.bairro);
    }

    if (cliente.cidade) {
      parts.push(cliente.cidade);
    }

    if (cliente.uf) {
      parts.push(cliente.uf);
    }


    return parts.join(", ");

  }


  function getAddressParts(
    delivery
  ) {

    const cliente =
      CLIENTES_CARREGADOS.find(
        c =>
          String(c.id) ===
          String(delivery.id)
      ) || {};


    if (
      cliente.rua ||
      cliente.numero ||
      cliente.bairro
    ) {

      return {

        rua:
          cliente.rua ||
          "",

        numero:
          String(
            cliente.numero ||
            ""
          ),

        bairro:
          cliente.bairro ||
          ""

      };

    }


    const address =
      delivery.address ||
      "";


    const parts =
      address
        .split(",")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);


    let rua =
      parts[0] ||
      "";


    let numero =
      parts[1] ||
      "";


    let bairro =
      parts[2] ||
      "";


    /*
      Remove informações extras
      depois do bairro.
    */

    if (
      !numero &&
      rua
    ) {

      const match =
        rua.match(
          /\b(\d{1,6})\b/
        );

      if (match) {

        numero =
          match[1];

      }

    }


    return {
      rua,
      numero,
      bairro
    };

  }


  /* =========================================================
     STORAGE
  ========================================================= */

  function saveData() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          deliveries
        )
      );

    } catch (error) {

      console.warn(
        "Não foi possível salvar os dados.",
        error
      );

    }

  }


  function saveCache() {

    try {

      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(
          geocache
        )
      );

    } catch (error) {

      console.warn(
        "Não foi possível salvar o cache.",
        error
      );

    }

  }


  function loadData() {

    let saved =
      readJson(
        STORAGE_KEY
      );


    if (
      !Array.isArray(saved)
    ) {

      for (
        const key
        of OLD_STORAGE_KEYS
      ) {

        const old =
          readJson(key);

        if (
          Array.isArray(old)
        ) {

          saved =
            old;

          break;

        }

      }

    }


    if (
      !Array.isArray(saved)
    ) {

      saved = [];

    }


    const savedById =
      new Map();


    saved.forEach(
      item => {

        savedById.set(
          String(item.id),
          item
        );

      }
    );


    geocache =
      readJson(
        CACHE_KEY
      ) || {};


    deliveries =
      CLIENTES_CARREGADOS.map(
        cliente => {

          const id =
            cliente.id;

          const old =
            savedById.get(
              String(id)
            ) || {};


          const address =
            getAddress(
              cliente
            );


          let coordinates =
            normalizeCoordinatePair(
              cliente.lat,
              cliente.lon
            );


          if (
            !coordinates
          ) {

            coordinates =
              normalizeCoordinatePair(
                old.lat,
                old.lon
              );

          }


          /*
            Cache do endereço.
          */

          if (
            !coordinates
          ) {

            const cached =
              geocache[
                normalizeText(
                  address
                )
              ];


            if (
              cached
            ) {

              coordinates =
                normalizeCoordinatePair(
                  cached.lat,
                  cached.lon
                );

            }

          }


          return {

            ...old,

            id,

            label:
              cliente.label ||
              old.label ||
              "Entrega " +
              id,

            address,

            endereco:
              cliente.endereco ||
              old.endereco ||
              address,

            status:
              old.status ||
              cliente.status ||
              "PENDENTE",

            lat:
              coordinates
                ? coordinates.lat
                : null,

            lon:
              coordinates
                ? coordinates.lon
                : null,

            updatedAt:
              old.updatedAt ||
              null,

            correctedNeighborhood:
              old.correctedNeighborhood ||
              "",

            geocodeDisplayName:
              old.geocodeDisplayName ||
              "",

            geocodeSource:
              old.geocodeSource ||
              "",

            geocodeError:
              old.geocodeError ||
              "",

            actions:
              Array.isArray(
                old.actions
              )
                ? old.actions
                : []

          };

        }
      );


    saveData();

    renderAll();

  }

  /* =========================================================
     LISTA — TODOS OS CLIENTES
  ========================================================= */

  function renderNearby() {

    nearbyList.innerHTML = "";


    const pending =
      deliveries.filter(
        d =>
          d.status ===
          "PENDENTE"
      );


    if (
      pending.length === 0
    ) {

      nearbyList.innerHTML = `
        <div class="empty">
          Todas as entregas pendentes
          foram concluídas.
        </div>
      `;

      return;

    }


    /*
      IMPORTANTE:

      Não usamos slice().
      Portanto TODOS os clientes
      serão exibidos.
    */


    if (
      !userPosition
    ) {

      pending.forEach(
        d => {

          createDeliveryCard(
            d,
            null
          );

        }
      );

      return;

    }


    const sorted =
      pending
        .map(
          d => {

            const coordinates =
              normalizeCoordinatePair(
                d.lat,
                d.lon
              );


            const distance =
              coordinates
                ? distanceKm(
                    userPosition.lat,
                    userPosition.lon,
                    coordinates.lat,
                    coordinates.lon
                  )
                : Infinity;


            return {
              delivery: d,
              distance
            };

          }
        )
        .sort(
          (a, b) =>
            a.distance -
            b.distance
        );


    sorted.forEach(
      item => {

        createDeliveryCard(
          item.delivery,
          item.distance
        );

      }
    );

  }


  function createDeliveryCard(
    d,
    distance
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "delivery-card";


    let distanceText;


    if (
      distance === null
    ) {

      distanceText =
        "📍 GPS";

    }

    else if (
      !Number.isFinite(
        distance
      )
    ) {

      distanceText =
        "Sem localização";

    }

    else if (
      distance < 1
    ) {

      distanceText =
        `${Math.round(
          distance * 1000
        )} m`;

    }

    else {

      distanceText =
        `${distance.toFixed(
          1
        )} km`;

    }


    const corrected =
      d.correctedNeighborhood
        ? `
          <div class="corrected-address">
            📍 Bairro localizado:
            ${escapeHtml(
              d.correctedNeighborhood
            )}
          </div>
        `
        : "";


    card.innerHTML = `

      <div class="delivery-top">

        <div class="delivery-title">
          Entrega ${escapeHtml(d.id)}
        </div>

        <div class="distance">
          ${distanceText}
        </div>

      </div>

      <div class="address">
        ${escapeHtml(d.address)}
      </div>

      ${corrected}

      <div class="card-buttons">

        <button class="navigate-btn">
          🧭 Navegar
        </button>

        <button class="status-btn">
          📋 Status
        </button>

      </div>

    `;


    card
      .querySelector(
        ".navigate-btn"
      )
      .addEventListener(
        "click",
        () => {

          navigateTo(d);

        }
      );


    card
      .querySelector(
        ".status-btn"
      )
      .addEventListener(
        "click",
        () => {

          openStatus(
            d.id
          );

        }
      );


    nearbyList.appendChild(
      card
    );

  }

  function navigateTo(

  ) {

        d.lon
      );


    if (
      !coordinates
    ) {

      );

    }


    const url =
      "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(
        `${coordinates.lat},${coordinates.lon}`
      );


    window.open(
      url,
      "_blank"
    );

  function navigateToById(
    id
  ) {

      deliveries.find(
        d =>
          String(d.id) ===
          String(id)
      );


    if (
      delivery
    ) {

      navigateTo(
        delivery
      );

    }

  }


  window.navigateToById =
    navigateToById;


  /* =========================================================
     GPS — CORRIGIDO
  ========================================================= */

  function showUserPosition(
    latitude,
    longitude,
    accuracy
  ) {

    const coordinates =
      normalizeCoordinatePair(
        latitude,
        longitude
      );


    if (
      !coordinates
    ) {

      throw new Error(
        "GPS retornou coordenadas inválidas."
      );

    }


    userPosition = {

      lat:
        coordinates.lat,

      lon:
        coordinates.lon,

      accuracy:
        Number(
          accuracy
        ) || 0

    };


    /*
      Remove marcador anterior.
    */

    if (
      userMarker
    ) {

      map.removeLayer(
        userMarker
      );

    }


    if (
      userAccuracyCircle
    ) {

      map.removeLayer(
        userAccuracyCircle
      );

    }


    /*
      Círculo da precisão.
    */

    if (
      userPosition.accuracy > 0
    ) {

      userAccuracyCircle =
        L.circle(
          [
            userPosition.lat,
            userPosition.lon
          ],
          {
            radius:
              userPosition.accuracy,

            color:
              "#2864e8",

            weight:
              1,

            fillColor:
              "#2864e8",

            fillOpacity:
              0.10
          }
        )
        .addTo(map);

    }


    /*
      Marcador do usuário.
    */

    userMarker =
      L.circleMarker(
        [
          userPosition.lat,
          userPosition.lon
        ],
        {
          radius: 11,
          color: "#ffffff",
          weight: 4,
          fillColor: "#2864e8",
          fillOpacity: 1
        }
      )
      .addTo(map);


    userMarker.bindPopup(`
      <b>📍 Você está aqui</b>
      <br>
      Precisão aproximada:
      ${Math.round(
        userPosition.accuracy
      )} metros
    `);


    userMarker.openPopup();


    /*
      Centraliza o mapa.
    */

    map.setView(
      [
        userPosition.lat,
        userPosition.lon
      ],
      16
    );


    geocodeStatus.textContent =
      "📍 GPS localizado com sucesso.";


    geocodeDetail.textContent =
      `Precisão aproximada: ${Math.round(
        userPosition.accuracy
      )} metros. Lista ordenada pela sua localização atual.`;


    renderNearby();


    /*
      Corrige o tamanho do mapa
      depois de centralizar.
    */

    fixMapSize();

  }


  function requestGPS(
    automatic = false
  ) {

    if (
      gpsRequestInProgress
    ) {

      return;

    }


    if (
      !navigator.geolocation
    ) {

      geocodeStatus.textContent =
        "⚠️ GPS não disponível.";

      geocodeDetail.textContent =
        "Seu navegador não disponibilizou a localização.";

      return;

    }


    gpsRequestInProgress =
      true;


    gpsBtn.disabled =
      true;

    gpsBtn.textContent =
      "📍 Obtendo...";


    if (
      automatic
    ) {

      geocodeStatus.textContent =
        "📍 Obtendo sua localização...";

      geocodeDetail.textContent =
        "Aguardando o GPS do celular.";

    }


    navigator.geolocation.getCurrentPosition(

      position => {

        try {

          showUserPosition(
            position.coords.latitude,
            position.coords.longitude,
            position.coords.accuracy
          );

        } catch (error) {

          userPosition =
            null;

          geocodeStatus.textContent =
            "⚠️ GPS retornou uma localização inválida.";

          geocodeDetail.textContent =
            "Toque novamente em 📍 GPS.";

        }


        gpsRequestInProgress =
          false;

        gpsBtn.disabled =
          false;

        gpsBtn.textContent =
          "📍 GPS";

      },


      error => {

        gpsRequestInProgress =
          false;

        gpsBtn.disabled =
          false;

        gpsBtn.textContent =
          "📍 GPS";


        userPosition =
          null;


        renderNearby();


        let message =
          "Não foi possível obter sua localização.";


        if (
          error.code ===
          1
        ) {

          message =
            "Permissão de localização negada.";

        }

        else if (
          error.code ===
          2
        ) {

          message =
            "O celular não conseguiu determinar sua localização.";

        }

        else if (
          error.code ===
          3
        ) {

          message =
            "O GPS demorou demais para responder.";

        }


        geocodeStatus.textContent =
          "⚠️ GPS não localizado.";

        geocodeDetail.textContent =
          message;


        if (
          !automatic
        ) {

          alert(
            message
          );

        }

      },

      {
        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:
          0

      }

    );

  }


  gpsBtn.addEventListener(
    "click",
    () => {

      requestGPS(
        false
      );

    }
  );

  /* =========================================================
     CORREÇÃO DOS ESPAÇOS CINZENTOS DO LEAFLET
  ========================================================= */

  function fixMapSize() {

    const delays = [
      50,
      200,
      500,
      900
    ];


    delays.forEach(
      delay => {

        setTimeout(
          () => {

            try {

              map.invalidateSize({
                pan: false,
                animate: false
              });

            } catch (error) {}

          },
          delay
        );

      }
    );

  }


  /*
    Observa mudanças reais no tamanho do mapa.
  */

  if (
    "ResizeObserver" in window
  ) {

    const resizeObserver =
      new ResizeObserver(
        () => {

          fixMapSize();

        }
      );


    resizeObserver.observe(
      mapWrapper
    );

  }


  window.addEventListener(
    "resize",
    fixMapSize
  );


  window.addEventListener(
    "orientationchange",
    () => {

      setTimeout(
        fixMapSize,
        300
      );

    }
  );


  /* =========================================================
     NOMINATIM
  ========================================================= */

  async function waitNominatimGap() {

    const now =
      Date.now();


    const elapsed =
      now -
      lastNominatimRequest;


    const minimumGap =
      1200;


    if (
      elapsed <
      minimumGap
    ) {

      await wait(
        minimumGap -
        elapsed
      );

    }

  }


  async function fetchNominatim(
    query
  ) {

    await waitNominatimGap();


    lastNominatimRequest =
      Date.now();


    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => {

          controller.abort();

        },
        9000
      );


    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&limit=8" +
      "&countrycodes=br" +
      "&accept-language=pt-BR" +
      "&q=" +
      encodeURIComponent(
        query
      );


    try {

      const response =
        await fetch(
          url,
          {
            signal:
              controller.signal,

            headers: {
              Accept:
                "application/json"
            }
          }
        );


      if (
        response.status ===
        429
      ) {

        await wait(
          4000
        );

        throw new Error(
          "Limite do serviço de localização atingido."
        );

      }


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return await response.json();

    }

    finally {

      clearTimeout(
        timeout
      );

    }

  }


  /* =========================================================
     COMPARAÇÃO DE ENDEREÇOS
  ========================================================= */

  function tokenOverlap(
    a,
    b
  ) {

    const A =
      new Set(
        normalizeText(a)
          .split(" ")
          .filter(
            x =>
              x.length > 1
          )
      );


    const B =
      new Set(
        normalizeText(b)
          .split(" ")
          .filter(
            x =>
              x.length > 1
          )
      );


    if (
      A.size === 0
    ) {

      return 0;

    }


    let matches =
      0;


    A.forEach(
      token => {

        if (
          B.has(token)
        ) {

          matches++;

        }

      }
    );


    return (
      matches /
      A.size
    );

  }


  function resultCityOK(
    result
  ) {

    const a =
      result.address ||
      {};


    const city =
      normalizeText(
        a.city ||
        a.town ||
        a.municipality ||
        a.village ||
        ""
      );


    const state =
      normalizeText(
        a.state ||
        ""
      );


    const display =
      normalizeText(
        result.display_name ||
        ""
      );


    const cityOK =
      city.includes(
        "caxias do sul"
      ) ||
      display.includes(
        "caxias do sul"
      );


    const stateOK =
      state === "" ||
      state.includes(
        "rio grande do sul"
      ) ||
      state === "rs" ||
      display.includes(
        "rio grande do sul"
      );


    return (
      cityOK &&
      stateOK
    );

  }


  function getResultNeighborhood(
    result
  ) {

    const a =
      result.address ||
      {};


    return (
      a.neighbourhood ||
      a.suburb ||
      a.quarter ||
      a.residential ||
      a.city_district ||
      ""
    );

  }


  function chooseBestResult(
    results,
    parts
  ) {

    if (
      !Array.isArray(
        results
      )
    ) {

      return null;

    }


    const valid =
      results.filter(
        result =>
          resultCityOK(
            result
          )
      );


    if (
      valid.length === 0
    ) {

      return null;

    }


    const scored =
      valid.map(
        result => {

          const a =
            result.address ||
            {};


          const road =
            a.road ||
            a.pedestrian ||
            a.residential ||
            "";


          const houseNumber =
            String(
              a.house_number ||
              ""
            );


          const inputNumber =
            String(
              parts.numero ||
              ""
            ).replace(
              /\D/g,
              ""
            );


          const resultNumber =
            houseNumber.replace(
              /\D/g,
              ""
            );


          const roadScore =
            tokenOverlap(
              parts.rua,
              road ||
              result.display_name
            );


          const neighborhood =
            getResultNeighborhood(
              result
            );


          const neighborhoodScore =
            tokenOverlap(
              parts.bairro,
              neighborhood ||
              result.display_name
            );


          let score =
            100;


          score +=
            roadScore *
            40;


          if (
            inputNumber &&
            resultNumber &&
            inputNumber ===
            resultNumber
          ) {

            score +=
              55;

          }


          score +=
            neighborhoodScore *
            45;


          if (
            result.type ===
            "house"
          ) {

            score +=
              15;

          }


          if (
            result.type ===
            "building"
          ) {

            score +=
              10;

          }


          return {

            result,

            score,

            neighborhoodScore,

            roadScore

          };

        }
      );


    scored.sort(
      (a, b) =>
        b.score -
        a.score
    );


    return scored[0];

  }


  /* =========================================================
     GEOCODIFICAÇÃO
  ========================================================= */

  async function geocodeOne(
    delivery,
    detailCallback
  ) {

    const cacheKey =
      normalizeText(
        delivery.address
      );


    /*
      CACHE
    */

    const cached =
      geocache[
        cacheKey
      ];


    if (
      cached &&
      validCoordinates(
        cached.lat,
        cached.lon
      )
    ) {

      const normalized =
        normalizeCoordinatePair(
          cached.lat,
          cached.lon
        );


      if (
        normalized
      ) {

        delivery.lat =
          normalized.lat;

        delivery.lon =
          normalized.lon;

        delivery.correctedNeighborhood =
          cached.correctedNeighborhood ||
          "";

        delivery.geocodeDisplayName =
          cached.displayName ||
          "";

        delivery.geocodeSource =
          cached.source ||
          "cache";

        return true;

      }

    }


    const parts =
      getAddressParts(
        delivery
      );


    const queries = [];


    /*
      TENTATIVA 1
      Rua + número
    */

    if (
      parts.rua &&
      parts.numero
    ) {

      queries.push({

        label:
          "Rua + número",

        query:
          `${parts.rua}, ${parts.numero}, Caxias do Sul, RS, Brasil`

      });

    }


    /*
      TENTATIVA 2
      Rua + número + bairro
    */

    if (
      parts.rua &&
      parts.numero &&
      parts.bairro
    ) {

      queries.push({

        label:
          "Rua + número + bairro",

        query:
          `${parts.rua}, ${parts.numero}, ${parts.bairro}, Caxias do Sul, RS, Brasil`

      });

    }


    /*
      TENTATIVA 3
      Endereço original
    */

    queries.push({

      label:
        "Endereço original",

      query:
        `${delivery.address}, Caxias do Sul, RS, Brasil`

    });


    let firstResult =
      null;


    for (
      let i = 0;
      i < queries.length;
      i++
    ) {

      const attempt =
        queries[i];


      if (
        detailCallback
      ) {

        detailCallback(
          `${attempt.label}: ${attempt.query}`
        );

      }


      try {

        const results =
          await fetchNominatim(
            attempt.query
          );


        const best =
          chooseBestResult(
            results,
            parts
          );


        if (
          best
        ) {

          if (
            !firstResult
          ) {

            firstResult = {

              ...best,

              label:
                attempt.label

            };

          }


          /*
            Quando o bairro bate,
            damos prioridade a ele.
          */

          if (
            attempt.label ===
            "Rua + número + bairro"
          ) {

            if (
              best.neighborhoodScore >=
              0.30
            ) {

              return applyGeocode(
                delivery,
                best.result,
                attempt.label
              );

            }

          }


          /*
            Se não existe bairro,
            podemos aceitar a primeira
            localização boa.
          */

          else if (
            !parts.bairro &&
            attempt.label ===
            "Rua + número"
          ) {

            return applyGeocode(
              delivery,
              best.result,
              attempt.label
            );

          }

        }

      }

      catch (
        error
      ) {

        console.warn(
          "Falha ao localizar:",
          attempt.query,
          error
        );

      }

    }


    /*
      Se alguma tentativa encontrou
      alguma coisa válida, usamos ela.
    */

    if (
      firstResult
    ) {

      return applyGeocode(
        delivery,
        firstResult.result,
        firstResult.label
      );

    }


    delivery.geocodeError =
      "Nenhuma localização encontrada.";


    return false;

  }


  function applyGeocode(
    delivery,
    result,
    source
  ) {

    const normalized =
      normalizeCoordinatePair(
        result.lat,
        result.lon
      );


    if (
      !normalized
    ) {

      return false;

    }


    const neighborhood =
      getResultNeighborhood(
        result
      );


    delivery.lat =
      normalized.lat;

    delivery.lon =
      normalized.lon;

    delivery.correctedNeighborhood =
      neighborhood ||
      "";

    delivery.geocodeDisplayName =
      result.display_name ||
      "";

    delivery.geocodeSource =
      source;

    delivery.geocodeError =
      "";


    geocache[
      normalizeText(
        delivery.address
      )
    ] = {

      lat:
        normalized.lat,

      lon:
        normalized.lon,

      correctedNeighborhood:
        neighborhood ||
        "",

      displayName:
        result.display_name ||
        "",

      source,

      savedAt:
        new Date().toISOString()

    };


    saveCache();


    return true;

  }


  /* =========================================================
     LOCALIZAR TODOS
  ========================================================= */

  async function geocodeAll() {

    if (
      CLIENTES_CARREGADOS.length ===
      0
    ) {

      alert(
        "Nenhum cliente foi carregado."
      );

      return;

    }


    const pending =
      deliveries.filter(
        d =>
          d.status ===
          "PENDENTE" &&
          !validCoordinates(
            d.lat,
            d.lon
          )
      );


    if (
      pending.length === 0
    ) {

      geocodeStatus.textContent =
        "Todos os clientes pendentes já possuem localização.";

      geocodeDetail.textContent =
        "Nenhuma nova localização necessária.";

      progressBar.style.width =
        "100%";

      renderAll();

      return;

    }


    geocodeBtn.disabled =
      true;

    retryBtn.disabled =
      true;

    gpsBtn.disabled =
      true;


    let success =
      0;

    let failed =
      0;


    progressBar.style.width =
      "0%";


    try {

      for (
        let i = 0;
        i < pending.length;
        i++
      ) {

        const d =
          pending[i];


        geocodeStatus.textContent =
          `Localizando ${i + 1} de ${pending.length}`;


        geocodeDetail.textContent =
          d.address;


        const ok =
          await geocodeOne(
            d,
            detail => {

              geocodeDetail.textContent =
                detail;

            }
          );


        if (
          ok
        ) {

          success++;

        }

        else {

          failed++;

        }


        const percent =
          (
            (i + 1) /
            pending.length
          ) *
          100;


        progressBar.style.width =
          percent +
          "%";


        saveData();

        renderAll();


        await wait(
          150
        );

      }


      geocodeStatus.textContent =
        `Concluído: ${success} localizados, ${failed} não localizados.`;


      geocodeDetail.textContent =
        failed > 0
          ? "Os que falharam podem ser tentados novamente."
          : "Todos os clientes foram localizados.";

    }

    finally {

      geocodeBtn.disabled =
        false;

      retryBtn.disabled =
        false;

      gpsBtn.disabled =
        false;

    }

  }


  geocodeBtn.addEventListener(
    "click",
    () => {

      geocodeAll();

    }
  );


  retryBtn.addEventListener(
    "click",
    () => {

      geocodeAll();

    }
  );


  /* =========================================================
     STATUS
  ========================================================= */

  function openStatus(
    id
  ) {

    const delivery =
      deliveries.find(
        d =>
          String(d.id) ===
          String(id)
      );


    if (
      !delivery
    ) {

      return;

    }


    currentModalId =
      delivery.id;


    modalTitle.textContent =
      `Entrega ${delivery.id}`;


    modalAddress.textContent =
      delivery.address;


    modal.classList.add(
      "show"
    );

  }


  window.openStatus =
    openStatus;


  closeModal.addEventListener(
    "click",
    () => {

      modal.classList.remove(
        "show"
      );

      currentModalId =
        null;

    }
  );


  modal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        modal
      ) {

        modal.classList.remove(
          "show"
        );

        currentModalId =
          null;

      }

    }
  );


  document
    .querySelectorAll(
      ".status-options button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (
              currentModalId ===
              null
            ) {

              return;

            }


            const delivery =
              deliveries.find(
                d =>
                  String(d.id) ===
                  String(
                    currentModalId
                  )
              );


            if (
              !delivery
            ) {

              return;

            }


            const newStatus =
              button.dataset.status;


            const now =
              new Date()
                .toISOString();


            delivery.status =
              newStatus;


            delivery.updatedAt =
              now;


            if (
              !Array.isArray(
                delivery.actions
              )
            ) {

              delivery.actions =
                [];

            }


            /*
              REGISTRO DA AÇÃO

              Guarda:
              - status
              - data/hora
              - endereço original
              - latitude
              - longitude
              - posição do GPS no momento
            */

            delivery.actions.push({

              status:
                newStatus,

              timestamp:
                now,

              address:
                delivery.address,

              lat:
                validCoordinates(
                  delivery.lat,
                  delivery.lon
                )
                  ? Number(
                      delivery.lat
                    )
                  : null,

              lon:
                validCoordinates(
                  delivery.lat,
                  delivery.lon
                )
                  ? Number(
                      delivery.lon
                    )
                  : null,

              gpsLat:
                userPosition
                  ? userPosition.lat
                  : null,

              gpsLon:
                userPosition
                  ? userPosition.lon
                  : null,

              gpsAccuracy:
                userPosition
                  ? userPosition.accuracy
                  : null

            });


            saveData();

            renderAll();


            modal.classList.remove(
              "show"
            );


            currentModalId =
              null;

          }
        );

      }
    );


  /* =========================================================
     EXPORTAR CSV
  ========================================================= */

  function csvEscape(
    value
  ) {

    const text =
      String(
        value === null ||
        value === undefined
          ? ""
          : value
      );


    return (
      '"' +
      text.replace(
        /"/g,
        '""'
      ) +
      '"'
    );

  }


  function exportCSV() {

    const headers = [

      "ID",

      "Endereco",

      "Status",

      "Atualizado_em",

      "Latitude",

      "Longitude",

      "Bairro_corrigido",

      "Endereco_localizado",

      "Fonte_localizacao",

      "Acoes"

    ];


    const rows =
      deliveries.map(
        d => [

          d.id,

          d.address,

          d.status,

          d.updatedAt ||
            "",

          validCoordinates(
            d.lat,
            d.lon
          )
            ? d.lat
            : "",

          validCoordinates(
            d.lat,
            d.lon
          )
            ? d.lon
            : "",

          d.correctedNeighborhood ||
            "",

          d.geocodeDisplayName ||
            "",

          d.geocodeSource ||
            "",

          JSON.stringify(
            d.actions ||
            []
          )

        ]
      );


    let csv =
      headers
        .map(
          csvEscape
        )
        .join(";") +
      "\n";


    rows.forEach(
      row => {

        csv +=
          row
            .map(
              csvEscape
            )
            .join(";") +
          "\n";

      }
    );


    const blob =
      new Blob(
        [
          "\ufeff" +
          csv
        ],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;


    a.download =
      "clientes_corrigidos.csv";


    document.body.appendChild(
      a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
      url
    );

  }


  exportBtn.addEventListener(
    "click",
    exportCSV
  );


  /* =========================================================
     RENDERIZAÇÃO GERAL
  ========================================================= */

  function renderAll() {

    renderSummary();

    renderMarkers();

    renderNearby();

    fixMapSize();

  }


  /* =========================================================
     INICIALIZAÇÃO
  ========================================================= */

  if (
    CLIENTES_CARREGADOS.length ===
    0
  ) {

    geocodeStatus.textContent =
      "⚠️ Nenhum cliente carregado.";

    geocodeDetail.textContent =
      "O arquivo clientes.js não foi carregado.";

    progressBar.style.width =
      "0%";

  }

  else {

    geocodeStatus.textContent =
      "Pronto.";

    geocodeDetail.textContent =
      `${CLIENTES_CARREGADOS.length} clientes carregados.`;

  }


  loadData();


  /*
    Várias correções de tamanho
    porque o navegador do celular
    pode calcular o tamanho da tela
    depois do Leaflet.
  */

  fixMapSize();


  setTimeout(
    fixMapSize,
    400
  );


  setTimeout(
    fixMapSize,
    1000
  );


  /*
    GPS automático.
  */

  setTimeout(
    () => {

      requestGPS(
        true
      );

    },
    800
  );


  /* =========================================================
     SERVICE WORKER
  ========================================================= */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker
      .register(
        "./sw.js"
      )
      .then(
        registration => {

          if (
            registration &&
            registration.update
          ) {

            registration.update();

          }

        }
      )
      .catch(
        () => {}
      );

  }

</script>
