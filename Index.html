<style>
:root{
  --bg:#eef2f5;
  --card:#fff;
  --dark:#111827;
  --dark2:#1f2937;
  --text:#111827;
  --muted:#64748b;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --line:#dbe2ea;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:24px;
}

header{
  background:#000;
  color:#fff;
  padding:18px 18px 16px;
  position:sticky;
  top:0;
  z-index:1000;
}

header h1{
  font-size:24px;
  margin:0 0 6px;
}

header p{
  margin:0;
  color:#cbd5e1;
  font-size:13px;
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:4px 0 10px;
}

.stat{
  background:var(--dark2);
  color:#fff;
  border-radius:14px;
  padding:11px 6px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat span{
  font-size:12px;
  color:#cbd5e1;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:9px;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 12px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}
